{{- if and .Values.clickhouse.enabled (eq (include "clickhouse.operatorEnabled" .) "true") .Values.clickhouse.hooks.uninstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clickhouse.fullname" . }}-uninstall
  namespace: {{ include "clickhouse.namespace" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
    spec:
      {{- include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.clickhouse.imagePullSecrets)) | nindent 6 }}
      serviceAccountName: {{ include "clickhouse.fullname" . }}-uninstall
      restartPolicy: Never
      {{- with .Values.clickhouse.hooks.uninstall.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.clickhouse.hooks.uninstall.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.hooks.uninstall.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.hooks.uninstall.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.hooks.uninstall.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.clickhouse.hooks.uninstall.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: uninstall
          image: {{ include "signoz.lib.image" (dict "registry" .Values.global.imageRegistry "image" .Values.clickhouse.hooks.uninstall.image "name" "clickhouse.hooks.uninstall.image") }}
          imagePullPolicy: {{ .Values.clickhouse.hooks.uninstall.image.pullPolicy }}
          # Run without a shell: registry.k8s.io/kubectl is distroless.
          # Helm removes the operator before the installations, and only the operator can
          # finish deleting them. So they are deleted here, while the operator still runs.
          command:
            - kubectl
          args:
            - delete
            - clickhouseinstallations.clickhouse.altinity.com/{{ include "clickhouse.fullname" . }}
            {{- if .Values.keeper.enabled }}
            - clickhousekeeperinstallations.clickhouse-keeper.altinity.com/{{ include "keeper.fullname" . }}
            {{- end }}
            - --namespace={{ include "clickhouse.namespace" . }}
            - --ignore-not-found=true
            - --wait=true
          {{- with .Values.clickhouse.hooks.uninstall.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.clickhouse.hooks.uninstall.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
