# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: keeper_coordination-hosts_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
  - templates/keeper/clickhousekeeperinstallation.yaml
release:
  name: signoz
  namespace: signoz
tests:
  - it: uses clickhouse.externalZookeeper.servers when set
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      clickhouse.externalZookeeper.servers:
        - host: zk-0.example
          port: 2181
        - host: zk-1.example
          port: 2182
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: zk-0.example
              port: 2181
            - host: zk-1.example
              port: 2182
      - notContains:
          path: spec.configuration.zookeeper.nodes
          content:
            host: keeper-signoz-keeper
            port: 2181
  - it: uses the ZooKeeper headless Service when zookeeper.enabled
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      zookeeper.enabled: true
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: signoz-zookeeper-0.signoz-zookeeper-headless
              port: 2181
  - it: appends the ZooKeeper namespace when zookeeper.namespaceOverride differs from clickhouse.namespace
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      zookeeper.enabled: true
      zookeeper.namespaceOverride: zk
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: signoz-zookeeper-0.signoz-zookeeper-headless.zk.svc.cluster.local
              port: 2181
  - it: lists one node per ZooKeeper replica
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      zookeeper.enabled: true
      zookeeper.replicaCount: 3
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: signoz-zookeeper-0.signoz-zookeeper-headless
              port: 2181
            - host: signoz-zookeeper-1.signoz-zookeeper-headless
              port: 2181
            - host: signoz-zookeeper-2.signoz-zookeeper-headless
              port: 2181
  - it: uses the Keeper client Service with defaults
    template: templates/clickhouse/clickhouseinstallation.yaml
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: keeper-signoz-keeper
              port: 2181
  - it: renames the Keeper installation and the host together with keeper.fullnameOverride
    set:
      keeper.fullnameOverride: ck
    asserts:
      - template: templates/keeper/clickhousekeeperinstallation.yaml
        equal:
          path: metadata.name
          value: ck
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: keeper-ck
              port: 2181
  - it: prefers ZooKeeper when zookeeper.enabled and keeper.enabled are both true
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      zookeeper.enabled: true
      keeper.enabled: true
    asserts:
      - equal:
          path: spec.configuration.zookeeper.nodes
          value:
            - host: signoz-zookeeper-0.signoz-zookeeper-headless
              port: 2181
  - it: fails when no coordination store is on
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      zookeeper.enabled: false
      keeper.enabled: false
    asserts:
      - failedTemplate:
          errorMessage: "no coordination store for ClickHouse: set `clickhouse.externalZookeeper.servers`, `zookeeper.enabled: true` or `keeper.enabled: true`."
