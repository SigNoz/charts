# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: collector/ingress
templates:
  - templates/otel-collector/ingress.yaml
  - templates/otel-collector/service.yaml
tests:
  - it: routes each otelCollector.ingress host and path to the collector Service on the path's port
    set:
      otelCollector.ingress:
        enabled: true
        className: nginx
        annotations:
          nginx.ingress.kubernetes.io/backend-protocol: GRPC
        hosts:
          - host: otlp.example.com
            paths:
              - path: /
                pathType: Prefix
                port: 4317
        tls:
          - secretName: otlp-tls
            hosts: [otlp.example.com]
    asserts:
      - template: templates/otel-collector/ingress.yaml
        equal:
          path: spec.rules[?(@.host == "otlp.example.com")].http.paths[?(@.path == "/")].backend
          value:
            service:
              name: RELEASE-NAME-signoz-otel-collector
              port: {number: 4317}
      - template: templates/otel-collector/service.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz-otel-collector

  - it: routes a collector Ingress path without a port to otelCollector.ports.otlp-http.servicePort on the collector Service
    set:
      otelCollector.ports.otlp-http.servicePort: 4319
      otelCollector.ingress:
        enabled: true
        hosts:
          - host: otlp.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - template: templates/otel-collector/ingress.yaml
        equal:
          path: spec.rules[?(@.host == "otlp.example.com")].http.paths[?(@.path == "/")].backend.service.port.number
          value: 4319
      - template: templates/otel-collector/service.yaml
        contains:
          path: spec.ports
          content: {name: otlp-http, port: 4319}
          any: true
