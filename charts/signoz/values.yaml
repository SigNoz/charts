# global -- Global override values for the chart.
# @section -- Global Settings
global:
  # global.imageRegistry -- Overrides the Image registry globally for all components.
  # @default -- null
  # @section -- Global Settings
  imageRegistry: &GLOBAL_IMAGE_REGISTRY null
  # Each component's pod lists these first, then the root `imagePullSecrets`,
  # then the component's own `imagePullSecrets`; a name in more than one list
  # is listed once. They do not reach the operator pod or its CRD hook, which
  # read `altinity-clickhouse-operator.imagePullSecrets` and
  # `altinity-clickhouse-operator.crdHook.imagePullSecrets`.
  # -- Secrets for pulling images from a private registry.
  # @section -- Global Settings
  imagePullSecrets: []
  # global.storageClass -- StorageClass of the SigNoz, ClickHouse and ZooKeeper claims; when set, it overrides their own `persistence.storageClass`.
  # When neither is set, the cluster's default StorageClass is used; "-" renders an empty storageClassName, which disables dynamic provisioning.
  # @default -- null
  # @section -- Global Settings
  storageClass: null
  # global.clusterDomain -- The Kubernetes cluster domain.
  # ClickHouse, its operator and ZooKeeper build their pods' host names on it, as does the address of a component in another namespace.
  # @default -- "cluster.local"
  # @section -- Global Settings
  clusterDomain: cluster.local
  # global.clusterName -- The Kubernetes cluster name.
  # It is used to attach to telemetry data via the resource detection processor.
  # @default -- ""
  # @section -- Global Settings
  clusterName: ""
  # global.cloud -- The Kubernetes cluster cloud provider and distribution (if any).
  # example: `aws`, `azure`, `gcp`, `gcp/autogke`, `hcloud`, `other`
  # The storage class for persistent volumes is selected based on this value.
  # When set to 'aws' or 'gcp' with `installCustomStorageClass` enabled, a new expandable storage class is created.
  # @default -- "other"
  # @section -- Global Settings
  cloud: other
# -- Override the default chart name.
# @section -- General Settings
# @default -- ""
nameOverride: ""
# -- Override the default full chart name.
# @section -- General Settings
# @default -- ""
fullnameOverride: ""
# -- Name of the K8s cluster. Used by SigNoz OtelCollectors to attach to telemetry data.
# @section -- General Settings
# @default -- ""
clusterName: ""
# Each component's pod lists `global.imagePullSecrets` first, then these, then
# the component's own `imagePullSecrets`; a name in more than one list is
# listed once.
# -- Secrets for pulling images from a private registry.
# @section -- General Settings
imagePullSecrets: []
# - "signoz-pull-secret"

# clickhouse -- The ClickHouse this chart installs, a ClickHouseInstallation that the operator from `altinity-clickhouse-operator` reconciles.
# @default -- "See values.yaml"
# @section -- ClickHouse
clickhouse:
  # clickhouse.enabled -- Install ClickHouse, with the operator and ZooKeeper it needs. When false, every component connects to
  # `externalClickhouse` instead, and `externalClickhouse.host` must be set.
  # @section -- ClickHouse
  # @default -- true
  enabled: true
  # -- Value of the `app.kubernetes.io/component` label on the ClickHouse objects and pods.
  # @section -- ClickHouse
  name: clickhouse
  # clickhouse.nameOverride -- Replaces `clickhouse` in the ClickHouse name `<release>-clickhouse` and in its `app.kubernetes.io/name` label.
  # @section -- ClickHouse
  # @default -- ""
  nameOverride: ""
  # clickhouse.fullnameOverride -- Name of the ClickHouseInstallation and its Service in place of `<release>-clickhouse`, and the prefix of its other objects.
  # At most 34 characters, because the operator derives longer names from it; set it when a long release name fails the render.
  # @section -- ClickHouse
  # @default -- ""
  fullnameOverride: ""
  # clickhouse.namespace -- Namespace of the ClickHouseInstallation; empty means the release namespace. Any other value makes the chart
  # create that namespace and keep it on uninstall (`helm.sh/resource-policy: keep`), and needs the operator pointed at it.
  # @raw
  # For a namespace `clickhouse`, either run the operator there:
  #
  #   ```yaml
  #   altinity-clickhouse-operator:
  #     namespaceOverride: clickhouse
  #   ```
  #
  # or keep it in the release namespace with the rights to watch that one:
  #
  #   ```yaml
  #   altinity-clickhouse-operator:
  #     watchNamespaces: [clickhouse]
  #     rbac:
  #       namespaceScoped: false
  #   ```
  #
  # @section -- ClickHouse
  # @default -- ""
  namespace: ""
  # clickhouse.image -- Image of the ClickHouse container, also run by the histogramQuantile download init container.
  # @section -- ClickHouse
  image:
    # clickhouse.image.repository -- Image repository, optionally prefixed with a registry; `global.imageRegistry` replaces that registry when set.
    # @default -- "clickhouse/clickhouse-server"
    # @section -- ClickHouse
    repository: clickhouse/clickhouse-server
    # clickhouse.image.tag -- ClickHouse server version. SigNoz is tested against this tag; move off it only to a version SigNoz supports.
    # @default -- "25.12.5"
    # @section -- ClickHouse
    tag: 25.12.5
    # clickhouse.image.pullPolicy -- ClickHouse image pull policy.
    # @default -- "IfNotPresent"
    # @section -- ClickHouse
    pullPolicy: IfNotPresent
  # The ClickHouse pod and the operator-upgrade hook's pod list
  # `global.imagePullSecrets` first, then the root `imagePullSecrets`, then
  # these; a name in more than one list is listed once.
  # -- Secrets for pulling images from a private registry.
  # @section -- ClickHouse
  imagePullSecrets: []
  # - "clickhouse-pull-secret"

  # clickhouse.layout -- Shards and replicas of the ClickHouse cluster (experimental), the operator's cluster `layout` rendered as given:
  # https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md
  # @section -- ClickHouse
  layout:
    shardsCount: 1
    replicasCount: 1
  # clickhouse.cluster -- Name of the ClickHouse cluster, which the migrator creates SigNoz's tables on and SigNoz queries.
  # @section -- ClickHouse
  # @default -- "cluster"
  cluster: cluster
  # clickhouse.serviceAccount -- ClickHouse Service Account configuration.
  # @section -- ClickHouse
  serviceAccount:
    # clickhouse.serviceAccount.create -- Create a ServiceAccount for the ClickHouse pod; when false the pod runs as `name`, or as `default` when `name` is empty.
    # @default -- true
    # @section -- ClickHouse
    create: true
    # clickhouse.serviceAccount.annotations -- Annotations to add to the service account.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # clickhouse.serviceAccount.name -- Name of the ServiceAccount to create (empty: the ClickHouse name), or of an existing one to run as when `create` is false.
    # @default -- null
    # @section -- ClickHouse
    name:
  # -- Labels added to the ClickHouseInstallation.
  # @section -- ClickHouse
  labels: {}
  # clickhouse.annotations -- Annotations added to the ClickHouseInstallation.
  # @section -- ClickHouse
  # @default -- {}
  annotations: {}
  pod:
    # A key named like one of the chart's selector labels
    # (`app.kubernetes.io/name`, `app.kubernetes.io/instance`,
    # `app.kubernetes.io/component`) is ignored: the chart keeps its own value.
    # -- Labels to add to the pod.
    # @section -- ClickHouse
    labels: {}
    # The `signoz.io/*` defaults let the SigNoz collectors scrape the metrics
    # endpoint set in `clickhouse.settings`.
    # -- Annotations to add to the pod.
    # @default -- "signoz.io/scrape, signoz.io/port and signoz.io/path for the metrics endpoint"
    # @section -- ClickHouse
    annotations:
      signoz.io/scrape: 'true'
      signoz.io/port: '9363'
      signoz.io/path: /metrics
  # clickhouse.service -- ClickHouse service configuration.
  # @section -- ClickHouse
  service:
    # clickhouse.service.annotations -- Annotations for the ClickHouse service.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # clickhouse.service.type -- Type of the ClickHouse Service; `LoadBalancer` or `NodePort` exposes ClickHouse outside the cluster.
    # @default -- "ClusterIP"
    # @section -- ClickHouse
    type: ClusterIP
    # clickhouse.service.httpPort -- HTTP port of the ClickHouse Service, which the components connect to.
    # @default -- 8123
    # @section -- ClickHouse
    httpPort: 8123
    # clickhouse.service.tcpPort -- Native TCP port of the ClickHouse Service, which SigNoz, the collector and the migrator connect to.
    # @default -- 9000
    # @section -- ClickHouse
    tcpPort: 9000
  # clickhouse.database -- Database the collector writes metrics to.
  # @section -- ClickHouse
  # @default -- "signoz_metrics"
  database: signoz_metrics
  # clickhouse.traceDatabase -- Database the collector writes traces to.
  # @section -- ClickHouse
  # @default -- "signoz_traces"
  traceDatabase: signoz_traces
  # clickhouse.logDatabase -- Database the collector writes logs to.
  # @section -- ClickHouse
  # @default -- "signoz_logs"
  logDatabase: signoz_logs
  # clickhouse.meterDatabase -- Database the collector writes meter data to.
  # @section -- ClickHouse
  # @default -- "signoz_meter"
  meterDatabase: signoz_meter
  # clickhouse.user -- ClickHouse user the installation creates and every component connects as.
  # @section -- ClickHouse
  # @default -- "admin"
  user: admin
  # Written into the Secret `<clickhouse.fullname>-credentials` twice: as
  # `password`, which every component that connects to ClickHouse reads, and
  # as its SHA-256 hex `password_sha256_hex`, which the ClickHouseInstallation
  # reads. Ignored when `clickhouse.existingSecret` is set. The components put
  # it into their connection strings unescaped, so it must not contain `/`,
  # `?` or `#`, and a `%` is read as an escape.
  # -- Password of `clickhouse.user`.
  # @section -- ClickHouse
  # @default -- "27ff0399-0d3a-4bd8-919d-17c2181e6fb9"
  password: 27ff0399-0d3a-4bd8-919d-17c2181e6fb9
  # When set, the chart creates no Secret and reads this one. With
  # `clickhouse.namespace` set to another namespace, the Secret must exist
  # there as well as in the release namespace. Recommended: also store the
  # SHA-256 hex of the password, see `clickhouse.existingSecretPasswordSha256Key`.
  # -- Name of a Secret you created that holds the password of `clickhouse.user`.
  # @default -- null
  # @section -- ClickHouse
  existingSecret:
  # clickhouse.existingSecretPasswordKey -- Key of the password inside `clickhouse.existingSecret`.
  # @default -- "password"
  # @section -- ClickHouse
  existingSecretPasswordKey: password
  # Make the hash with `printf '%s' "$PASSWORD" | sha256sum | cut -d' ' -f1`.
  # The ClickHouseInstallation then reads the hash instead of the plain
  # password. When empty, ClickHouse reads the plain key through an
  # environment substitution that is parsed as XML, so the password must not
  # contain `&`, `<` or an `&name;` sequence.
  # -- Key of the password's SHA-256 hex inside `clickhouse.existingSecret`.
  # @default -- ""
  # @section -- ClickHouse
  existingSecretPasswordSha256Key: ""
  # clickhouse.secure -- Passed as `CLICKHOUSE_SECURE` to the pods that connect to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  secure: false
  # clickhouse.verify -- Passed as `CLICKHOUSE_VERIFY` to the pods that connect to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  verify: false
  # clickhouse.allowedNetworkIps -- Networks `clickhouse.user` may connect from, as addresses or CIDR ranges.
  # The defaults are the private ranges; add any other range a client connects from.
  # @section -- ClickHouse
  allowedNetworkIps:
    - "10.0.0.0/8"
    - "100.64.0.0/10"
    - "172.16.0.0/12"
    - "192.0.0.0/24"
    - "198.18.0.0/15"
    - "192.168.0.0/16"
  # clickhouse.externalZookeeper -- ZooKeeper that ClickHouse coordinates through instead of the bundled store, ClickHouse Keeper or ZooKeeper, whichever is on.
  # Set that store's own `enabled` (`keeper.enabled`, `zookeeper.enabled`) to false with it, or the bundled store is still installed.
  # @raw
  # One `servers` entry per ZooKeeper node:
  #
  #   ```yaml
  #   servers:
  #     - host: signoz-signoz-zookeeper
  #       port: 2181
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  externalZookeeper: {}

  # clickhouse.profiles -- ClickHouse settings profiles, one key per profile and setting; they override `defaultProfiles`.
  # Settings: https://clickhouse.com/docs/en/operations/settings/settings/
  # @raw
  # A 40 GB memory cap on each query run under the default profile:
  #
  #   ```yaml
  #   default/max_memory_usage: 40000000000
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  profiles: {}
  # clickhouse.defaultProfiles -- Profile settings SigNoz's queries rely on. Do not replace this map; override a single setting through `clickhouse.profiles`.
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  defaultProfiles:
    default/allow_experimental_window_functions: "1"
    default/allow_nondeterministic_mutations: "1"
    default/secondary_indices_enable_bulk_filtering: "0"
    admin/secondary_indices_enable_bulk_filtering: "0"
    default/query_plan_max_limit_for_lazy_materialization: "0"
    admin/query_plan_max_limit_for_lazy_materialization: "0"
  # clickhouse.settings -- ClickHouse server settings, keyed by their path in the server config; they override `defaultSettings`. The `prometheus/*`
  # defaults serve the metrics that `clickhouse.pod.annotations` point at. Settings: https://clickhouse.com/docs/en/operations/server-configuration-parameters/settings
  # @raw
  # Debug logging, the `level` setting under `logger`:
  #
  #   ```yaml
  #   logger/level: debug
  #   ```
  #
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  settings:
    # ClickHouse's Prometheus endpoint; uncomment a switch below to set what it exports.
    prometheus/endpoint: /metrics
    prometheus/port: 9363
    # prometheus/metrics: true
    # prometheus/events: true
    # prometheus/asynchronous_metrics: true
  # clickhouse.defaultSettings -- Server settings that load the histogramQuantile function and set the format schema directory.
  # Do not replace this map; override a single setting through `clickhouse.settings`.
  # @section -- ClickHouse
  defaultSettings:
    format_schema_path: /etc/clickhouse-server/config.d/
    user_scripts_path: /var/lib/clickhouse/user_scripts/
    user_defined_executable_functions_config: '/etc/clickhouse-server/functions/custom-functions.xml'
  # clickhouse.files -- ClickHouse configuration files, keyed by path; files under `config.d/` merge into the server config.
  # @raw
  # A file that sets the server name clickhouse-client shows in its prompt:
  #
  #   ```yaml
  #   config.d/display_name.xml: |
  #     <clickhouse>
  #       <display_name>signoz</display_name>
  #     </clickhouse>
  #   ```
  #
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  files:
    config.d/formatting.xml: |
      <clickhouse>
        <logger>
          <formatting replace="replace">
            <type>json</type>
            <names>
              <date_time>date_time</date_time>
              <thread_name>thread_name</thread_name>
              <thread_id>thread_id</thread_id>
              <level>level</level>
              <query_id>query_id</query_id>
              <logger_name>logger_name</logger_name>
              <message>message</message>
              <source_file>source_file</source_file>
              <source_line>source_line</source_line>
            </names>
          </formatting>
        </logger>
      </clickhouse>
    config.d/crash.xml: |
      <clickhouse>
        <send_crash_reports replace="replace">
          <enabled>false</enabled>
        </send_crash_reports>
      </clickhouse>
    config.d/load.xml: |
      <clickhouse>
        <async_load_databases replace="replace">false</async_load_databases>
      </clickhouse>
    config.d/system_log.xml: |
      <clickhouse>
        <text_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </text_log>
        <latency_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </latency_log>
        <error_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
        <query_metric_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </query_metric_log>
      </clickhouse>
  # -- Volume claim templates of the ClickHouse installation, used only when `clickhouse.persistence.enabled` is false.
  # @section -- ClickHouse
  templates:
    # clickhouse.templates.volumeClaimTemplates -- Volume claim templates added when `persistence.enabled` is false. Mount each through
    # `clickhouse.extraVolumeMounts` under the same `name`; without a mount at `/var/lib/clickhouse` the data is not kept.
    # @raw
    # Each entry takes these four fields, here a 50Gi claim named `data`:
    #
    #   ```yaml
    #   - name: data
    #     accessModes:
    #       - ReadWriteOnce
    #     resources:
    #       requests:
    #         storage: 50Gi
    #     storageClassName: standard
    #   ```
    #
    # @default -- []
    # @section -- ClickHouse
    volumeClaimTemplates: []

  # clickhouse.podDistribution -- Operator rules that spread the ClickHouse pods across nodes, rendered as given; types:
  # https://github.com/Altinity/clickhouse-operator/blob/1414503921da3ae475eb6f9a296d3475a6993768/docs/chi-examples/99-clickhouseinstallation-max.yaml#L428-L481
  # @section -- ClickHouse
  # @default -- []
  podDistribution: []
  # - type: ShardAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: ReplicaAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: MaxNumberPerNode
  #   number: 2
  #   topologyKey: kubernetes.io/hostname

  # clickhouse.coldStorage -- S3 or GCS disk added as the `s3` volume of a `tiered` storage policy, where SigNoz's retention settings move older data.
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  coldStorage:
    # clickhouse.coldStorage.enabled -- Whether to enable S3/GCS cold storage.
    # @default -- false
    # @section -- ClickHouse
    enabled: false
    # clickhouse.coldStorage.defaultKeepFreeSpaceBytes -- Reserve free space on the default disk (in bytes).
    # @default -- "10485760"
    # @section -- ClickHouse
    defaultKeepFreeSpaceBytes: "10485760"
    # clickhouse.coldStorage.type -- Type of cold storage: `s3` or `gcs`.
    # @default -- "s3"
    # @section -- ClickHouse
    type: s3
    # clickhouse.coldStorage.endpoint -- Bucket URL including the path ClickHouse writes under.
    # @raw
    # An S3 bucket:
    #
    #   ```yaml
    #   endpoint: https://my-bucket.s3-us-east-1.amazonaws.com/data/
    #   ```
    #
    # or a GCS bucket:
    #
    #   ```yaml
    #   endpoint: https://storage.googleapis.com/my-bucket/data/
    #   ```
    #
    # @default -- "https://<bucket-name>.s3-<region>.amazonaws.com/data/"
    # @section -- ClickHouse
    endpoint: https://<bucket-name>.s3-<region>.amazonaws.com/data/
    # clickhouse.coldStorage.accessKey -- Access Key ID for S3 or GCS.
    # Used for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<access_key_id>"
    # @section -- ClickHouse
    accessKey: <access_key_id>
    # clickhouse.coldStorage.secretAccess -- Secret Access Key for S3 or GCS.
    # Used for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<secret_access_key>"
    # @section -- ClickHouse
    secretAccess: <secret_access_key>
    # clickhouse.coldStorage.role -- AWS IAM role that gives ClickHouse access to the `s3` bucket in place of `accessKey` and `secretAccess`.
    # @section -- ClickHouse
    role:
      # clickhouse.coldStorage.role.enabled -- Use the role for `s3`: ClickHouse takes credentials from its environment instead of `accessKey` and `secretAccess`.
      # @default -- false
      # @section -- ClickHouse
      enabled: false
      # clickhouse.coldStorage.role.annotations -- ServiceAccount annotations that bind the role, added when `coldStorage.enabled` and `role.enabled` are both true.
      # @section -- ClickHouse
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::******:role/*****
  # -- Sidecar collector in the ClickHouse pod that sends `system.query_log` entries as logs to an OTLP receiver on the node's port 4317,
  # such as the k8s-infra agent.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  logs:
    system:
      # -- Enable collection of system table entries as logs
      # @section -- ClickHouse
      enabled: false
      image:
        # clickhouse.logs.system.image.repository -- Image repository, optionally prefixed with a registry; `global.imageRegistry` replaces that registry when set.
        # @default -- "signoz/signoz-otel-collector"
        # @section -- ClickHouse
        repository: signoz/signoz-otel-collector
        # clickhouse.logs.system.image.tag -- Tag of the system logs sidecar image.
        # @default -- "v0.144.15"
        # @section -- ClickHouse
        tag: v0.144.15
        # clickhouse.logs.system.image.pullPolicy -- Pull policy of the system logs sidecar image.
        # @default -- "IfNotPresent"
        # @section -- ClickHouse
        pullPolicy: IfNotPresent
      # clickhouse.logs.system.resources -- Resources of the system logs sidecar container, a Kubernetes ResourceRequirements object rendered as given.
      # @default -- {}
      # @section -- ClickHouse
      resources: {}
      # A list of Kubernetes EnvVar objects for the sidecar container, rendered
      # as written. An entry named like one the chart sets replaces it.
      # -- Extra environment variables for the container.
      # @section -- ClickHouse
      env: []
      # Sources of environment variables for the sidecar container, Kubernetes
      # EnvFromSource objects rendered as given.
      # -- Sources of extra environment variables for the container.
      # @section -- ClickHouse
      envFrom: []
      # Kubernetes VolumeMount objects for the sidecar container only, rendered
      # as given; add their volumes to `clickhouse.extraVolumes`.
      # -- Extra volume mounts for the container.
      # @section -- ClickHouse
      extraVolumeMounts: []
      # -- Configuration of the sidecar collector, rendered as given into its config file.
      # @section -- ClickHouse
      # @default -- "See values.yaml"
      config:
        receivers:
          clickhousesystemtablesreceiver:
            dsn: tcp://localhost:9000
            query_log_scrape_config:
              scrape_interval_seconds: 30
              min_scrape_delay_seconds: 10
        processors:
          batch:
            send_batch_max_size: 25000
            send_batch_size: 20000
            timeout: 1s
          resourcedetection:
            detectors:
              - env
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        exporters:
          otlp:
            endpoint: ${env:K8S_HOST_IP}:4317
            tls:
              insecure: true
              insecure_skip_verify: true
            retry_on_failure:
              enabled: true
              initial_interval: 2s
              max_interval: 5s
              max_elapsed_time: 15s
            sending_queue:
              enabled: false
        service:
          telemetry:
            logs:
              encoding: json
          extensions:
            - health_check
          pipelines:
            logs:
              receivers:
                - clickhousesystemtablesreceiver
              processors:
                - resourcedetection
                - batch
              exporters:
                - otlp
  # clickhouse.installCustomStorageClass -- Create an expandable StorageClass: `gp2-resizable` when `global.cloud` starts with `aws`, `gce-resizable`
  # when it starts with `gcp`. No volume uses it until `clickhouse.persistence.storageClass` names it.
  # @section -- ClickHouse
  # @default -- false
  installCustomStorageClass: false
  # -- Pre-upgrade Job that deletes the operator Deployment an older chart created, whose selector labels cannot change in place; it matches
  # nothing afterwards. When disabled, delete that Deployment yourself before upgrading: `kubectl delete deployment <release>-clickhouse-operator -n <namespace>`.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  operatorUpgradeHook:
    # -- Run the hook on `helm upgrade`.
    # @section -- ClickHouse
    enabled: true
    image:
      # -- Image repository, optionally prefixed with a registry; `global.imageRegistry` replaces that registry when set.
      # @section -- ClickHouse
      repository: registry.k8s.io/kubectl
      # -- Tag of the kubectl image. The image publishes no `latest` tag.
      # @section -- ClickHouse
      tag: v1.36.3
      # -- Pull policy of the kubectl image.
      # @section -- ClickHouse
      pullPolicy: IfNotPresent
    # -- Retries before the Job, and with it the upgrade, is marked failed.
    # @section -- ClickHouse
    backoffLimit: 3
    # -- Resources of the hook container.
    # @section -- ClickHouse
    resources: {}
    # The hook runs before every other object of the upgrade, so on tainted or
    # dedicated nodes it needs its own scheduling keys to start.
    # -- Node labels for pod assignment.
    # @section -- ClickHouse
    nodeSelector: {}
    # -- Tolerations for pod assignment.
    # @section -- ClickHouse
    tolerations: []
    # -- Affinity rules for pod assignment.
    # @section -- ClickHouse
    affinity: {}
    # -- Topology spread constraints for pod assignment.
    # @section -- ClickHouse
    topologySpreadConstraints: []
    # Empty sets none.
    # -- Priority class of the pod.
    # @section -- ClickHouse
    priorityClassName: ""
    # A Kubernetes PodSecurityContext, rendered as given; empty sets none.
    # -- Security context for the pod.
    # @section -- ClickHouse
    podSecurityContext: {}
    # A Kubernetes SecurityContext for the operator-upgrade container, rendered
    # as given; empty sets none.
    # -- Security context for the container.
    # @section -- ClickHouse
    containerSecurityContext: {}
  udf:
    # clickhouse.udf.enabled -- Download the histogramQuantile binary, which SigNoz's histogram percentile queries call, from GitHub in an init container.
    # Without GitHub access, set it to false and supply the binary through `clickhouse.extraInitContainers`.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # clickhouse.udf.command -- Command of the download init container; by default it fetches the histogramQuantile release for the node's OS and architecture.
    # @default -- "See values.yaml"
    # @section -- ClickHouse
    command:
      - sh
      - -c
      - |
        set -e
        version="v0.0.1"
        node_os=$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for ${node_os}/${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${version}/histogram-quantile_${node_os}_${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        chmod +x histogram-quantile
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        echo "histogram-quantile installed successfully"
    # clickhouse.udf.env -- Environment of the download init container, Kubernetes EnvVar objects rendered as given.
    # @raw
    # A proxy for the download, and a credential from a Secret for a mirror that `command` fetches from:
    #
    #   ```yaml
    #   - name: https_proxy
    #     value: http://proxy.example.com:3128
    #   - name: MIRROR_TOKEN
    #     valueFrom:
    #       secretKeyRef:
    #         name: mirror-credentials
    #         key: token
    #   ```
    #
    # @default -- []
    # @section -- ClickHouse
    env: []
    # clickhouse.udf.envFrom -- envFrom of the download init container, Kubernetes EnvFromSource objects rendered as given.
    # @default -- []
    # @section -- ClickHouse
    envFrom: []
    # clickhouse.udf.resources -- Resource requests and limits of the download init container; empty sets none, so set it where a policy requires limits on every container.
    # @default -- {}
    # @section -- ClickHouse
    resources: {}
    # Kubernetes VolumeMount objects for the download init container only,
    # rendered as given; add their volumes to `clickhouse.extraVolumes`.
    # -- Extra volume mounts for the container.
    # @section -- ClickHouse
    extraVolumeMounts: []
  # clickhouse.extraInitContainers -- Init containers added to the ClickHouse pod after the histogramQuantile download, Kubernetes Container objects rendered as given. The user scripts volume is `shared-binary-volume`, mounted at `/var/lib/clickhouse/user_scripts`.
  # @default -- []
  # @section -- ClickHouse
  extraInitContainers: []
  # -- Extra containers in the ClickHouse pod, Kubernetes Container objects rendered as given.
  # @section -- ClickHouse
  extraContainers: []

  # clickhouse.startupProbe -- Startup probe of the ClickHouse container, a Kubernetes probe object rendered as given; `null` renders none.
  # Helm merges your map into the default, so a handler other than `httpGet` must also clear `httpGet`.
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  startupProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  # clickhouse.livenessProbe -- Liveness probe of the ClickHouse container, a Kubernetes probe object rendered as given; `null` renders none.
  # Helm merges your map into the default, so a handler other than `httpGet` must also clear `httpGet`.
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  livenessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 60
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1
  # clickhouse.readinessProbe -- Readiness probe of the ClickHouse container, a Kubernetes probe object rendered as given; `null` renders none.
  # Helm merges your map into the default, so a handler other than `httpGet` must also clear `httpGet`.
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  readinessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 10
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # clickhouse.resources -- Resources of the ClickHouse container, a Kubernetes ResourceRequirements object rendered as given; size them for your load.
  # @section -- ClickHouse
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  #   limits:
  #     cpu: 2000m
  #     memory: 4Gi

  # clickhouse.podSecurityContext -- Security context of the ClickHouse pod, a Kubernetes PodSecurityContext object rendered as given; `null` renders none,
  # while `{}` keeps the defaults, since Helm merges maps.
  # @section -- ClickHouse
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  # clickhouse.containerSecurityContext -- Security context of every container the chart renders in the ClickHouse pod; rendered only when set.
  # @raw
  # The restricted profile ClickHouse runs under:
  #
  #   ```yaml
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop: [ALL]
  #   runAsNonRoot: true
  #   seccompProfile:
  #     type: RuntimeDefault
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  containerSecurityContext: {}
  # -- Priority class of the ClickHouse pods; empty sets none.
  # @section -- ClickHouse
  priorityClassName: ""
  # clickhouse.nodeSelector -- Node selector for assigning the ClickHouse pod.
  # @section -- ClickHouse
  # @default -- {}
  nodeSelector: {}
  # clickhouse.tolerations -- Toleration labels for ClickHouse pod assignment.
  # @section -- ClickHouse
  # @default -- []
  tolerations: []
  # clickhouse.affinity -- Affinity settings for the ClickHouse pod.
  # @section -- ClickHouse
  # @default -- {}
  affinity: {}
  # -- Topology spread constraints of the ClickHouse pods, Kubernetes objects rendered as given.
  # @section -- ClickHouse
  topologySpreadConstraints: []

  # clickhouse.persistence -- ClickHouse persistence configuration.
  # @section -- ClickHouse
  persistence:
    # clickhouse.persistence.enabled -- Keep ClickHouse data on a PersistentVolumeClaim. When false, the data lives in an `emptyDir` and is lost
    # with the pod, unless `clickhouse.templates.volumeClaimTemplates` provides volumes.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # clickhouse.persistence.existingClaim -- Name of a PersistentVolumeClaim you created for the ClickHouse data, used instead of a claim from the template.
    # @default -- ""
    # @section -- ClickHouse
    existingClaim: ""
    # clickhouse.persistence.storageClass -- StorageClass of the ClickHouse data claim; `-` disables dynamic provisioning, null uses the cluster default,
    # and `global.storageClass` overrides it.
    # @default -- null
    # @section -- ClickHouse
    storageClass: null
    # clickhouse.persistence.accessModes -- Access Modes for the persistent volume.
    # @default -- ["ReadWriteOnce"]
    # @section -- ClickHouse
    accessModes:
      - ReadWriteOnce
    # clickhouse.persistence.size -- Persistent Volume size.
    # @default -- "20Gi"
    # @section -- ClickHouse
    size: 20Gi
  # clickhouse.extraVolumes -- Extra volumes for the ClickHouse pod, a list of Kubernetes Volume objects.
  # @section -- ClickHouse
  extraVolumes: []
  # clickhouse.extraVolumeMounts -- Extra volume mounts for the ClickHouse container, a list of Kubernetes VolumeMount objects.
  # @section -- ClickHouse
  extraVolumeMounts: []
  # A list of Kubernetes EnvVar objects for the clickhouse container, rendered
  # as written. Names starting with `CONFIGURATION_` belong to the operator.
  # -- Extra environment variables for the container.
  # @section -- ClickHouse
  env: []
  # Sources of environment variables for the clickhouse container, Kubernetes
  # EnvFromSource objects rendered as given.
  # -- Sources of extra environment variables for the container.
  # @section -- ClickHouse
  envFrom: []

# keeper -- ClickHouse Keeper, the default coordination store of the ClickHouse installation, rendered as a ClickHouseKeeperInstallation when `clickhouse.enabled` and `keeper.enabled` are both true.
# @default -- "See values.yaml"
# @section -- ClickHouse Keeper
keeper:
  # keeper.enabled -- Install ClickHouse Keeper.
  # Set it to false when `clickhouse.externalZookeeper.servers` is used: as with `zookeeper.enabled`, the bundled store stays installed unless its `enabled` is false.
  # @default -- true
  # @section -- ClickHouse Keeper
  enabled: true
  # keeper.name -- Name of the ClickHouse Keeper component, the `app.kubernetes.io/name` label of its objects; `keeper.nameOverride` takes precedence.
  # @default -- "clickhouse-keeper"
  # @section -- ClickHouse Keeper
  name: clickhouse-keeper
  # keeper.nameOverride -- Name override for ClickHouse Keeper.
  # @default -- ""
  # @section -- ClickHouse Keeper
  nameOverride: ""
  # keeper.fullnameOverride -- Fullname override for ClickHouse Keeper, the name of its ClickHouseKeeperInstallation.
  # @default -- ""
  # @section -- ClickHouse Keeper
  fullnameOverride: ""
  # keeper.image -- ClickHouse Keeper image configuration.
  # @section -- ClickHouse Keeper
  image:
    # keeper.image.repository -- Image repository. May start with a registry (`registry.k8s.io/kubectl`); `global.imageRegistry` replaces that registry when set.
    # @default -- "clickhouse/clickhouse-keeper"
    # @section -- ClickHouse Keeper
    repository: clickhouse/clickhouse-keeper
    # keeper.image.tag -- ClickHouse Keeper image tag. Pinned on its own, it does not follow `clickhouse.image.tag`: a Keeper restart drops every ClickHouse session.
    # @default -- "25.12.5"
    # @section -- ClickHouse Keeper
    tag: 25.12.5
    # keeper.image.pullPolicy -- ClickHouse Keeper image pull policy.
    # @default -- "IfNotPresent"
    # @section -- ClickHouse Keeper
    pullPolicy: IfNotPresent
  # keeper.imagePullSecrets -- Image Registry Secret Names for ClickHouse Keeper. Merged with `global.imagePullSecrets` if set.
  # @default -- []
  # @section -- ClickHouse Keeper
  imagePullSecrets: []
  # keeper.replicaCount -- Number of Keeper replicas. Use an odd number: Keeper needs a majority of its replicas to work.
  # At 3, spread the replicas with `podDistribution` (`ShardAntiAffinity` and `MaxNumberPerNode` with `number: 1`) or with `affinity` or `topologySpreadConstraints`.
  # @default -- 1
  # @section -- ClickHouse Keeper
  replicaCount: 1
  # keeper.labels -- Labels for the ClickHouseKeeperInstallation.
  # @default -- {}
  # @section -- ClickHouse Keeper
  labels: {}
  # keeper.annotations -- Annotations for the ClickHouseKeeperInstallation.
  # @default -- {}
  # @section -- ClickHouse Keeper
  annotations: {}
  # keeper.podLabels -- Labels for the ClickHouse Keeper pod(s).
  # @default -- {}
  # @section -- ClickHouse Keeper
  podLabels: {}
  # keeper.podAnnotations -- Annotations for the ClickHouse Keeper pod(s). Your keys merge with these per key; set a key to `null` to drop it.
  # `signoz.io/port` must equal `keeper.settings` `prometheus/port`; change both together.
  # @section -- ClickHouse Keeper
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: /metrics
  # keeper.settings -- ClickHouse Keeper server settings, rendered into the installation's `configuration.settings`. Your keys merge with these per key; set a key to `null` to drop it.
  # `prometheus/port` must equal the `signoz.io/port` pod annotation in `keeper.podAnnotations`; change both together.
  # @default -- "See values.yaml"
  # @section -- ClickHouse Keeper
  settings:
    logger/level: warning
    logger/formatting/type: json
    logger/console: "true"
    listen_host: 0.0.0.0
    keeper_server/four_letter_word_white_list: "*"
    keeper_server/coordination_settings/raft_logs_level: information
    prometheus/endpoint: /metrics
    prometheus/port: "9141"
    prometheus/metrics: "true"
    prometheus/events: "true"
    prometheus/asynchronous_metrics: "true"
  # keeper.podSecurityContext -- Pod security context of the ClickHouse Keeper pod, a Kubernetes PodSecurityContext object rendered as given. Set to `null` to render no pod security context; an empty map keeps the defaults, because Helm merges maps.
  # @section -- ClickHouse Keeper
  podSecurityContext:
    fsGroup: 101
  # keeper.securityContext -- Security context of the ClickHouse Keeper container, a Kubernetes SecurityContext object rendered as given; rendered only when set.
  # @default -- {}
  # @section -- ClickHouse Keeper
  securityContext: {}
  # keeper.resources -- Resource requests and limits of the ClickHouse Keeper container.
  # @section -- ClickHouse Keeper
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # keeper.priorityClassName -- Priority class of the ClickHouse Keeper pod(s); an empty value sets none.
  # @default -- ""
  # @section -- ClickHouse Keeper
  priorityClassName: ""
  # keeper.nodeSelector -- Node selector for the ClickHouse Keeper pod(s).
  # @default -- {}
  # @section -- ClickHouse Keeper
  nodeSelector: {}
  # keeper.tolerations -- Tolerations for the ClickHouse Keeper pod(s).
  # @default -- []
  # @section -- ClickHouse Keeper
  tolerations: []
  # keeper.affinity -- Affinity for the ClickHouse Keeper pod(s).
  # @default -- {}
  # @section -- ClickHouse Keeper
  affinity: {}
  # keeper.topologySpreadConstraints -- Topology spread constraints for the ClickHouse Keeper pod(s).
  # @default -- []
  # @section -- ClickHouse Keeper
  topologySpreadConstraints: []
  # keeper.podDistribution -- Topologies for distributing the ClickHouse Keeper pods, in the operator's `podDistribution` format (see `clickhouse.podDistribution`).
  # @default -- []
  # @section -- ClickHouse Keeper
  podDistribution: []
  # keeper.persistence -- Persistent volume of each ClickHouse Keeper replica. The claim is kept when the installation or a replica is removed.
  # @section -- ClickHouse Keeper
  persistence:
    # keeper.persistence.accessModes -- Access modes for the persistent volume.
    # @default -- ["ReadWriteOnce"]
    # @section -- ClickHouse Keeper
    accessModes:
      - ReadWriteOnce
    # keeper.persistence.size -- Persistent volume size.
    # @default -- "10Gi"
    # @section -- ClickHouse Keeper
    size: 10Gi
    # keeper.persistence.storageClass -- Persistent Volume Storage Class; `global.storageClass` takes precedence when set. If "-", disables dynamic provisioning. If null, uses the default provisioner.
    # @default -- null
    # @section -- ClickHouse Keeper
    storageClass: null

# zookeeper -- Values of the bundled ZooKeeper chart, which ClickHouse coordinates through when `zookeeper.enabled` is true; its keys follow Bitnami's chart:
# https://github.com/bitnami/charts/blob/main/bitnami/zookeeper/values.yaml
# @default -- "See values.yaml"
# @section -- ZooKeeper
zookeeper:
  # zookeeper.enabled -- Install the bundled ZooKeeper. Deprecated: ClickHouse Keeper (`keeper.enabled`) is the default coordination store, and unset now means off.
  # An existing install that runs ZooKeeper sets this to true for the upgrade and keeps it until it has moved to Keeper; see https://github.com/SigNoz/charts/blob/main/charts/signoz/BREAKING-CHANGES.md#clickhouse-keeper-replaces-zookeeper
  # @default -- false
  # @section -- ZooKeeper
  enabled: false

  # -- Annotations on the metadata of every ZooKeeper object (not on the pod template).
  # @section -- ZooKeeper
  commonAnnotations:
    signoz.io/deprecated: "true"

  # -- Zookeeper image
  # @section -- ZooKeeper
  image:
    # -- Zookeeper image registry to use.
    # @section -- ZooKeeper
    registry: *GLOBAL_IMAGE_REGISTRY
    # -- Zookeeper image repository to use.
    # @section -- ZooKeeper
    repository: signoz/zookeeper
    # -- ZooKeeper version; ClickHouse does not work with every ZooKeeper version, so change it only to one ClickHouse supports.
    # @section -- ZooKeeper
    tag: 3.7.1

  # -- Replaces `zookeeper` in the ZooKeeper name `<release>-zookeeper`, by which the ClickHouse installation finds it.
  # @section -- ZooKeeper
  nameOverride: ""
  # -- Name of the ZooKeeper objects in place of `<release>-zookeeper`, by which the ClickHouse installation finds it.
  # @section -- ZooKeeper
  fullnameOverride: ""

  # -- Namespace of ZooKeeper, which must already exist; empty means the release namespace.
  # @section -- ZooKeeper
  namespaceOverride: ""

  # -- Annotations on the ZooKeeper pods; the `signoz.io/*` defaults let the SigNoz collectors scrape its metrics on port 9141.
  # @section -- ZooKeeper
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"

  # -- Periodic purge of old ZooKeeper snapshots and transaction logs.
  # @section -- ZooKeeper
  autopurge:
    # -- Hours between purges; 0 disables purging.
    # @section -- ZooKeeper
    purgeInterval: 1

  # -- ZooKeeper Prometheus Exporter configuration.
  # @section -- ZooKeeper
  metrics:
    # -- Serve ZooKeeper's Prometheus metrics on port 9141, the port `podAnnotations` point the collectors at.
    # @section -- ZooKeeper
    enabled: true

    service:
      enabled: true
      # -- ZooKeeper metrics service annotation
      # @section -- ZooKeeper
      annotations: {}
        # signoz.io/scrape: 'true'
        # signoz.io/port: '9141'
        # signoz.io/path: /metrics

  # -- Zookeeper log level.
  # @section -- ZooKeeper
  logLevel: INFO

  # -- Bitnami's built-in liveness probe, off because `customLivenessProbe` replaces it.
  # @section -- ZooKeeper
  livenessProbe:
    enabled: false
  # -- Bitnami's built-in readiness probe, off because `customReadinessProbe` replaces it.
  # @section -- ZooKeeper
  readinessProbe:
    enabled: false
  # -- Liveness probe of the ZooKeeper container: the `ruok` command on its admin server at port 8080.
  # @section -- ZooKeeper
  customLivenessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep ruok']
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  # -- Readiness probe of the ZooKeeper container: ready once the admin server's `ruok` command reports no error.
  # @section -- ZooKeeper
  customReadinessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null']
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6

  # -- ZooKeeper server ID of the first replica; each further replica takes the next ID.
  # @section -- ZooKeeper
  minServerId: 1

  # -- Number of ZooKeeper replicas, each listed as a coordination node of the ClickHouse installation; use an odd number to keep a quorum.
  # @section -- ZooKeeper
  replicaCount: 1

  # -- PodDisruptionBudget of the ZooKeeper pods.
  # @section -- ZooKeeper
  pdb:
    # -- Specifies whether a Pod Disruption Budget should be created
    # @section -- ZooKeeper
    create: false

  # -- Storage of the ZooKeeper data.
  # @section -- ZooKeeper
  persistence:
    # -- Enable ZooKeeper data persistence using PVC. If false, use emptyDir
    # @section -- ZooKeeper
    enabled: true

    # -- Name of an existing PVC to use (only when deploying a single replica)
    # @section -- ZooKeeper
    existingClaim: ""

    # -- StorageClass of the ZooKeeper data claim; `-` disables dynamic provisioning, null uses the cluster default, and `global.storageClass` overrides it.
    # @section -- ZooKeeper
    storageClass: null

    # -- PVC Access modes
    # @section -- ZooKeeper
    accessModes:
      - ReadWriteOnce

    # -- PVC Storage Request for ZooKeeper data volume
    # @section -- ZooKeeper
    size: 8Gi

    # -- Annotations for the PVC
    # @section -- ZooKeeper
    annotations: {}

  # -- Resources requests and limits for zookeeper
  # @section -- ZooKeeper
  resources:
    limits: {}
    requests:
      memory: 256Mi
      cpu: 100m
# altinity-clickhouse-operator -- Values of Altinity's clickhouse-operator chart, which installs the operator that reconciles the ClickHouseInstallation.
# Only settings that differ from that chart's defaults are set here; its keys:
# https://github.com/Altinity/clickhouse-operator/tree/release-0.27.4/deploy/helm
# @ignored
altinity-clickhouse-operator:
  # `global.imagePullSecrets` and the root `imagePullSecrets` do not reach the
  # operator pod or its CRD hook: set `imagePullSecrets` and
  # `crdHook.imagePullSecrets` here, as lists of `name:` objects.
  # -- Namespace of the operator; empty means the release namespace. Altinity's chart does not create it: it must exist before
  # `helm install`, because the CRD-install hook runs before the chart's own resources (on a fresh install that uses
  # `clickhouse.namespace` here, create it first and install with `--take-ownership`).
  namespaceOverride: ""

  # altinity-clickhouse-operator.enabled -- Install the Altinity clickhouse-operator. Defaults to the value of clickhouse.enabled; set it only to override that (external ClickHouse: leave unset).
  # enabled: true

  # -- Names the operator's Deployment, ServiceAccount, Secret and metrics Service `<release>-clickhouse-operator`, so an upgrade takes over the
  # existing objects in place.
  nameOverride: clickhouse-operator
  rbac:
    # -- Grant the operator rights in its own namespace only (Role and RoleBinding); set false, with `watchNamespaces`, to run ClickHouse in another namespace.
    namespaceScoped: true
  # -- Labels on the operator pod; the component label is what metrics queries and selectors on the operator match.
  podLabels:
    app.kubernetes.io/component: operator
  # -- Annotations on the operator pod; the SigNoz collectors scrape pods that carry `signoz.io/scrape`.
  podAnnotations:
    signoz.io/port: '8888'
    signoz.io/scrape: 'true'
    # Altinity's default annotations, removed so the pod carries only the SigNoz scrape annotations.
    prometheus.io/port: null
    prometheus.io/scrape: null
    clickhouse-operator-metrics/port: null
    clickhouse-operator-metrics/scrape: null
  configs:
    files:
      # Only the keys that differ from Altinity's config.yaml, which Helm deep-merges into its defaults; re-check them on a subchart bump.
      config.yaml:
        reconcile:
          statefulSet:
            update:
              # Seconds the operator waits for a created or updated StatefulSet to become Ready; Altinity's 300 is too short for large ClickHouse volumes.
              timeout: 900
        clickhouse:
          configuration:
            network:
              # Altinity's value with its `cluster.local` taken from `global.clusterDomain` (Altinity's chart templates these files),
              # so the `default` user's host check matches the ClickHouse pods on any cluster domain.
              hostRegexpTemplate: '(chi-{chi}-[^.]+\d+-\d+|clickhouse\-{chi})\.{namespace}\.svc\.{{ include "signoz.clusterDomain" . | replace "." "\\." }}$'
    configdFiles:
      # level information + JSON formatting; Altinity's default is debug text.
      01-clickhouse-02-logger.xml: |
        <yandex>
            <logger>
                <!-- Possible levels: https://github.com/pocoproject/poco/blob/devel/Foundation/include/Poco/Logger.h#L105 -->
                <level>information</level>
                <formatting>
                  <type>json</type>
                </formatting>
                <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
                <size>1000M</size>
                <count>10</count>
                <!-- Default behavior is autodetection (log to console if not daemon mode and is tty) -->
                <console>1</console>
            </logger>
        </yandex>
      # query_log with a 30-day TTL; unlike Altinity's file, it leaves query_thread_log in place (file 12).
      01-clickhouse-03-query_log.xml: |
        <yandex>
            <query_log replace="1">
                <database>system</database>
                <table>query_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_log>
        </yandex>
      # TTL 7 days; Altinity's default is 30.
      01-clickhouse-05-trace_log.xml: |-
        <yandex>
            <trace_log replace="1">
                <database>system</database>
                <table>trace_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </trace_log>
        </yandex>
      # Files 06-16 are SigNoz additions with no upstream counterpart.
      01-clickhouse-06-asynchronous_insert_log.xml: |
        <yandex>
            <asynchronous_insert_log replace="1">
                <database>system</database>
                <table>asynchronous_insert_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_insert_log>
        </yandex>
      01-clickhouse-07-asynchronous_metric_log.xml: |
        <yandex>
            <asynchronous_metric_log replace="1">
                <database>system</database>
                <table>asynchronous_metric_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_metric_log>
        </yandex>
      01-clickhouse-08-backup_log.xml: |
        <yandex>
            <backup_log replace="1">
                <database>system</database>
                <table>backup_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
