# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: keeper_enabled_test.yaml
templates:
  - templates/keeper/clickhousekeeperinstallation.yaml
release:
  name: signoz
  namespace: signoz
tests:
  - it: renders the ClickHouseKeeperInstallation with defaults
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClickHouseKeeperInstallation
      - isAPIVersion:
          of: clickhouse-keeper.altinity.com/v1
  - it: renders nothing with keeper.enabled false
    set:
      keeper.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing with clickhouse.enabled false
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
    asserts:
      - hasDocuments:
          count: 0
