suite: Test the ServiceAccount
templates:
  - serviceaccount.yaml
release:
  name: signoz-mcp
  namespace: platform
chart:
  version: 0.0.0-test
  appVersion: v0.0.0-test
set:
  env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
tests:
  - it: should create a ServiceAccount named after the release by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - isAPIVersion:
          of: v1
      - equal:
          path: metadata.name
          value: signoz-mcp
      - equal:
          path: metadata.namespace
          value: platform
      - equal:
          path: metadata.labels
          value:
            app.kubernetes.io/name: signoz-mcp
            app.kubernetes.io/instance: signoz-mcp
            app.kubernetes.io/version: v0.0.0-test
            app.kubernetes.io/managed-by: Helm
            helm.sh/chart: signoz-mcp-0.0.0-test
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations

  - it: should be named <release>-signoz-mcp when the release name does not contain the chart name
    release:
      name: prod
    asserts:
      - equal:
          path: metadata.name
          value: prod-signoz-mcp

  - it: should use serviceAccount.name when it is set
    set:
      serviceAccount.name: custom
    asserts:
      - equal:
          path: metadata.name
          value: custom

  - it: should set serviceAccount.annotations
    set:
      serviceAccount.annotations:
        example.com/role: signoz-mcp
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/role: signoz-mcp

  - it: should render no ServiceAccount when serviceAccount.create is false
    set:
      serviceAccount.create: false
      serviceAccount.name: existing
    asserts:
      - hasDocuments:
          count: 0
