# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql/server-credentials
templates:
  - templates/signoz/statefulset.yaml
  - templates/postgresql/secret.yaml
  - templates/postgresql/statefulset.yaml
tests:
  - it: reads POSTGRES_PASSWORD from the Secret <postgresql fullname>-auth the bundled Postgres renders, under the key password
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: ""
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-postgresql-auth
      - template: templates/postgresql/secret.yaml
        exists:
          path: stringData.password
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-postgresql-auth, key: password}}

  - it: starts the bundled Postgres with the password from the Secret SigNoz reads
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: ""
    asserts:
      - template: templates/postgresql/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "postgres")].env
          content: &authSecret
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-postgresql-auth, key: password}}
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: *authSecret

  - it: reads POSTGRES_PASSWORD from the Secret named after postgresql.fullnameOverride
    set:
      postgresql.enabled: true
      postgresql.fullnameOverride: pg
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: pg-auth
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: pg-auth, key: password}}

  - it: reads POSTGRES_PASSWORD from the Secret named <release>-<postgresql.nameOverride>-auth
    set:
      postgresql.enabled: true
      postgresql.nameOverride: pgx
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-pgx-auth
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-pgx-auth, key: password}}

  - it: reads POSTGRES_PASSWORD from the Secret named after the release alone when the release name contains postgresql
    release:
      name: mypostgresql
    set:
      postgresql.enabled: true
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: mypostgresql-auth
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: mypostgresql-auth, key: password}}

  - it: reads POSTGRES_PASSWORD from the Secret whose name the postgresql chart cuts to 63 characters
    set:
      postgresql.enabled: true
      postgresql.fullnameOverride: signoz-observability-platform-metadata-store-postgresql-prod
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: signoz-observability-platform-metadata-store-postgresql-prod-au
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: signoz-observability-platform-metadata-store-postgresql-prod-au, key: password}}

  - it: renders no -auth Secret with postgresql.auth.existingSecret, and SigNoz and Postgres both read that Secret
    set:
      postgresql.enabled: true
      postgresql.auth.existingSecret: my-pg
      postgresql.auth.secretKeys.userPasswordKey: pw
    asserts:
      - template: templates/postgresql/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/postgresql/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "postgres")].env
          content: &userSecret
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: my-pg, key: pw}}
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: *userSecret
