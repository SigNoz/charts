# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/namespace
templates:
  - templates/signoz/statefulset.yaml
  - templates/signoz/service.yaml
  - templates/signoz/serviceaccount.yaml
  - templates/signoz/ingress.yaml
  - templates/signoz/tests/test-connection.yaml
tests:
  - it: places the SigNoz StatefulSet, Service, ServiceAccount, Ingress and test Pod in the release namespace
    release:
      namespace: obs
    set:
      signoz.serviceAccount.create: true
      signoz.ingress.enabled: true
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/signoz/serviceaccount.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/signoz/ingress.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/signoz/tests/test-connection.yaml
        equal:
          path: metadata.namespace
          value: obs
