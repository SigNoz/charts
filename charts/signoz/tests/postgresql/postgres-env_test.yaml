suite: postgresql/postgres-env

templates: 
  - templates/postgresql/statefulset.yaml

set:
  postgresql.enabled: true
tests:

  - it: should correctly render the default key-value environment variables for postgres.
    set:
      postgresql.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: "signoz"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-postgresql-auth
                key: password
      - contains: 
          path: spec.template.spec.containers[0].env
          content: 
            name: POSTGRES_DB
            value: "signoz"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGDATA
            value: "/var/lib/postgresql/data"
  - it: should render custom auth env Variables
    set:
      postgresql.enabled: true
      postgresql.auth:
        username: "abc"
        password: "123"
        database: "xyz"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_USER
            value: "abc"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-postgresql-auth
                key: password
      - contains: 
          path: spec.template.spec.containers[0].env
          content: 
            name: POSTGRES_DB
            value: "xyz"
  - it: should render secret keys for auth env Variables
    set:
      postgresql.enabled: true
      postgresql.auth:
        existingSecret: "postgres-secret"
        secretKeys:
          userPasswordKey: "password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "postgres-secret"
                key: "password"


      
