                                  type: string
                                fieldDataType:
                                  description: 'Data type of the field values: string,
                                    bool, int64, float64 or number. Empty means unspecified.'
                                  enum:
                                  - string
                                  - bool
                                  - float64
                                  - int64
                                  - number
                                  type: string
                                name:
                                  description: The field name, such as service.name,
                                    k8s.pod.name or http.response.status_code. Dots
                                    are part of the name, and the names available
                                    depend on the signal and the data ingested.
                                  minLength: 1
                                  type: string
                                signal:
                                  description: 'The signal the field belongs to: traces,
                                    logs or metrics. Empty means any signal.'
                                  enum:
                                  - traces
                                  - logs
                                  - metrics
                                  type: string
                                unit:
                                  description: Unit of the field values, present only
                                    for well-known fields.
                                  type: string
                              required:
                              - name
                              type: object
                            type: array
                        required:
                        - displayName
                        - panelType
                        - queries
                        - requestType
                        type: object
                    required:
                    - schemaVersion
                    - source
                    - spec
                    type: object
                type: object
              providerConfigRef:
                description: |-
                  ProviderConfigRef names the SigNoz backend to write through, resolved in
                  the resource's own namespace unless its kind is ClusterProviderConfig.
                properties:
                  kind:
                    default: ProviderConfig
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy controls what happens in SigNoz when this custom resource is
                  deleted. Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              retryInterval:
                description: |-
                  RetryInterval is the cadence at which a Recoverable failure is retried.
                  Omitted, it falls back to Interval, then to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              suspend:
                description: |-
                  Suspend stops reconciling this resource without changing or deleting
                  anything in SigNoz.
                type: boolean
              timeout:
                description: |-
                  Timeout bounds a single reconciliation attempt, including the HTTP calls
                  to SigNoz. Omitted, it falls back to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
            required:
            - objectTemplate
            - providerConfigRef
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions report the reconcile outcome. The type vocabulary is fixed and
                  shared across kinds; per-kind detail lives in reason and message.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the operator
                  last reconciled.
                format: int64
                type: integer
              observedHash:
                description: |-
                  ObservedHash is a hash of the last body the operator sent to SigNoz. It is
                  an optimisation that lets a reconcile skip the remote fetch when desired
                  state is unchanged, never the drift mechanism.
                type: string
              reconciledAt:
                description: |-
                  ReconciledAt is when the operator last reconciled the resource against
                  SigNoz.
                format: date-time
                type: string
              signozResource:
                description: |-
                  SigNozResource records the object's identity in SigNoz. Its ID is
                  empty until a create or lookup confirms it. It is a cache, not the source
                  of truth for identity: if lost, the next reconcile re-discovers it.
                properties:
                  id:
                    description: |-
                      ID is the identifier SigNoz assigned, set once the operator has created or
                      adopted the remote object.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
