# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# The Secret holding the external ClickHouse password (clickhouse.createSecret).
suite: clickhouse_external-secret_test.yaml
templates:
  - templates/clickhouse/secret-external.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: renders the Secret when ClickHouse is external with a password and no existingSecret
    set:
      clickhouse.enabled: false
      externalClickhouse.password: golden-password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: golden-clickhouse-external
  - it: stores the password under the clickhouse-password key
    set:
      clickhouse.enabled: false
      externalClickhouse.password: golden-password
    asserts:
      - equal:
          path: data["clickhouse-password"]
          value: Z29sZGVuLXBhc3N3b3Jk
  - it: renders nothing when externalClickhouse.existingSecret is set
    set:
      clickhouse.enabled: false
      externalClickhouse.password: golden-password
      externalClickhouse.existingSecret: golden-secret
      externalClickhouse.existingSecretPasswordKey: password
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing when clickhouse.enabled is true
    set:
      externalClickhouse.password: golden-password
    asserts:
      - hasDocuments:
          count: 0
  - it: renders nothing without externalClickhouse.password
    set:
      clickhouse.enabled: false
    asserts:
      - hasDocuments:
          count: 0
