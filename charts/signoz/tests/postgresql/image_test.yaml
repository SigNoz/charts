# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql/image
templates:
  - templates/postgresql/statefulset.yaml
set:
  postgresql.enabled: true
tests:
  # A label value cannot hold "@" or ":", so the API server would reject every object carrying the full tag.
  - it: labels the version with the part of a digest-pinned tag before the digest, and pulls the full tag
    set:
      postgresql.image:
        repository: postgres
        tag: "16@sha256:0d9624535618a135c5453258fd629f4963390338b11aaffb92292c12df3a6c17"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "16"
      - equal:
          path: spec.template.spec.containers[?(@.name == "postgres")].image
          value: postgres:16@sha256:0d9624535618a135c5453258fd629f4963390338b11aaffb92292c12df3a6c17
