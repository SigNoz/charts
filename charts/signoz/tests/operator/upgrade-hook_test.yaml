# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: operator/upgrade-hook
templates:
  - templates/clickhouse/hooks/operator-upgrade/job.yaml
  - templates/clickhouse/hooks/operator-upgrade/role.yaml
  - templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
  - templates/clickhouse/hooks/operator-upgrade/serviceaccount.yaml
tests:
  - it: deletes, before an upgrade, only a Deployment carrying the old operator's name and instance labels and a component label, in ClickHouse's namespace
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      clickhouse.namespace: db
      altinity-clickhouse-operator.namespaceOverride: db
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-upgrade
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - delete
            - deployment
            - --namespace=db
            - --selector=app.kubernetes.io/name=clickhouse,app.kubernetes.io/instance=RELEASE-NAME,app.kubernetes.io/component
            - --ignore-not-found=true
            - --wait=true
  - it: selects the old operator Deployment under clickhouse.nameOverride
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      clickhouse.nameOverride: chdb
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --selector=app.kubernetes.io/name=chdb,app.kubernetes.io/instance=RELEASE-NAME,app.kubernetes.io/component
  - it: creates the hook's ServiceAccount, Role and RoleBinding as pre-upgrade hooks before its Job, lets the Job delete Deployments, and removes them after it succeeds
    asserts:
      - template: templates/clickhouse/hooks/operator-upgrade/serviceaccount.yaml
        isKind:
          of: ServiceAccount
      - template: templates/clickhouse/hooks/operator-upgrade/serviceaccount.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/serviceaccount.yaml
        equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - template: templates/clickhouse/hooks/operator-upgrade/role.yaml
        isKind:
          of: Role
      - template: templates/clickhouse/hooks/operator-upgrade/role.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/role.yaml
        equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        isKind:
          of: RoleBinding
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - template: templates/clickhouse/hooks/operator-upgrade/job.yaml
        isKind:
          of: Job
      - template: templates/clickhouse/hooks/operator-upgrade/job.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/job.yaml
        equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-9"
            helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
      - template: templates/clickhouse/hooks/operator-upgrade/role.yaml
        contains:
          path: rules
          content: {apiGroups: [apps], resources: [deployments], verbs: [get, list, delete]}
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        equal:
          path: roleRef.name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        equal:
          path: subjects[0].name
          value: RELEASE-NAME-clickhouse-operator-upgrade
      - template: templates/clickhouse/hooks/operator-upgrade/job.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-clickhouse-operator-upgrade
  - it: pulls the hook's kubectl image from global.imageRegistry, replacing registry.k8s.io
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      global.imageRegistry: mirror.example.com
      clickhouse.operatorUpgradeHook.image.repository: registry.k8s.io/kubectl
      clickhouse.operatorUpgradeHook.image.tag: t3
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: mirror.example.com/kubectl:t3
  - it: renders no hook with clickhouse.operatorUpgradeHook.enabled false
    set:
      clickhouse.operatorUpgradeHook.enabled: false
    asserts:
      - template: templates/clickhouse/hooks/operator-upgrade/job.yaml
        hasDocuments:
          count: 0
      - template: templates/clickhouse/hooks/operator-upgrade/role.yaml
        hasDocuments:
          count: 0
      - template: templates/clickhouse/hooks/operator-upgrade/rolebinding.yaml
        hasDocuments:
          count: 0
      - template: templates/clickhouse/hooks/operator-upgrade/serviceaccount.yaml
        hasDocuments:
          count: 0
  - it: lets the hook only read and delete Deployments, so it can remove the old operator Deployment and nothing else
    template: templates/clickhouse/hooks/operator-upgrade/role.yaml
    asserts:
      - equal:
          path: rules
          value:
            - apiGroups: [apps]
              resources: [deployments]
              verbs: [get, list, delete]
  - it: pulls the hook's kubectl image with global.imagePullSecrets, then imagePullSecrets, then clickhouse.imagePullSecrets, in that order
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      global.imagePullSecrets: [registry-mirror]
      imagePullSecrets: [corp-pull]
      clickhouse.imagePullSecrets: [ch-vendor]
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: registry-mirror
            - name: corp-pull
            - name: ch-vendor
  - it: schedules the hook pod with clickhouse.operatorUpgradeHook.nodeSelector, tolerations, affinity, topologySpreadConstraints and priorityClassName, for tainted or dedicated nodes
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      clickhouse.operatorUpgradeHook.nodeSelector: {node-role.example.com/platform: "true"}
      clickhouse.operatorUpgradeHook.tolerations:
        - {key: dedicated, operator: Equal, value: platform, effect: NoSchedule}
      clickhouse.operatorUpgradeHook.affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      clickhouse.operatorUpgradeHook.topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway}
      clickhouse.operatorUpgradeHook.priorityClassName: platform-critical
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value: {node-role.example.com/platform: "true"}
      - equal:
          path: spec.template.spec.tolerations
          value:
            - {key: dedicated, operator: Equal, value: platform, effect: NoSchedule}
      - equal:
          path: spec.template.spec.affinity
          value:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - {key: kubernetes.io/arch, operator: In, values: [amd64]}
      - equal:
          path: spec.template.spec.topologySpreadConstraints
          value:
            - {maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: ScheduleAnyway}
      - equal:
          path: spec.template.spec.priorityClassName
          value: platform-critical
  - it: runs the hook with clickhouse.operatorUpgradeHook.podSecurityContext on its pod and containerSecurityContext on operator-upgrade, for a restricted namespace
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      clickhouse.operatorUpgradeHook.podSecurityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      clickhouse.operatorUpgradeHook.containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault
      - equal:
          path: spec.template.spec.containers[?(@.name == "operator-upgrade")].securityContext.allowPrivilegeEscalation
          value: false
  - it: renders no scheduling key or security context on the hook when the clickhouse.operatorUpgradeHook keys are empty
    template: templates/clickhouse/hooks/operator-upgrade/job.yaml
    set:
      clickhouse.operatorUpgradeHook.nodeSelector: {}
      clickhouse.operatorUpgradeHook.tolerations: []
      clickhouse.operatorUpgradeHook.affinity: {}
      clickhouse.operatorUpgradeHook.topologySpreadConstraints: []
      clickhouse.operatorUpgradeHook.priorityClassName: ""
      clickhouse.operatorUpgradeHook.podSecurityContext: {}
      clickhouse.operatorUpgradeHook.containerSecurityContext: {}
    asserts:
      - notExists:
          path: spec.template.spec.nodeSelector
      - notExists:
          path: spec.template.spec.tolerations
      - notExists:
          path: spec.template.spec.affinity
      - notExists:
          path: spec.template.spec.topologySpreadConstraints
      - notExists:
          path: spec.template.spec.priorityClassName
      - notExists:
          path: spec.template.spec.securityContext
      - notExists:
          path: spec.template.spec.containers[?(@.name == "operator-upgrade")].securityContext
