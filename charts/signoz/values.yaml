# -- Global override values for the chart.
# @section -- Global Settings
global:
  # -- Global image registry override. Not applied to the `altinity-clickhouse-operator` subchart and `postgresql` images.
  # @default -- null
  # @section -- Global Settings
  imageRegistry: &GLOBAL_IMAGE_REGISTRY null
  # -- Global image pull secrets, as a list of Secret names. Not applied to the `altinity-clickhouse-operator` subchart.
  # @section -- Global Settings
  imagePullSecrets: []
  # -- StorageClass of the SigNoz, ClickHouse and ZooKeeper PVCs. When set, it overrides their own `persistence.storageClass`.
  # When neither is set, the PVCs use the cluster's default StorageClass. `-` renders an empty `storageClassName`, which disables dynamic provisioning.
  # @default -- null
  # @section -- Global Settings
  storageClass: null
  # -- Kubernetes cluster domain.
  # ClickHouse, its operator and ZooKeeper build their Pods' host names on it, as does the address of a component in another namespace.
  # @default -- "cluster.local"
  # @section -- Global Settings
  clusterDomain: cluster.local
  # -- Kubernetes cluster name.
  # The resource detection processor attaches it to telemetry data.
  # @default -- ""
  # @section -- Global Settings
  clusterName: ""
  # -- Cloud provider and distribution of the Kubernetes cluster.
  # One of `aws`, `azure`, `gcp`, `gcp/autogke`, `hcloud` or `other`.
  # The chart selects the StorageClass for PersistentVolumes from this value.
  # With `aws` or `gcp` and `installCustomStorageClass` enabled, the chart creates an expandable StorageClass.
  # @default -- "other"
  # @section -- Global Settings
  cloud: other
# -- Override the chart name.
# @section -- General Settings
# @default -- ""
nameOverride: ""
# -- Override the full resource name.
# @section -- General Settings
# @default -- ""
fullnameOverride: ""
# -- Name of the Kubernetes cluster, which the SigNoz collectors attach to telemetry data.
# @section -- General Settings
# @default -- ""
clusterName: ""
# -- Image pull secrets, as a list of Secret names. Not applied to the `altinity-clickhouse-operator` and `zookeeper` subcharts.
# @section -- General Settings
imagePullSecrets: []
# - "signoz-pull-secret"

# Helm hook Jobs of the chart.
hooks:
  # The chart's uninstall hook: a pre-delete Job that deletes the ClickHouse resources, the ClickHouseInstallation
  # and the ClickHouseKeeperInstallation, while the ClickHouse operator still runs.
  # Its objects are created in `clickhouse.namespace`, where the ClickHouse resources are.
  # It renders only when ClickHouse is bundled (`clickhouse.enabled`) and the ClickHouse operator is part of the
  # release (`altinity-clickhouse-operator.enabled`); otherwise these values have no effect.
  uninstall:
    # Helm removes the operator before the installations, and only the operator can finish deleting them.
    # With rendered manifests (`helm template`, `kubectl apply`), set it to false and delete the installations before the operator.
    # -- Run a pre-delete hook Job that deletes the ClickHouseInstallation and the ClickHouseKeeperInstallation while the operator still runs, so that `helm uninstall` completes.
    # @section -- Hooks
    enabled: true
    image:
      # Optionally prefixed with a registry, which `global.imageRegistry` replaces when set.
      # -- Image repository.
      # @section -- Hooks
      repository: registry.k8s.io/kubectl
      # The same image as `clickhouse.operatorUpgradeHook.image`: keep the two tags in step. The image publishes no `latest` tag.
      # -- Image tag.
      # @section -- Hooks
      tag: v1.36.3
      # -- Image pull policy.
      # @section -- Hooks
      pullPolicy: IfNotPresent
    # -- Resource requests and limits for the container.
    # @section -- Hooks
    resources: {}
    # -- Node labels for pod assignment.
    # @section -- Hooks
    nodeSelector: {}
    # -- Tolerations for pod assignment.
    # @section -- Hooks
    tolerations: []
    # -- Affinity rules for pod assignment.
    # @section -- Hooks
    affinity: {}
    # -- Topology spread constraints for pod assignment.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
    # @section -- Hooks
    topologySpreadConstraints: []
    # -- Priority class of the pod.
    # @section -- Hooks
    priorityClassName: ""
    # -- Security context for the pod.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    # @section -- Hooks
    podSecurityContext: {}
    # -- Security context for the container.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    # @section -- Hooks
    containerSecurityContext: {}

# -- The ClickHouse this chart installs, a ClickHouseInstallation that the operator from `altinity-clickhouse-operator` reconciles.
# @default -- "See values.yaml"
# @section -- ClickHouse
clickhouse:
  # -- Install ClickHouse, with the operator and ZooKeeper it needs. When false, every component connects to
  # `externalClickhouse` instead, and `externalClickhouse.host` must be set.
  # @section -- ClickHouse
  # @default -- true
  enabled: true
  # -- Value of the `app.kubernetes.io/component` label on the ClickHouse objects and Pods.
  # @section -- ClickHouse
  name: clickhouse
  # -- Replaces `clickhouse` in the ClickHouse name `<release>-clickhouse` and in its `app.kubernetes.io/name` label.
  # @section -- ClickHouse
  # @default -- ""
  nameOverride: ""
  # -- Name of the ClickHouseInstallation and its Service in place of `<release>-clickhouse`, and the prefix of its other objects.
  # At most 34 characters.
  # @section -- ClickHouse
  # @default -- ""
  fullnameOverride: ""
  # -- Namespace of the ClickHouseInstallation. Empty means the release namespace. Any other value makes the chart
  # create that namespace and keep it on uninstall (`helm.sh/resource-policy: keep`), and needs the operator pointed at it.
  # @raw
  # For a namespace `clickhouse`, either run the operator there:
  #
  #   ```yaml
  #   altinity-clickhouse-operator:
  #     namespaceOverride: clickhouse
  #   ```
  #
  # or keep it in the release namespace with the rights to watch that one:
  #
  #   ```yaml
  #   altinity-clickhouse-operator:
  #     watchNamespaces: [clickhouse]
  #     rbac:
  #       namespaceScoped: false
  #   ```
  #
  # @section -- ClickHouse
  # @default -- ""
  namespace: ""
  # -- Image of the ClickHouse container, also run by the histogramQuantile download init container.
  # @section -- ClickHouse
  image:
    # -- Image repository, optionally prefixed with a registry. `global.imageRegistry` replaces that registry when set.
    # @default -- "clickhouse/clickhouse-server"
    # @section -- ClickHouse
    repository: clickhouse/clickhouse-server
    # -- Image tag. SigNoz is tested against the default.
    # @default -- "25.12.5"
    # @section -- ClickHouse
    tag: 25.12.5
    # -- Image pull policy.
    # @default -- "IfNotPresent"
    # @section -- ClickHouse
    pullPolicy: IfNotPresent
  # -- Image pull secrets for the ClickHouse Pod and the operator-upgrade hook Pod.
  # @section -- ClickHouse
  imagePullSecrets: []
  # - "clickhouse-pull-secret"

  # -- Shards and replicas of the ClickHouse cluster (experimental), the operator's cluster `layout` rendered as given:
  # https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md
  # @section -- ClickHouse
  layout:
    shardsCount: 1
    replicasCount: 1
  # -- Name of the ClickHouse cluster, which the migrator creates SigNoz's tables on and SigNoz queries.
  # @section -- ClickHouse
  # @default -- "cluster"
  cluster: cluster
  # -- ClickHouse ServiceAccount configuration.
  # @section -- ClickHouse
  serviceAccount:
    # -- Create a ServiceAccount for the ClickHouse Pod. When false the Pod runs as `name`, or as `default` when `name` is empty.
    # @default -- true
    # @section -- ClickHouse
    create: true
    # -- Annotations to add to the ServiceAccount.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # -- Name of the ServiceAccount to create (empty: the ClickHouse name), or of an existing one to run as when `create` is false.
    # @default -- null
    # @section -- ClickHouse
    name:
  # -- Labels to add to the ClickHouseInstallation.
  # @section -- ClickHouse
  labels: {}
  # -- Annotations to add to the ClickHouseInstallation.
  # @section -- ClickHouse
  # @default -- {}
  annotations: {}
  pod:
    # -- Labels to add to the Pod.
    # A key named like a selector label (`app.kubernetes.io/name`, `app.kubernetes.io/instance`, `app.kubernetes.io/component`) is ignored.
    # @section -- ClickHouse
    labels: {}
    # -- Annotations to add to the Pod.
    # The `signoz.io/*` defaults make the SigNoz collectors scrape the metrics endpoint set in `clickhouse.settings`.
    # @default -- "signoz.io/scrape, signoz.io/port and signoz.io/path for the metrics endpoint"
    # @section -- ClickHouse
    annotations:
      signoz.io/scrape: 'true'
      signoz.io/port: '9363'
      signoz.io/path: /metrics
  # -- ClickHouse Service configuration.
  # @section -- ClickHouse
  service:
    # -- Annotations to add to the Service.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # -- Type of the ClickHouse Service. `LoadBalancer` or `NodePort` exposes ClickHouse outside the cluster.
    # @default -- "ClusterIP"
    # @section -- ClickHouse
    type: ClusterIP
    # -- HTTP port of the ClickHouse Service, which the components connect to.
    # @default -- 8123
    # @section -- ClickHouse
    httpPort: 8123
    # -- Native TCP port of the ClickHouse Service, which SigNoz, the collector and the migrator connect to.
    # @default -- 9000
    # @section -- ClickHouse
    tcpPort: 9000
  # -- Database the collector writes metrics to.
  # @section -- ClickHouse
  # @default -- "signoz_metrics"
  database: signoz_metrics
  # -- Database the collector writes traces to.
  # @section -- ClickHouse
  # @default -- "signoz_traces"
  traceDatabase: signoz_traces
  # -- Database the collector writes logs to.
  # @section -- ClickHouse
  # @default -- "signoz_logs"
  logDatabase: signoz_logs
  # -- Database the collector writes meter data to.
  # @section -- ClickHouse
  # @default -- "signoz_meter"
  meterDatabase: signoz_meter
  # -- ClickHouse user the installation creates and every component connects as.
  # @section -- ClickHouse
  # @default -- "admin"
  user: admin
  # -- Password of `clickhouse.user`, stored in the Secret `<clickhouse.fullname>-credentials`. Ignored when `clickhouse.existingSecret` is set.
  # It must not contain `/`, `?` or `#`, and a `%` is read as an escape. A change does not restart the Pods.
  # @section -- ClickHouse
  # @default -- "27ff0399-0d3a-4bd8-919d-17c2181e6fb9"
  password: 27ff0399-0d3a-4bd8-919d-17c2181e6fb9
  # -- Name of a Secret you created that holds the password of `clickhouse.user`. When set, the chart creates no Secret.
  # With `clickhouse.namespace` set to another namespace, the Secret must exist there and in the release namespace.
  # @default -- null
  # @section -- ClickHouse
  existingSecret:
  # -- Key of the password inside `clickhouse.existingSecret`.
  # @default -- "password"
  # @section -- ClickHouse
  existingSecretPasswordKey: password
  # -- Key of the password's SHA-256 hex inside `clickhouse.existingSecret`.
  # When empty, the password must not contain `&`, `<` or an `&name;` sequence.
  # Create the hash with `printf '%s' "$PASSWORD" | sha256sum | cut -d' ' -f1`.
  # @default -- ""
  # @section -- ClickHouse
  existingSecretPasswordSha256Key: ""
  # -- Passed as `CLICKHOUSE_SECURE` to the Pods that connect to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  secure: false
  # -- Passed as `CLICKHOUSE_VERIFY` to the Pods that connect to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  verify: false
  # -- Networks `clickhouse.user` may connect from, as addresses or CIDR ranges.
  # The defaults are the private ranges. Add any other range a client connects from.
  # @section -- ClickHouse
  allowedNetworkIps:
    - "10.0.0.0/8"
    - "100.64.0.0/10"
    - "172.16.0.0/12"
    - "192.0.0.0/24"
    - "198.18.0.0/15"
    - "192.168.0.0/16"
  # -- ZooKeeper that ClickHouse coordinates through instead of the bundled store, ClickHouse Keeper or ZooKeeper, whichever is on.
  # Set that store's own `enabled` (`keeper.enabled`, `zookeeper.enabled`) to false with it, or the bundled store is still installed.
  # @raw
  # One `servers` entry per ZooKeeper node:
  #
  #   ```yaml
  #   servers:
  #     - host: signoz-signoz-zookeeper
  #       port: 2181
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  externalZookeeper: {}
  # -- ClickHouse settings profiles, one key per profile and setting. They override `defaultProfiles`.
  # Settings: https://clickhouse.com/docs/en/operations/settings/settings/
  # @raw
  # A 40 GB memory cap on each query run under the default profile:
  #
  #   ```yaml
  #   default/max_memory_usage: 40000000000
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  profiles: {}
  # -- Profile settings SigNoz's queries rely on. `clickhouse.profiles` overrides a single setting.
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  defaultProfiles:
    default/allow_experimental_window_functions: "1"
    default/allow_nondeterministic_mutations: "1"
    default/secondary_indices_enable_bulk_filtering: "0"
    admin/secondary_indices_enable_bulk_filtering: "0"
    default/query_plan_max_limit_for_lazy_materialization: "0"
    admin/query_plan_max_limit_for_lazy_materialization: "0"
  # -- ClickHouse server settings, keyed by their path in the server config. They override `defaultSettings`. The `prometheus/*`
  # defaults serve the metrics that `clickhouse.pod.annotations` point at. Settings: https://clickhouse.com/docs/en/operations/server-configuration-parameters/settings
  # @raw
  # Debug logging, the `level` setting under `logger`:
  #
  #   ```yaml
  #   logger/level: debug
  #   ```
  #
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  settings:
    # ClickHouse's Prometheus endpoint; uncomment a switch below to set what it exports.
    prometheus/endpoint: /metrics
    prometheus/port: 9363
    # prometheus/metrics: true
    # prometheus/events: true
    # prometheus/asynchronous_metrics: true
  # -- Server settings that load the histogramQuantile function and set the format schema directory.
  # `clickhouse.settings` overrides a single setting.
  # @section -- ClickHouse
  defaultSettings:
    format_schema_path: /etc/clickhouse-server/config.d/
    user_scripts_path: /var/lib/clickhouse/user_scripts/
    user_defined_executable_functions_config: '/etc/clickhouse-server/functions/custom-functions.xml'
  # -- ClickHouse configuration files, keyed by path. Files under `config.d/` merge into the server config.
  # @raw
  # A file that sets the server name clickhouse-client shows in its prompt:
  #
  #   ```yaml
  #   config.d/display_name.xml: |
  #     <clickhouse>
  #       <display_name>signoz</display_name>
  #     </clickhouse>
  #   ```
  #
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  files:
    config.d/formatting.xml: |
      <clickhouse>
        <logger>
          <formatting replace="replace">
            <type>json</type>
            <names>
              <date_time>date_time</date_time>
              <thread_name>thread_name</thread_name>
              <thread_id>thread_id</thread_id>
              <level>level</level>
              <query_id>query_id</query_id>
              <logger_name>logger_name</logger_name>
              <message>message</message>
              <source_file>source_file</source_file>
              <source_line>source_line</source_line>
            </names>
          </formatting>
        </logger>
      </clickhouse>
    config.d/crash.xml: |
      <clickhouse>
        <send_crash_reports replace="replace">
          <enabled>false</enabled>
        </send_crash_reports>
      </clickhouse>
    config.d/load.xml: |
      <clickhouse>
        <async_load_databases replace="replace">false</async_load_databases>
      </clickhouse>
    config.d/system_log.xml: |
      <clickhouse>
        <text_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </text_log>
        <latency_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </latency_log>
        <error_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
        <query_metric_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </query_metric_log>
      </clickhouse>
  # -- Volume claim templates of the ClickHouse installation, used only when `clickhouse.persistence.enabled` is false.
  # @section -- ClickHouse
  templates:
    # -- Volume claim templates added when `persistence.enabled` is false. Mount each through
    # `clickhouse.extraVolumeMounts` under the same `name`. Without a mount at `/var/lib/clickhouse` the data is not kept.
    # @raw
    # Each entry takes these four fields, here a 50Gi PVC named `data`:
    #
    #   ```yaml
    #   - name: data
    #     accessModes:
    #       - ReadWriteOnce
    #     resources:
    #       requests:
    #         storage: 50Gi
    #     storageClassName: standard
    #   ```
    #
    # @default -- []
    # @section -- ClickHouse
    volumeClaimTemplates: []
  # -- Operator rules that spread the ClickHouse Pods across nodes, rendered as given. Types:
  # https://github.com/Altinity/clickhouse-operator/blob/1414503921da3ae475eb6f9a296d3475a6993768/docs/chi-examples/99-clickhouseinstallation-max.yaml#L428-L481
  # @section -- ClickHouse
  # @default -- []
  podDistribution: []
  # - type: ShardAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: ReplicaAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: MaxNumberPerNode
  #   number: 2
  #   topologyKey: kubernetes.io/hostname

  # -- S3 or GCS disk added as the `s3` volume of a `tiered` storage policy, where SigNoz's retention settings move older data.
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  coldStorage:
    # -- Enable cold storage on S3 or Google Cloud Storage (GCS).
    # @default -- false
    # @section -- ClickHouse
    enabled: false
    # -- Free space to keep on the default disk, in bytes.
    # @default -- "10485760"
    # @section -- ClickHouse
    defaultKeepFreeSpaceBytes: "10485760"
    # -- Type of cold storage: `s3` or `gcs`.
    # @default -- "s3"
    # @section -- ClickHouse
    type: s3
    # -- Bucket URL including the path ClickHouse writes under.
    # @raw
    # An S3 bucket:
    #
    #   ```yaml
    #   endpoint: https://my-bucket.s3-us-east-1.amazonaws.com/data/
    #   ```
    #
    # or a GCS bucket:
    #
    #   ```yaml
    #   endpoint: https://storage.googleapis.com/my-bucket/data/
    #   ```
    #
    # @default -- "https://<bucket-name>.s3-<region>.amazonaws.com/data/"
    # @section -- ClickHouse
    endpoint: https://<bucket-name>.s3-<region>.amazonaws.com/data/
    # -- Access key ID for S3 or GCS.
    # ClickHouse uses it for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<access_key_id>"
    # @section -- ClickHouse
    accessKey: <access_key_id>
    # -- Secret access key for S3 or GCS.
    # ClickHouse uses it for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<secret_access_key>"
    # @section -- ClickHouse
    secretAccess: <secret_access_key>
    # -- AWS IAM role that gives ClickHouse access to the `s3` bucket in place of `accessKey` and `secretAccess`.
    # @section -- ClickHouse
    role:
      # -- Use the role for `s3`: ClickHouse takes credentials from its environment instead of `accessKey` and `secretAccess`.
      # @default -- false
      # @section -- ClickHouse
      enabled: false
      # -- ServiceAccount annotations that bind the role, added when `coldStorage.enabled` and `role.enabled` are both true.
      # @section -- ClickHouse
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::******:role/*****
  # -- Sidecar collector in the ClickHouse Pod that sends `system.query_log` entries as logs to an OTLP receiver on the node's port 4317,
  # such as the k8s-infra agent.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  logs:
    system:
      # -- Collect ClickHouse system table entries as logs.
      # @section -- ClickHouse
      enabled: false
      image:
        # -- Image repository, optionally prefixed with a registry. `global.imageRegistry` replaces that registry when set.
        # @default -- "signoz/signoz-otel-collector"
        # @section -- ClickHouse
        repository: signoz/signoz-otel-collector
        # -- Tag of the system logs sidecar image.
        # @default -- "v0.144.15"
        # @section -- ClickHouse
        tag: v0.144.15
        # -- Pull policy of the system logs sidecar image.
        # @default -- "IfNotPresent"
        # @section -- ClickHouse
        pullPolicy: IfNotPresent
      # -- Resource requests and limits for the container.
      # @default -- {}
      # @section -- ClickHouse
      resources: {}
      # -- Extra environment variables for the container. An entry named like one the chart sets replaces it.
      # @section -- ClickHouse
      env: []
      # -- Sources of extra environment variables for the container.
      # @section -- ClickHouse
      envFrom: []
      # -- Extra volume mounts for the container. Their volumes come from `clickhouse.extraVolumes`.
      # @section -- ClickHouse
      extraVolumeMounts: []
      # -- Configuration of the sidecar collector, rendered as given into its config file.
      # @section -- ClickHouse
      # @default -- "See values.yaml"
      config:
        receivers:
          clickhousesystemtablesreceiver:
            dsn: tcp://localhost:9000
            query_log_scrape_config:
              scrape_interval_seconds: 30
              min_scrape_delay_seconds: 10
        processors:
          batch:
            send_batch_max_size: 25000
            send_batch_size: 20000
            timeout: 1s
          resourcedetection:
            detectors:
              - env
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        exporters:
          otlp:
            endpoint: ${env:K8S_HOST_IP}:4317
            tls:
              insecure: true
              insecure_skip_verify: true
            retry_on_failure:
              enabled: true
              initial_interval: 2s
              max_interval: 5s
              max_elapsed_time: 15s
            sending_queue:
              enabled: false
        service:
          telemetry:
            logs:
              encoding: json
          extensions:
            - health_check
          pipelines:
            logs:
              receivers:
                - clickhousesystemtablesreceiver
              processors:
                - resourcedetection
                - batch
              exporters:
                - otlp
  # -- Create an expandable StorageClass: `gp2-resizable` when `global.cloud` starts with `aws`, `gce-resizable`
  # when it starts with `gcp`. No volume uses it until `clickhouse.persistence.storageClass` names it.
  # @section -- ClickHouse
  # @default -- false
  installCustomStorageClass: false
  # -- Pre-upgrade hook Job that deletes the operator Deployment an older chart created.
  # When disabled, delete that Deployment before upgrading: `kubectl delete deployment <release>-clickhouse-operator -n <namespace>`.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  operatorUpgradeHook:
    # -- Run the hook on `helm upgrade`.
    # @section -- ClickHouse
    enabled: true
    image:
      # -- Image repository, optionally prefixed with a registry. `global.imageRegistry` replaces that registry when set.
      # @section -- ClickHouse
      repository: registry.k8s.io/kubectl
      # -- Tag of the kubectl image. The image publishes no `latest` tag.
      # @section -- ClickHouse
      tag: v1.36.3
      # -- Pull policy of the kubectl image.
      # @section -- ClickHouse
      pullPolicy: IfNotPresent
    # -- Retries before the Job, and with it the upgrade, is marked failed.
    # @section -- ClickHouse
    backoffLimit: 3
    # -- Resources of the hook container.
    # @section -- ClickHouse
    resources: {}
    # -- Node labels for Pod assignment.
    # @section -- ClickHouse
    nodeSelector: {}
    # -- Tolerations for Pod assignment.
    # @section -- ClickHouse
    tolerations: []
    # -- Affinity rules for Pod assignment.
    # @section -- ClickHouse
    affinity: {}
    # -- Topology spread constraints for Pod assignment.
    # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
    # @section -- ClickHouse
    topologySpreadConstraints: []
    # -- PriorityClass of the Pod.
    # @section -- ClickHouse
    priorityClassName: ""
    # -- Security context for the Pod.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    # @section -- ClickHouse
    podSecurityContext: {}
    # -- Security context for the container.
    # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    # @section -- ClickHouse
    containerSecurityContext: {}
  udf:
    # -- Download the histogramQuantile binary from GitHub in an init container. SigNoz's histogram percentile queries call it.
    # When false, supply the binary through `clickhouse.extraInitContainers`.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # -- Command of the histogramQuantile download init container.
    # @default -- "See values.yaml"
    # @section -- ClickHouse
    command:
      - sh
      - -c
      - |
        set -e
        version="v0.0.1"
        node_os=$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for ${node_os}/${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${version}/histogram-quantile_${node_os}_${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        chmod +x histogram-quantile
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        echo "histogram-quantile installed successfully"
    # -- Extra environment variables for the container.
    # @raw
    # A proxy for the download, and a credential from a Secret for a mirror that `command` fetches from:
    #
    #   ```yaml
    #   - name: https_proxy
    #     value: http://proxy.example.com:3128
    #   - name: MIRROR_TOKEN
    #     valueFrom:
    #       secretKeyRef:
    #         name: mirror-credentials
    #         key: token
    #   ```
    #
    # @default -- []
    # @section -- ClickHouse
    env: []
    # -- Sources of extra environment variables for the container.
    # @default -- []
    # @section -- ClickHouse
    envFrom: []
    # -- Resource requests and limits for the container.
    # @default -- {}
    # @section -- ClickHouse
    resources: {}
    # -- Extra volume mounts for the container. Their volumes come from `clickhouse.extraVolumes`.
    # @section -- ClickHouse
    extraVolumeMounts: []
  # -- Extra init containers for the Pod, run after the histogramQuantile download.
  # The user scripts volume is `shared-binary-volume`, mounted at `/var/lib/clickhouse/user_scripts`.
  # @default -- []
  # @section -- ClickHouse
  extraInitContainers: []
  # -- Extra containers for the Pod.
  # @section -- ClickHouse
  extraContainers: []
  # -- Startup probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  startupProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  # -- Liveness probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  livenessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 60
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1
  # -- Readiness probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @raw
  # A TCP check on the native port in place of the HTTP one:
  #
  #   ```yaml
  #   httpGet: null
  #   tcpSocket:
  #     port: 9000
  #   ```
  #
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  readinessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 10
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1
  # -- Resource requests and limits for the container.
  # @section -- ClickHouse
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  #   limits:
  #     cpu: 2000m
  #     memory: 4Gi

  # -- Security context for the Pod. `null` renders none, and `{}` keeps the defaults.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- ClickHouse
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  # -- Security context for every container of the ClickHouse Pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @raw
  # The restricted profile ClickHouse runs under:
  #
  #   ```yaml
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop: [ALL]
  #   runAsNonRoot: true
  #   seccompProfile:
  #     type: RuntimeDefault
  #   ```
  #
  # @section -- ClickHouse
  # @default -- {}
  containerSecurityContext: {}
  # -- PriorityClass of the Pod.
  # @section -- ClickHouse
  priorityClassName: ""
  # -- Node labels for Pod assignment.
  # @section -- ClickHouse
  # @default -- {}
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @section -- ClickHouse
  # @default -- []
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @section -- ClickHouse
  # @default -- {}
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @section -- ClickHouse
  topologySpreadConstraints: []
  # -- ClickHouse persistence configuration.
  # @section -- ClickHouse
  persistence:
    # -- Keep ClickHouse data on a PersistentVolumeClaim. When false, the data lives in an `emptyDir` and is lost
    # with the Pod, unless `clickhouse.templates.volumeClaimTemplates` provides volumes.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # -- Name of a PersistentVolumeClaim you created for the ClickHouse data, used instead of a PVC from the template.
    # @default -- ""
    # @section -- ClickHouse
    existingClaim: ""
    # -- StorageClass of the ClickHouse data PVC. `-` disables dynamic provisioning, null uses the cluster default,
    # and `global.storageClass` overrides it.
    # @default -- null
    # @section -- ClickHouse
    storageClass: null
    # -- VolumeAttributesClass to apply to the data PVC (Kubernetes 1.31+).
    # When set, renders `volumeAttributesClassName: <name>` on the PVC, allowing
    # in-place modification of volume parameters (e.g. EBS gp3 IOPS/throughput)
    # without recreating the underlying volume.
    # @section -- ClickHouse
    volumeAttributesClassName: null
    # -- Access modes of the PVC.
    # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
    # @default -- ["ReadWriteOnce"]
    # @section -- ClickHouse
    accessModes:
      - ReadWriteOnce
    # -- Size of the PVC.
    # @default -- "20Gi"
    # @section -- ClickHouse
    size: 20Gi
  # -- Extra volumes for the Pod.
  # @section -- ClickHouse
  extraVolumes: []
  # -- Extra volume mounts for the container.
  # @section -- ClickHouse
  extraVolumeMounts: []
  # -- Extra environment variables for the container. Names starting with `CONFIGURATION_` belong to the operator.
  # @section -- ClickHouse
  env: []
  # -- Sources of extra environment variables for the container.
  # @section -- ClickHouse
  envFrom: []
# ClickHouse Keeper, the default coordination store of the ClickHouse installation, rendered as a ClickHouseKeeperInstallation when `clickhouse.enabled` and `keeper.enabled` are both true.
keeper:
  # Set it to false when `clickhouse.externalZookeeper.servers` is used: as with `zookeeper.enabled`, the bundled store stays installed unless its `enabled` is false.
  # On an existing install's first upgrade to this chart, either set this to false or apply the Keeper CRD first; see https://signoz.io/docs/operate/migration/upgrade-0-152/
  # -- Install Keeper.
  # @section -- ClickHouse Keeper
  enabled: true
  # -- Name of the ClickHouse Keeper component, the `app.kubernetes.io/name` label of its objects. `keeper.nameOverride` takes precedence.
  # @section -- ClickHouse Keeper
  name: keeper
  # -- Override the chart name.
  # @section -- ClickHouse Keeper
  nameOverride: ""
  # -- Override the full resource name, the name of the ClickHouseKeeperInstallation.
  # With the default name, the release name can have at most 27 characters.
  # @section -- ClickHouse Keeper
  fullnameOverride: ""
  image:
    # -- Image repository, optionally prefixed with a registry. `global.imageRegistry` replaces that registry when set.
    # @section -- ClickHouse Keeper
    repository: clickhouse/clickhouse-keeper
    # -- Image tag. It does not follow `clickhouse.image.tag`.
    # A Keeper restart drops every ClickHouse session.
    # @section -- ClickHouse Keeper
    tag: 25.12.5
    # -- Image pull policy.
    # @section -- ClickHouse Keeper
    pullPolicy: IfNotPresent
  # -- Image pull secrets for the Keeper Pod.
  # @section -- ClickHouse Keeper
  imagePullSecrets: []
  # -- Number of replicas. Keeper needs a majority of its replicas to work.
  # @section -- ClickHouse Keeper
  replicaCount: 1
  # -- Labels to add to the ClickHouseKeeperInstallation. A key that names a chart label replaces its value.
  # @section -- ClickHouse Keeper
  labels: {}
  # -- Annotations to add to the ClickHouseKeeperInstallation.
  # @section -- ClickHouse Keeper
  annotations: {}
  pod:
    # -- Labels to add to the Pod.
    # A key named like a selector label (`app.kubernetes.io/name`, `app.kubernetes.io/instance`, `app.kubernetes.io/component`) is ignored.
    # @section -- ClickHouse Keeper
    labels: {}
    # -- Annotations to add to the Pod. Set a key to `null` to drop a default.
    # `signoz.io/port` must equal `prometheus/port` in `keeper.settings`.
    # @default -- "See values.yaml"
    # @section -- ClickHouse Keeper
    annotations:
      signoz.io/scrape: "true"
      signoz.io/port: "9141"
      signoz.io/path: /metrics
  # -- ClickHouse Keeper server settings. Set a key to `null` to drop a default.
  # `prometheus/port` must equal the `signoz.io/port` annotation in `keeper.pod.annotations`.
  # @default -- "See values.yaml"
  # @section -- ClickHouse Keeper
  settings:
    logger/level: warning
    logger/formatting/type: json
    logger/console: "true"
    listen_host: 0.0.0.0
    keeper_server/four_letter_word_white_list: "*"
    keeper_server/coordination_settings/raft_logs_level: information
    prometheus/endpoint: /metrics
    prometheus/port: "9141"
    prometheus/metrics: "true"
    prometheus/events: "true"
    prometheus/asynchronous_metrics: "true"
  # -- Security context for the Pod. `null` renders none, and `{}` keeps the defaults.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @default -- "See values.yaml"
  # @section -- ClickHouse Keeper
  podSecurityContext:
    fsGroup: 101
  # -- Security context for the container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @default -- "no container security context"
  # @section -- ClickHouse Keeper
  containerSecurityContext: {}
  # -- Extra environment variables for the container.
  # @section -- ClickHouse Keeper
  env: []
  # -- Sources of extra environment variables for the container.
  # @section -- ClickHouse Keeper
  envFrom: []
  # -- Extra volumes for the Pod.
  # @section -- ClickHouse Keeper
  extraVolumes: []
  # -- Extra volume mounts for the container.
  # @section -- ClickHouse Keeper
  extraVolumeMounts: []
  # -- Resource requests and limits for the container.
  # @default -- "See values.yaml"
  # @section -- ClickHouse Keeper
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  # -- PriorityClass of the Pod.
  # @default -- "no PriorityClass"
  # @section -- ClickHouse Keeper
  priorityClassName: ""
  # -- Node labels for Pod assignment.
  # @section -- ClickHouse Keeper
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @section -- ClickHouse Keeper
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @section -- ClickHouse Keeper
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @section -- ClickHouse Keeper
  topologySpreadConstraints: []
  # -- Topologies for distributing the ClickHouse Keeper Pods, in the operator's `podDistribution` format.
  # @section -- ClickHouse Keeper
  podDistribution: []
  # PersistentVolume of each ClickHouse Keeper replica. The PVC is kept when the installation or a replica is removed.
  persistence:
    # -- Access modes of the PVC.
    # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
    # @section -- ClickHouse Keeper
    accessModes:
      - ReadWriteOnce
    # -- Size of the PVC.
    # @section -- ClickHouse Keeper
    size: 10Gi
    # -- StorageClass of the PVC. `-` disables dynamic provisioning, null uses the cluster default, and `global.storageClass` overrides it.
    # @default -- "the default provisioner"
    # @section -- ClickHouse Keeper
    storageClass: null
# -- Values of the bundled ZooKeeper chart, which ClickHouse coordinates through when `zookeeper.enabled` is true. Its keys follow Bitnami's chart:
# https://github.com/bitnami/charts/blob/main/bitnami/zookeeper/values.yaml
# @default -- "See values.yaml"
# @section -- ZooKeeper
zookeeper:
  # -- Install the bundled ZooKeeper. Deprecated: ClickHouse Keeper (`keeper.enabled`) is the default coordination store, and unset now means off.
  # An existing install that runs ZooKeeper sets this to true for the upgrade together with `keeper.enabled: false`, or after applying the Keeper CRD, and keeps it until it has moved to Keeper; see https://signoz.io/docs/operate/migration/upgrade-0-152/
  # @default -- false
  # @section -- ZooKeeper
  enabled: false
  # -- Annotations on the metadata of every ZooKeeper object (not on the Pod template).
  # @section -- ZooKeeper
  commonAnnotations:
    signoz.io/deprecated: "true"
  # -- ZooKeeper image configuration.
  # @section -- ZooKeeper
  image:
    # -- Image registry.
    # @section -- ZooKeeper
    registry: *GLOBAL_IMAGE_REGISTRY
    # -- Image repository.
    # @section -- ZooKeeper
    repository: signoz/zookeeper
    # -- ZooKeeper version; ClickHouse does not work with every ZooKeeper version, so change it only to one ClickHouse supports.
    # @section -- ZooKeeper
    tag: 3.7.1
  # -- Replaces `zookeeper` in the ZooKeeper name `<release>-zookeeper`, by which the ClickHouse installation finds it.
  # @section -- ZooKeeper
  nameOverride: ""
  # -- Name of the ZooKeeper objects in place of `<release>-zookeeper`, by which the ClickHouse installation finds it.
  # @section -- ZooKeeper
  fullnameOverride: ""
  # -- Namespace of ZooKeeper, which must already exist. Empty means the release namespace.
  # @section -- ZooKeeper
  namespaceOverride: ""
  # -- Annotations on the ZooKeeper Pods. The `signoz.io/*` defaults let the SigNoz collectors scrape its metrics on port 9141.
  # @section -- ZooKeeper
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"
  # -- Periodic purge of old ZooKeeper snapshots and transaction logs.
  # @section -- ZooKeeper
  autopurge:
    # -- Hours between purges; 0 disables purging.
    # @section -- ZooKeeper
    purgeInterval: 1
  # -- ZooKeeper Prometheus metrics configuration.
  # @section -- ZooKeeper
  metrics:
    # -- Serve ZooKeeper's Prometheus metrics on port 9141, the port `podAnnotations` point the collectors at.
    # @section -- ZooKeeper
    enabled: true
    service:
      enabled: true
      # -- Annotations to add to the metrics Service.
      # @section -- ZooKeeper
      annotations: {}
      # signoz.io/scrape: 'true'
      # signoz.io/port: '9141'
      # signoz.io/path: /metrics
  # -- ZooKeeper log level.
  # @section -- ZooKeeper
  logLevel: INFO
  # -- Bitnami's built-in liveness probe. `customLivenessProbe` replaces it.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @section -- ZooKeeper
  livenessProbe:
    enabled: false
  # -- Bitnami's built-in readiness probe. `customReadinessProbe` replaces it.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @section -- ZooKeeper
  readinessProbe:
    enabled: false
  # -- Liveness probe of the ZooKeeper container: the `ruok` command on its admin server at port 8080.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @section -- ZooKeeper
  customLivenessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep ruok']
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  # -- Readiness probe of the ZooKeeper container: ready once the admin server's `ruok` command reports no error.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @section -- ZooKeeper
  customReadinessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null']
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  # -- ZooKeeper server ID of the first replica. Each further replica takes the next ID.
  # @section -- ZooKeeper
  minServerId: 1
  # -- Number of ZooKeeper replicas, each listed as a coordination node of the ClickHouse installation. Use an odd number to keep a quorum.
  # @section -- ZooKeeper
  replicaCount: 1
  # -- PodDisruptionBudget of the ZooKeeper Pods.
  # @section -- ZooKeeper
  pdb:
    # -- Create a PodDisruptionBudget.
    # Ref: https://kubernetes.io/docs/tasks/run-application/configure-pdb/
    # @section -- ZooKeeper
    create: false
  # -- Storage of the ZooKeeper data.
  # @section -- ZooKeeper
  persistence:
    # -- Enable persistence with a PersistentVolumeClaim (PVC). When false, the data lives in an `emptyDir`.
    # @section -- ZooKeeper
    enabled: true
    # -- Name of an existing PVC to use, with a single replica only.
    # @section -- ZooKeeper
    existingClaim: ""
    # -- StorageClass of the ZooKeeper data PVC. `-` disables dynamic provisioning, null uses the cluster default, and `global.storageClass` overrides it.
    # @section -- ZooKeeper
    storageClass: null
    # -- Access modes of the PVC.
    # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
    # @section -- ZooKeeper
    accessModes:
      - ReadWriteOnce
    # -- Size of the PVC.
    # @section -- ZooKeeper
    size: 8Gi
    # -- Annotations to add to the PVC.
    # @section -- ZooKeeper
    annotations: {}
  # -- Resource requests and limits for the container.
  # @section -- ZooKeeper
  resources:
    limits: {}
    requests:
      memory: 256Mi
      cpu: 100m
# -- Values of Altinity's clickhouse-operator chart, which installs the operator that reconciles the ClickHouseInstallation.
# Only settings that differ from that chart's defaults are set here. Its keys:
# https://github.com/Altinity/clickhouse-operator/tree/release-0.27.4/deploy/helm
# @ignored
altinity-clickhouse-operator:
  # `global.imagePullSecrets` and the root `imagePullSecrets` do not reach the
  # operator Pod or its CRD hook: set `imagePullSecrets` and
  # `crdHook.imagePullSecrets` here, as lists of `name:` objects.
  # -- Namespace of the operator. Empty means the release namespace. Altinity's chart does not create it: it must exist before
  # `helm install`, because the CRD-install hook runs before the chart's own resources (on a fresh install that uses
  # `clickhouse.namespace` here, create it first and install with `--take-ownership`).
  namespaceOverride: ""
  # altinity-clickhouse-operator.enabled -- Install the Altinity clickhouse-operator. Defaults to the value of clickhouse.enabled; set it only to override that (external ClickHouse: leave unset).
  # enabled: true

  # -- Names the operator's Deployment, ServiceAccount, Secret and metrics Service `<release>-clickhouse-operator`, so an upgrade takes over the
  # existing objects in place.
  nameOverride: clickhouse-operator
  rbac:
    # -- Grant the operator rights in its own namespace only (Role and RoleBinding). Set false, with `watchNamespaces`, to run ClickHouse in another namespace.
    namespaceScoped: true
  # -- Labels on the operator Pod. The component label is what metrics queries and selectors on the operator match.
  podLabels:
    app.kubernetes.io/component: operator
  # -- Annotations on the operator Pod. The SigNoz collectors scrape Pods that carry `signoz.io/scrape`.
  podAnnotations:
    signoz.io/port: '8888'
    signoz.io/scrape: 'true'
    # Altinity's default annotations, removed so the Pod carries only the SigNoz scrape annotations.
    prometheus.io/port: null
    prometheus.io/scrape: null
    clickhouse-operator-metrics/port: null
    clickhouse-operator-metrics/scrape: null
  configs:
    files:
      # Only the keys that differ from Altinity's config.yaml, which Helm deep-merges into its defaults; re-check them on a subchart bump.
      config.yaml:
        reconcile:
          statefulSet:
            update:
              # Seconds the operator waits for a created or updated StatefulSet to become Ready; Altinity's 300 is too short for large ClickHouse volumes.
              timeout: 900
        clickhouse:
          configuration:
            network:
              # Altinity's value with its `cluster.local` taken from `global.clusterDomain` (Altinity's chart templates these files),
              # so the `default` user's host check matches the ClickHouse Pods on any cluster domain.
              hostRegexpTemplate: '(chi-{chi}-[^.]+\d+-\d+|clickhouse\-{chi})\.{namespace}\.svc\.{{ include "signoz.clusterDomain" . | replace "." "\\." }}$'
    configdFiles:
      # level information + JSON formatting; Altinity's default is debug text.
      01-clickhouse-02-logger.xml: |
        <yandex>
            <logger>
                <!-- Possible levels: https://github.com/pocoproject/poco/blob/devel/Foundation/include/Poco/Logger.h#L105 -->
                <level>information</level>
                <formatting>
                  <type>json</type>
                </formatting>
                <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
                <size>1000M</size>
                <count>10</count>
                <!-- Default behavior is autodetection (log to console if not daemon mode and is tty) -->
                <console>1</console>
            </logger>
        </yandex>
      # query_log with a 30-day TTL; unlike Altinity's file, it leaves query_thread_log in place (file 12).
      01-clickhouse-03-query_log.xml: |
        <yandex>
            <query_log replace="1">
                <database>system</database>
                <table>query_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_log>
        </yandex>
      # TTL 7 days; Altinity's default is 30.
      01-clickhouse-05-trace_log.xml: |-
        <yandex>
            <trace_log replace="1">
                <database>system</database>
                <table>trace_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </trace_log>
        </yandex>
      # Files 06-16 are SigNoz additions with no upstream counterpart.
      01-clickhouse-06-asynchronous_insert_log.xml: |
        <yandex>
            <asynchronous_insert_log replace="1">
                <database>system</database>
                <table>asynchronous_insert_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_insert_log>
        </yandex>
      01-clickhouse-07-asynchronous_metric_log.xml: |
        <yandex>
            <asynchronous_metric_log replace="1">
                <database>system</database>
                <table>asynchronous_metric_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_metric_log>
        </yandex>
      01-clickhouse-08-backup_log.xml: |
        <yandex>
            <backup_log replace="1">
                <database>system</database>
                <table>backup_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </backup_log>
        </yandex>
      01-clickhouse-09-blob_storage_log.xml: |
        <yandex>
            <blob_storage_log replace="1">
                <database>system</database>
                <table>blob_storage_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </blob_storage_log>
        </yandex>
      01-clickhouse-10-crash_log.xml: |
        <yandex>
            <crash_log replace="1">
                <database>system</database>
