{{- if include "clickhouse.createSecret" . }}
{{- $password := .Values.externalClickhouse.password }}
{{- if .Values.clickhouse.enabled }}
{{- $password = .Values.clickhouse.password }}
{{- end }}
{{- $namespaces := list .Release.Namespace }}
{{- /* A copy goes into clickhouse.namespace: the ClickHouseInstallation resolves secretKeyRef only in its own namespace. */}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.namespace (ne .Values.clickhouse.namespace .Release.Namespace) }}
{{- $namespaces = append $namespaces .Values.clickhouse.namespace }}
{{- end }}
{{- range $namespaces }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clickhouse.secretName" $ }}
  namespace: {{ . }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
  {{- if $.Values.clickhouse.enabled }}
  password_sha256_hex: {{ $password | sha256sum | quote }}
  {{- end }}
{{- end }}
{{- end }}
