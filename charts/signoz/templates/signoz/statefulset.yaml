{{- $persistence := .Values.signoz.persistence }}
{{- $sqliteVolume := "" }}
{{- if not .Values.postgresql.enabled }}
{{- if not $persistence.enabled }}
{{- $sqliteVolume = "signoz-db-volume" }}
{{- else if $persistence.existingClaim }}
{{- $sqliteVolume = "signoz-db-existing-claim" }}
{{- else }}
{{- $sqliteVolume = "signoz-db" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "signoz.fullname" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "signoz.labels" . | fromYaml) .Values.signoz.labels)) | nindent 4 }}
  {{- with .Values.signoz.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "signoz.fullname" . }}
  replicas: {{ .Values.signoz.replicaCount }}
  selector:
    matchLabels:
      {{- include "signoz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.signoz.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "signoz.selectorLabels" . | nindent 8 }}
    spec:
      {{- with include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.signoz.imagePullSecrets)) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "signoz.lib.serviceAccountName" (dict "serviceAccount" .Values.signoz.serviceAccount "fullname" (include "signoz.fullname" .)) }}
      {{- with .Values.signoz.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.signoz.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.signoz.podSecurityContext | nindent 8 }}
      containers:
        - name: signoz
          securityContext:
            {{- toYaml .Values.signoz.securityContext | nindent 12 }}
          image: {{ include "signoz.lib.image" (dict "registry" .Values.global.imageRegistry "image" .Values.signoz.image "defaultTag" .Chart.AppVersion "name" "signoz.image") }}
          imagePullPolicy: {{ .Values.signoz.image.pullPolicy }}
          {{- with .Values.signoz.additionalArgs }}
          args:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- /* SigNoz binds these ports itself; signoz.service ports move only the Service, which targets them by name. */}}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-internal
              containerPort: 8085
              protocol: TCP
            - name: opamp-internal
              containerPort: 4320
              protocol: TCP
          env:
            {{- include "clickhouse.env" . | nindent 12 }}
            {{- include "signoz.env" . | nindent 12 }}
          {{- $liveness := .Values.signoz.livenessProbe }}
          {{- if $liveness.enabled }}
          livenessProbe:
            httpGet:
              port: {{ $liveness.port }}
              path: {{ $liveness.path }}
            initialDelaySeconds: {{ $liveness.initialDelaySeconds }}
            periodSeconds: {{ $liveness.periodSeconds }}
            timeoutSeconds: {{ $liveness.timeoutSeconds }}
            successThreshold: {{ $liveness.successThreshold }}
            failureThreshold: {{ $liveness.failureThreshold }}
          {{- else if .Values.signoz.customLivenessProbe }}
          livenessProbe:
            {{- toYaml .Values.signoz.customLivenessProbe | nindent 12 }}
          {{- end }}
          {{- $readiness := .Values.signoz.readinessProbe }}
          {{- if $readiness.enabled }}
          readinessProbe:
            httpGet:
              port: {{ $readiness.port }}
              path: {{ $readiness.path }}
            initialDelaySeconds: {{ $readiness.initialDelaySeconds }}
            periodSeconds: {{ $readiness.periodSeconds }}
            timeoutSeconds: {{ $readiness.timeoutSeconds }}
            successThreshold: {{ $readiness.successThreshold }}
            failureThreshold: {{ $readiness.failureThreshold }}
          {{- else if .Values.signoz.customReadinessProbe }}
          readinessProbe:
            {{- toYaml .Values.signoz.customReadinessProbe | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with $sqliteVolume }}
            - name: {{ . }}
              mountPath: /var/lib/signoz/
            {{- end }}
            {{- with .Values.signoz.additionalVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.signoz.resources | nindent 12 }}
      {{- if or (has $sqliteVolume (list "signoz-db-volume" "signoz-db-existing-claim")) .Values.signoz.additionalVolumes }}
      volumes:
        {{- if eq $sqliteVolume "signoz-db-volume" }}
        - name: signoz-db-volume
          emptyDir: {}
        {{- else if eq $sqliteVolume "signoz-db-existing-claim" }}
        - name: signoz-db-existing-claim
          persistentVolumeClaim:
            claimName: {{ $persistence.existingClaim }}
        {{- end }}
        {{- with .Values.signoz.additionalVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if eq $sqliteVolume "signoz-db" }}
  volumeClaimTemplates:
    - metadata:
        name: signoz-db
      spec:
        accessModes:
          {{- toYaml $persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $persistence.size }}
        {{- with default $persistence.storageClass .Values.global.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
        {{- end }}
  {{- end }}
