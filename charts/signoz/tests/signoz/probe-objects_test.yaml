# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/probe-objects
templates:
  - templates/signoz/statefulset.yaml
tests:
  - it: probes SigNoz's readiness with the handler written in signoz.readinessProbe, a tcpSocket in place of the default httpGet
    set:
      signoz.readinessProbe:
        httpGet: null
        tcpSocket:
          port: http
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].readinessProbe.tcpSocket
          value: {port: http}
      - notExists:
          path: spec.template.spec.containers[?(@.name == "signoz")].readinessProbe.httpGet
  - it: runs SigNoz without a liveness probe with signoz.livenessProbe set to null
    set:
      signoz.livenessProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "signoz")].livenessProbe
  - it: gives SigNoz the startup probe written in signoz.startupProbe
    set:
      signoz.startupProbe:
        httpGet:
          port: http
          path: /api/v1/health
        failureThreshold: 30
        periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].startupProbe
          value:
            httpGet: {port: http, path: /api/v1/health}
            failureThreshold: 30
            periodSeconds: 10
