# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse_configmaps_test.yaml
templates:
  - templates/clickhouse/configmap-functions.yaml
  - templates/clickhouse/configmap-logs.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: renders the custom functions ConfigMap as <fullname>-custom-functions
    template: templates/clickhouse/configmap-functions.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: golden-clickhouse-custom-functions
  - it: renders the logs ConfigMap as <fullname>-logs-system-config when system logs are enabled
    template: templates/clickhouse/configmap-logs.yaml
    set:
      clickhouse.logs.system.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: golden-clickhouse-logs-system-config
  - it: renders the logs ConfigMap config without a service.telemetry.metrics block
    template: templates/clickhouse/configmap-logs.yaml
    set:
      clickhouse.logs.system.enabled: true
    asserts:
      - notMatchRegex:
          path: data["config.yaml"]
          pattern: "metrics:"
  - it: follows clickhouse.fullnameOverride in every name
    set:
      clickhouse.fullnameOverride: chfnm
      clickhouse.logs.system.enabled: true
    asserts:
      - template: templates/clickhouse/configmap-functions.yaml
        equal:
          path: metadata.name
          value: chfnm-custom-functions
      - template: templates/clickhouse/configmap-logs.yaml
        equal:
          path: metadata.name
          value: chfnm-logs-system-config
  - it: renders none of them when clickhouse.enabled is false
    set:
      clickhouse.enabled: false
      clickhouse.logs.system.enabled: true
    asserts:
      - template: templates/clickhouse/configmap-functions.yaml
        hasDocuments:
          count: 0
      - template: templates/clickhouse/configmap-logs.yaml
        hasDocuments:
          count: 0
