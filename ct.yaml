# See https://github.com/helm/chart-testing#configuration
remote: origin
target-branch: main
debug: true
# Discover charts under charts/ and process only the ones changed in the PR.
chart-dirs:
  - charts
# redpanda and zookeeper are vendored and carry no tests; signoz-otel-gateway is
# excluded until its standalone rendering is fixed.
excluded-charts:
  - redpanda
  - zookeeper
  - signoz-otel-gateway
check-version-increment: false
helm-extra-args: --timeout 5m
chart-repos:
  - signoz=https://charts.signoz.io
  - altinity=https://helm.altinity.com
