name: helm-ci-setup
description: >-
  Install the pinned Helm chart CI toolchain and make it the single source of
  truth for tool versions: helm, chart-testing (ct) and Go. Every version below
  is SHA- or checksum-pinned.

# Pinned versions (keep the comment and the pin in sync):
#   azure/setup-helm             2f5e7bc67f1f9972ab16657bb795f36d8f04de0e  v5.1.0
#   helm (via setup-helm)        v3.20.0
#   helm/chart-testing-action    720270857a28afd41e2426521a7801db09e9b510  v2.9.0 (ct 3.15.0, yamllint, yamale)
#   actions/setup-go             b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  v7.0.0
#   go (via setup-go)            1.22

runs:
  using: composite
  steps:
    - name: set-up-helm
      uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      with:
        version: v3.20.0

    - name: set-up-chart-testing
      uses: helm/chart-testing-action@720270857a28afd41e2426521a7801db09e9b510 # v2.9.0

    - name: set-up-go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.22"
