# global -- Global override values for the chart.
# @section -- Global Settings
global:
  # global.imageRegistry -- Overrides the Image registry globally for all components.
  # @default -- null
  # @section -- Global Settings
  imageRegistry: &GLOBAL_IMAGE_REGISTRY null
  # global.imagePullSecrets -- Global Image Pull Secrets.
  # @default -- []
  # @section -- Global Settings
  imagePullSecrets: []
  # global.storageClass -- Overrides the storage class for all PVCs with persistence enabled.
  # If not set, the default storage class is used.
  # If set to "-", storageClassName will be an empty string, which disables dynamic provisioning.
  # @default -- null
  # @section -- Global Settings
  storageClass: null
  # global.clusterDomain -- The Kubernetes cluster domain.
  # It is used only when components are installed in different namespaces.
  # @default -- "cluster.local"
  # @section -- Global Settings
  clusterDomain: cluster.local
  # global.clusterName -- The Kubernetes cluster name.
  # It is used to attach to telemetry data via the resource detection processor.
  # @default -- ""
  # @section -- Global Settings
  clusterName: ""
  # global.cloud -- The Kubernetes cluster cloud provider and distribution (if any).
  # example: `aws`, `azure`, `gcp`, `gcp/autogke`, `hcloud`, `other`
  # The storage class for persistent volumes is selected based on this value.
  # When set to 'aws' or 'gcp' with `installCustomStorageClass` enabled, a new expandable storage class is created.
  # @default -- "other"
  # @section -- Global Settings
  cloud: other
# -- Override the default chart name.
# @section -- General Settings
# @default -- ""
nameOverride: ""
# -- Override the default full chart name.
# @section -- General Settings
# @default -- ""
fullnameOverride: ""
# -- Name of the K8s cluster. Used by SigNoz OtelCollectors to attach to telemetry data.
# @section -- General Settings
# @default -- ""
clusterName: ""
# -- Image Registry Secret Names for all SigNoz components.
# If `global.imagePullSecrets` is set, it will be merged with this list.
# This has lower precedence than `imagePullSecrets` at the individual component level.
# @section -- General Settings
# @default -- []
imagePullSecrets: []
# - "signoz-pull-secret"

# clickhouse -- ClickHouse settings. The ClickHouseInstallation, its ConfigMaps and ServiceAccount are rendered by this chart; see the keys below.
# @default -- "See values.yaml"
# @section -- ClickHouse
clickhouse:
  # clickhouse.enabled -- Whether to install ClickHouse. If false, `externalClickhouse.host` must be set.
  # @section -- ClickHouse
  # @default -- true
  enabled: true
  # -- Name of the clickhouse component
  # @section -- ClickHouse
  name: clickhouse
  # clickhouse.nameOverride -- Name override for ClickHouse.
  # @section -- ClickHouse
  # @default -- ""
  nameOverride: ""
  # clickhouse.fullnameOverride -- Fullname override for ClickHouse.
  # @section -- ClickHouse
  # @default -- ""
  fullnameOverride: ""
  # clickhouse.namespace -- The namespace ClickHouse (the ClickHouseInstallation, its ConfigMaps, ServiceAccount and hooks) is installed into.
  # Defaults to the release namespace. When set to another namespace the chart creates it.
  # The operator stays in the release namespace; to make it manage ClickHouse there, either set `altinity-clickhouse-operator.namespaceOverride`
  # to the same value (operator runs next to ClickHouse, as older chart versions did), or set `altinity-clickhouse-operator.watchNamespaces`
  # to a list with that one namespace as a plain name (no regexp, one entry; two entries or a regexp make the operator watch all namespaces)
  # and `altinity-clickhouse-operator.rbac.namespaceScoped: false`. The chart only checks that one of these watch settings (or the watch list in the operator's config file) is set, not its value.
  # @section -- ClickHouse
  # @default -- ""
  namespace: ""
  # clickhouse.image -- ClickHouse image configuration.
  # @section -- ClickHouse
  image:
    # clickhouse.image.repository -- Image repository. May start with a registry (`registry.k8s.io/kubectl`); `global.imageRegistry` replaces that registry when set.
    # @default -- "clickhouse/clickhouse-server"
    # @section -- ClickHouse
    repository: clickhouse/clickhouse-server
    # clickhouse.image.tag -- ClickHouse image tag to use. SigNoz is not always tested with the latest version of ClickHouse.
    # Only override if you know what you are doing.
    # @default -- "25.12.5"
    # @section -- ClickHouse
    tag: 25.12.5
    # clickhouse.image.pullPolicy -- ClickHouse image pull policy.
    # @default -- "IfNotPresent"
    # @section -- ClickHouse
    pullPolicy: IfNotPresent
  # clickhouse.imagePullSecrets -- Image Registry Secret Names for ClickHouse. Merged with `global.imagePullSecrets` if set.
  # @section -- ClickHouse
  # @default -- []
  imagePullSecrets: []
  # - "clickhouse-pull-secret"

  # clickhouse.layout -- ClickHouse cluster layout. (Experimental, use at own risk)
  # For a full list of options, see https://github.com/Altinity/clickhouse-operator/blob/master/docs/custom_resource_explained.md
  # @section -- ClickHouse
  layout:
    shardsCount: 1
    replicasCount: 1
  # clickhouse.cluster -- ClickHouse cluster name.
  # @section -- ClickHouse
  # @default -- "cluster"
  cluster: cluster
  # clickhouse.serviceAccount -- ClickHouse Service Account configuration.
  # @section -- ClickHouse
  serviceAccount:
    # clickhouse.serviceAccount.create -- Specifies whether a service account should be created.
    # @default -- true
    # @section -- ClickHouse
    create: true
    # clickhouse.serviceAccount.annotations -- Annotations to add to the service account.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # clickhouse.serviceAccount.name -- The name of the service account to use. If not set and create is true, a name is generated.
    # @default -- null
    # @section -- ClickHouse
    name:
  # -- ClickHouse instance labels
  # @section -- ClickHouse
  labels: {}
  # clickhouse.annotations -- Annotations for the ClickHouse instance.
  # @section -- ClickHouse
  # @default -- {}
  annotations: {}
  # -- ClickHouse pod labels
  # @section -- ClickHouse
  podLabels: {}
  # clickhouse.podAnnotations -- Annotations for the ClickHouse pod(s).
  # @section -- ClickHouse
  podAnnotations:
    signoz.io/scrape: 'true'
    signoz.io/port: '9363'
    signoz.io/path: /metrics
  # clickhouse.service -- ClickHouse service configuration.
  # @section -- ClickHouse
  service:
    # clickhouse.service.annotations -- Annotations for the ClickHouse service.
    # @default -- {}
    # @section -- ClickHouse
    annotations: {}
    # clickhouse.service.type -- Service type. `LoadBalancer` allows external access; `NodePort` is more secure and has no extra cost.
    # @default -- "ClusterIP"
    # @section -- ClickHouse
    type: ClusterIP
    # clickhouse.service.httpPort -- ClickHouse HTTP port.
    # @default -- 8123
    # @section -- ClickHouse
    httpPort: 8123
    # clickhouse.service.tcpPort -- ClickHouse TCP port.
    # @default -- 9000
    # @section -- ClickHouse
    tcpPort: 9000
  # clickhouse.database -- ClickHouse Settings for SigNoz Metrics.
  # @section -- ClickHouse
  # @default -- "signoz_metrics"
  database: signoz_metrics
  # clickhouse.traceDatabase -- ClickHouse Settings for SigNoz Traces.
  # @section -- ClickHouse
  # @default -- "signoz_traces"
  traceDatabase: signoz_traces
  # clickhouse.logDatabase -- ClickHouse Settings for SigNoz Logs.
  # @section -- ClickHouse
  # @default -- "signoz_logs"
  logDatabase: signoz_logs
  # clickhouse.meterDatabase -- Clickhouse meter Database (SigNoz Meter)
  # @section -- ClickHouse
  # @default -- "signoz_meter"
  meterDatabase: signoz_meter
  # clickhouse.user -- ClickHouse user.
  # @section -- ClickHouse
  # @default -- "admin"
  user: admin
  # clickhouse.password -- ClickHouse password.
  # Rendered as given, in plain text, into the ClickHouseInstallation and into the `CLICKHOUSE_PASSWORD` env of the components that connect to ClickHouse.
  # @section -- ClickHouse
  # @default -- "27ff0399-0d3a-4bd8-919d-17c2181e6fb9"
  password: 27ff0399-0d3a-4bd8-919d-17c2181e6fb9
  # clickhouse.secure -- Whether to use a TLS connection when connecting to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  secure: false
  # clickhouse.verify -- Whether to verify the TLS certificate on connection to ClickHouse.
  # @section -- ClickHouse
  # @default -- false
  verify: false
  # clickhouse.allowedNetworkIps -- An allowlist of IP addresses or network masks the ClickHouse user can access from.
  # By default, private network ranges are allowed.
  # Refs:
  # - https://clickhouse.com/docs/en/operations/settings/settings-users/#user-namenetworks
  # - https://en.wikipedia.org/wiki/Reserved_IP_addresses#IPv4
  # @section -- ClickHouse
  allowedNetworkIps:
    - "10.0.0.0/8"
    - "100.64.0.0/10"
    - "172.16.0.0/12"
    - "192.0.0.0/24"
    - "198.18.0.0/15"
    - "192.168.0.0/16"
  # clickhouse.externalZookeeper -- Configuration for an external Zookeeper.
  # When set, its `servers` list (one `host` and `port` per entry) is used as the installation's ZooKeeper nodes instead of the bundled ZooKeeper's pods.
  # The bundled ZooKeeper is still installed unless `zookeeper.enabled` is false.
  # @section -- ClickHouse
  # @default -- {}
  externalZookeeper: {}
  # servers:
  # - host: signoz-signoz-zookeeper
  #   port: 2181

  # clickhouse.profiles -- ClickHouse user profile configuration.
  # Use this to override profile settings, e.g., `default/max_memory_usage: 40000000000`.
  # For the full list of settings, see:
  # - https://clickhouse.com/docs/en/operations/settings/settings-profiles/
  # - https://clickhouse.com/docs/en/operations/settings/settings/
  # @section -- ClickHouse
  # @default -- {}
  profiles: {}
  # clickhouse.defaultProfiles -- Default user profile configuration for ClickHouse. !!! Please DO NOT override this !!!
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  defaultProfiles:
    default/allow_experimental_window_functions: "1"
    default/allow_nondeterministic_mutations: "1"
    default/secondary_indices_enable_bulk_filtering: "0"
    admin/secondary_indices_enable_bulk_filtering: "0"
    default/query_plan_max_limit_for_lazy_materialization: "0"
    admin/query_plan_max_limit_for_lazy_materialization: "0"
  # clickhouse.settings -- ClickHouse settings configuration.
  # You can use this to override settings, e.g., `prometheus/port: 9363`.
  # For the full list of settings, see https://clickhouse.com/docs/en/operations/settings/settings/
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  settings:
    # Uncomment those lines to enable the built-in Prometheus HTTP endpoint in ClickHouse.
    prometheus/endpoint: /metrics
    prometheus/port: 9363
    # prometheus/metrics: true
    # prometheus/events: true
    # prometheus/asynchronous_metrics: true
  # clickhouse.defaultSettings -- Default settings for ClickHouse. !!! Please DO NOT override this !!!
  # @section -- ClickHouse
  defaultSettings:
    format_schema_path: /etc/clickhouse-server/config.d/
    user_scripts_path: /var/lib/clickhouse/user_scripts/
    user_defined_executable_functions_config: '/etc/clickhouse-server/functions/custom-functions.xml'
  # clickhouse.files -- ClickHouse configuration files.
  # Refs:
  # - https://clickhouse.com/docs/en/operations/configuration-files/
  # - https://github.com/Altinity/clickhouse-operator/blob/master/docs/chi-examples/05-settings-05-files-nested.yaml
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  files:
    config.d/formatting.xml: |
      <clickhouse>
        <logger>
          <formatting replace="replace">
            <type>json</type>
            <names>
              <date_time>date_time</date_time>
              <thread_name>thread_name</thread_name>
              <thread_id>thread_id</thread_id>
              <level>level</level>
              <query_id>query_id</query_id>
              <logger_name>logger_name</logger_name>
              <message>message</message>
              <source_file>source_file</source_file>
              <source_line>source_line</source_line>
            </names>
          </formatting>
        </logger>
      </clickhouse>
    config.d/crash.xml: |
      <clickhouse>
        <send_crash_reports replace="replace">
          <enabled>false</enabled>
        </send_crash_reports>
      </clickhouse>
    config.d/load.xml: |
      <clickhouse>
        <async_load_databases replace="replace">false</async_load_databases>
      </clickhouse>
    config.d/system_log.xml: |
      <clickhouse>
        <text_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </text_log>
        <latency_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </latency_log>
        <error_log>
          <ttl>event_date + INTERVAL 7 DAY DELETE</ttl>
        </error_log>
        <query_metric_log>
          <ttl>event_date + INTERVAL 3 DAY DELETE</ttl>
        </query_metric_log>
      </clickhouse>
  # -- Custom volume claim templates for ClickHouse pod
  # This is only used when persistence.enabled is false
  # @section -- ClickHouse
  templates:
    # clickhouse.templates.volumeClaimTemplates -- Volume claim templates added to the installation when `persistence.enabled` is false; each entry is read for `name`, `accessModes`, `resources.requests.storage` and `storageClassName`.
    # @default -- []
    # @section -- ClickHouse
    volumeClaimTemplates: []

  # clickhouse.podDistribution -- Topologies for distributing the ClickHouse pods.
  # Possible values can be found here: https://github.com/Altinity/clickhouse-operator/blob/1414503921da3ae475eb6f9a296d3475a6993768/docs/chi-examples/99-clickhouseinstallation-max.yaml#L428-L481
  # @section -- ClickHouse
  # @default -- []
  podDistribution: []
  # - type: ShardAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: ReplicaAntiAffinity
  #   topologyKey: kubernetes.io/hostname
  # - type: MaxNumberPerNode
  #   number: 2
  #   topologyKey: kubernetes.io/hostname

  # clickhouse.coldStorage -- Cold storage configuration.
  # @section -- ClickHouse
  # @default -- "See values.yaml"
  coldStorage:
    # clickhouse.coldStorage.enabled -- Whether to enable S3/GCS cold storage.
    # @default -- false
    # @section -- ClickHouse
    enabled: false
    # clickhouse.coldStorage.defaultKeepFreeSpaceBytes -- Reserve free space on the default disk (in bytes).
    # @default -- "10485760"
    # @section -- ClickHouse
    defaultKeepFreeSpaceBytes: "10485760"
    # clickhouse.coldStorage.type -- Type of cold storage: `s3` or `gcs`.
    # @default -- "s3"
    # @section -- ClickHouse
    type: s3
    # clickhouse.coldStorage.endpoint -- Endpoint for S3 or GCS.
    # For S3 (us-east-1): https://s3.amazonaws.com
    # For S3 (other regions): https://s3-<region>.amazonaws.com
    # For GCS: https://storage.googleapis.com/<bucket-name>/data/
    # @default -- "https://<bucket-name>.s3-<region>.amazonaws.com/data/"
    # @section -- ClickHouse
    endpoint: https://<bucket-name>.s3-<region>.amazonaws.com/data/
    # clickhouse.coldStorage.accessKey -- Access Key ID for S3 or GCS.
    # Used for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<access_key_id>"
    # @section -- ClickHouse
    accessKey: <access_key_id>
    # clickhouse.coldStorage.secretAccess -- Secret Access Key for S3 or GCS.
    # Used for `gcs`, and for `s3` when `role.enabled` is false.
    # @default -- "<secret_access_key>"
    # @section -- ClickHouse
    secretAccess: <secret_access_key>
    # clickhouse.coldStorage.role -- AWS IAM role configuration to use environment variables instead of keys.
    # @section -- ClickHouse
    role:
      # clickhouse.coldStorage.role.enabled -- Whether to enable using an AWS IAM ARN role.
      # Used only for `s3`: ClickHouse then takes credentials from the environment instead of `accessKey` and `secretAccess`.
      # @default -- false
      # @section -- ClickHouse
      enabled: false
      # clickhouse.coldStorage.role.annotations -- Annotations for the service account to assume the AWS role.
      # Added to the ClickHouse ServiceAccount when `coldStorage.enabled` and `role.enabled` are both true.
      # @section -- ClickHouse
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::******:role/*****
  # -- Collection of ClickHouse system table entries as logs, by a `signoz-otel-collector` sidecar in the ClickHouse pod.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  logs:
    system:
      # -- Enable collection of system table entries as logs
      # @section -- ClickHouse
      enabled: false
      image:
        # clickhouse.logs.system.image.repository -- Image repository. May start with a registry (`registry.k8s.io/kubectl`); `global.imageRegistry` replaces that registry when set.
        # @default -- "signoz/signoz-otel-collector"
        # @section -- ClickHouse
        repository: signoz/signoz-otel-collector
        # clickhouse.logs.system.image.tag -- Tag of the system logs sidecar image.
        # @default -- "v0.144.15"
        # @section -- ClickHouse
        tag: v0.144.15
        # clickhouse.logs.system.image.pullPolicy -- Pull policy of the system logs sidecar image.
        # @default -- "IfNotPresent"
        # @section -- ClickHouse
        pullPolicy: IfNotPresent
      # clickhouse.logs.system.resources -- Resources of the system logs sidecar container, a Kubernetes ResourceRequirements object rendered as given.
      # @default -- {}
      # @section -- ClickHouse
      resources: {}
      # -- Config of the opentelemetry collector
      # @section -- ClickHouse
      # @default -- "See values.yaml"
      config:
        receivers:
          clickhousesystemtablesreceiver:
            dsn: tcp://localhost:9000
            query_log_scrape_config:
              scrape_interval_seconds: 30
              min_scrape_delay_seconds: 10
        processors:
          batch:
            send_batch_max_size: 25000
            send_batch_size: 20000
            timeout: 1s
          resourcedetection:
            detectors:
              - env
        extensions:
          health_check:
            endpoint: 0.0.0.0:13133
        exporters:
          otlp:
            endpoint: ${env:K8S_HOST_IP}:4317
            tls:
              insecure: true
              insecure_skip_verify: true
            retry_on_failure:
              enabled: true
              initial_interval: 2s
              max_interval: 5s
              max_elapsed_time: 15s
            sending_queue:
              enabled: false
        service:
          telemetry:
            logs:
              encoding: json
          extensions:
            - health_check
          pipelines:
            logs:
              receivers:
                - clickhousesystemtablesreceiver
              processors:
                - resourcedetection
                - batch
              exporters:
                - otlp
  # clickhouse.installCustomStorageClass -- When enabled with `cloud` as `gcp` or `aws`, creates a custom storage class with volume expansion permission.
  # The StorageClass (`gp2-resizable` for `aws`, `gce-resizable` for `gcp`) renders only when `clickhouse.enabled` and this key are both true and `global.cloud` starts with `aws` or `gcp`.
  # The chart does not select it for any volume; set `clickhouse.persistence.storageClass` to its name to use it.
  # @section -- ClickHouse
  # @default -- false
  installCustomStorageClass: false
  # -- Pre-upgrade hook for installs created before the operator came from Altinity's chart.
  # The old operator Deployment has different selector labels, and a Deployment selector cannot be
  # changed in place, so the hook deletes the old Deployment and Helm then creates the new one under
  # the same name. It selects by the old labels only, so it finds nothing on later upgrades and on
  # fresh installs it never runs (pre-upgrade only).
  # Set `clickhouse.operatorUpgradeHook.enabled` to false to skip it; then delete the old Deployment yourself before upgrading:
  #   kubectl delete deployment <release>-clickhouse-operator -n <namespace>
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  operatorUpgradeHook:
    # -- Run the hook on `helm upgrade`.
    # @section -- ClickHouse
    enabled: true
    image:
      # -- Image repository. May start with a registry (`registry.k8s.io/kubectl`); `global.imageRegistry` replaces that registry when set.
      # @section -- ClickHouse
      repository: registry.k8s.io/kubectl
      # -- Tag of the kubectl image. The image publishes no `latest` tag.
      # @section -- ClickHouse
      tag: v1.36.3
      # -- Pull policy of the kubectl image.
      # @section -- ClickHouse
      pullPolicy: IfNotPresent
    # -- Retries before the Job, and with it the upgrade, is marked failed.
    # @section -- ClickHouse
    backoffLimit: 3
    # -- Resources of the hook container.
    # @section -- ClickHouse
    resources: {}
  udf:
    # clickhouse.udf.enabled -- Runs the init container that downloads the histogramQuantile binary from GitHub into the ClickHouse user scripts volume, using the ClickHouse image. Set to false on a cluster without GitHub access and bring the binary with an entry in `clickhouse.extraInitContainers`.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # clickhouse.udf.command -- Command of the download init container; by default it fetches the histogramQuantile release for the node's OS and architecture.
    # @default -- "See values.yaml"
    # @section -- ClickHouse
    command:
      - sh
      - -c
      - |
        set -e
        version="v0.0.1"
        node_os=$(uname -s | tr '[:upper:]' '[:lower:]')
        node_arch=$(uname -m | sed s/aarch64/arm64/ | sed s/x86_64/amd64/)
        echo "Fetching histogram-binary for ${node_os}/${node_arch}"
        cd /tmp
        wget -O histogram-quantile.tar.gz "https://github.com/SigNoz/signoz/releases/download/histogram-quantile%2F${version}/histogram-quantile_${node_os}_${node_arch}.tar.gz"
        tar -xzf histogram-quantile.tar.gz
        chmod +x histogram-quantile
        mv histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
        echo "histogram-quantile installed successfully"
    # clickhouse.udf.env -- Environment of the download init container, Kubernetes EnvVar objects rendered as given, for example a proxy setting or a mirror credential from a Secret.
    # @default -- []
    # @section -- ClickHouse
    env: []
    # clickhouse.udf.envFrom -- envFrom of the download init container, Kubernetes EnvFromSource objects rendered as given.
    # @default -- []
    # @section -- ClickHouse
    envFrom: []
  # clickhouse.extraInitContainers -- Init containers added to the ClickHouse pod after the histogramQuantile download, Kubernetes Container objects rendered as given. The user scripts volume is `shared-binary-volume`, mounted at `/var/lib/clickhouse/user_scripts`.
  # @default -- []
  # @section -- ClickHouse
  extraInitContainers: []
  # -- Extra containers for ClickHouse pod
  # @section -- ClickHouse
  extraContainers: []

  ## Configure liveness and readiness probes.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  ##
  # clickhouse.startupProbe -- Startup probe of the ClickHouse container, a Kubernetes probe object (`httpGet`, `exec`, `tcpSocket` or `grpc`, with its timing fields), rendered as given. Set to `null` to render no probe. To use `exec`, `tcpSocket` or `grpc`, also set `httpGet: null`, because Helm merges a user's map over the default map and a probe may have only one handler.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  startupProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  # clickhouse.livenessProbe -- Liveness probe of the ClickHouse container, a Kubernetes probe object (`httpGet`, `exec`, `tcpSocket` or `grpc`, with its timing fields), rendered as given. Set to `null` to render no probe. To use `exec`, `tcpSocket` or `grpc`, also set `httpGet: null`, because Helm merges a user's map over the default map and a probe may have only one handler.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  livenessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 60
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 10
    successThreshold: 1
  # clickhouse.readinessProbe -- Readiness probe of the ClickHouse container, a Kubernetes probe object (`httpGet`, `exec`, `tcpSocket` or `grpc`, with its timing fields), rendered as given. Set to `null` to render no probe. To use `exec`, `tcpSocket` or `grpc`, also set `httpGet: null`, because Helm merges a user's map over the default map and a probe may have only one handler.
  # @default -- "See values.yaml"
  # @section -- ClickHouse
  readinessProbe:
    httpGet:
      port: http
      path: /ping
    initialDelaySeconds: 10
    periodSeconds: 3
    timeoutSeconds: 1
    failureThreshold: 3
    successThreshold: 1

  # clickhouse.resources -- Configure resource requests and limits. Update according to your use case.
  # Ref: http://kubernetes.io/docs/user-guide/compute-resources/
  # @section -- ClickHouse
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  #   limits:
  #     cpu: 2000m
  #     memory: 4Gi

  # clickhouse.podSecurityContext -- Pod security context of the ClickHouse pod, a Kubernetes PodSecurityContext object rendered as given. Set to `null` to render no pod security context; an empty map keeps the defaults, because Helm merges maps.
  # @section -- ClickHouse
  podSecurityContext:
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
  # clickhouse.containerSecurityContext -- Security context of the ClickHouse container, a Kubernetes SecurityContext object rendered as given; rendered only when set. ClickHouse runs under `allowPrivilegeEscalation: false`, `capabilities: {drop: [ALL]}`, `runAsNonRoot: true` and `seccompProfile: {type: RuntimeDefault}`.
  # @section -- ClickHouse
  # @default -- {}
  containerSecurityContext: {}
  # -- Clickhouse priority class name.
  # Rendered into the ClickHouse pod template as given; an empty value sets no priority class.
  # @section -- ClickHouse
  priorityClassName: ""
  # clickhouse.nodeSelector -- Node selector for assigning the ClickHouse pod.
  # @section -- ClickHouse
  # @default -- {}
  nodeSelector: {}
  # clickhouse.tolerations -- Toleration labels for ClickHouse pod assignment.
  # @section -- ClickHouse
  # @default -- []
  tolerations: []
  # clickhouse.affinity -- Affinity settings for the ClickHouse pod.
  # @section -- ClickHouse
  # @default -- {}
  affinity: {}
  # -- TopologySpreadConstraints describes how clickhouse pods ought to spread
  # @section -- ClickHouse
  topologySpreadConstraints: []

  # clickhouse.persistence -- ClickHouse persistence configuration.
  # @section -- ClickHouse
  persistence:
    # clickhouse.persistence.enabled -- Enable data persistence using a PVC for ClickHouse data.
    # @default -- true
    # @section -- ClickHouse
    enabled: true
    # clickhouse.persistence.existingClaim -- Use a manually managed Persistent Volume Claim. If defined, the PVC must be created manually.
    # @default -- ""
    # @section -- ClickHouse
    existingClaim: ""
    # clickhouse.persistence.storageClass -- Persistent Volume Storage Class. If "-", disables dynamic provisioning. If null, uses the default provisioner.
    # @default -- null
    # @section -- ClickHouse
    storageClass: null
    # clickhouse.persistence.accessModes -- Access Modes for the persistent volume.
    # @default -- ["ReadWriteOnce"]
    # @section -- ClickHouse
    accessModes:
      - ReadWriteOnce
    # clickhouse.persistence.size -- Persistent Volume size.
    # @default -- "20Gi"
    # @section -- ClickHouse
    size: 20Gi
  # clickhouse.extraVolumes -- Extra volumes for the ClickHouse pod, a list of Kubernetes Volume objects.
  # @section -- ClickHouse
  extraVolumes: []
  # clickhouse.extraVolumeMounts -- Extra volume mounts for the ClickHouse container, a list of Kubernetes VolumeMount objects.
  # @section -- ClickHouse
  extraVolumeMounts: []

# zookeeper -- Zookeeper default values.
# Ref: https://github.com/bitnami/charts/blob/main/bitnami/zookeeper/values.yaml
# @default -- "See values.yaml"
# @section -- ZooKeeper
zookeeper:
  #
  # Please DO NOT override this value.
  # This chart installs Zookeeper separately.
  # Only if you know what you are doing, proceed with overriding.
  #

  # zookeeper.enabled -- Install ZooKeeper. Defaults to the value of clickhouse.enabled; set it only to override that.
  # enabled: true

  # -- Zookeeper image
  # @section -- ZooKeeper
  image:
    # -- Zookeeper image registry to use.
    # @section -- ZooKeeper
    registry: *GLOBAL_IMAGE_REGISTRY
    # -- Zookeeper image repository to use.
    # @section -- ZooKeeper
    repository: signoz/zookeeper
    # -- Zookeeper image tag.
    # Note: SigNoz ClickHouse does not support all versions of Zookeeper.
    # Please override the default only if you know what you are doing.
    # @section -- ZooKeeper
    tag: 3.7.1

  # -- Name override for zookeeper app
  # @section -- ZooKeeper
  nameOverride: ""
  # -- Fullname override for zookeeper app
  # @section -- ZooKeeper
  fullnameOverride: ""

  # -- Whether to install zookeeper into a different namespace than the parent
  # @section -- ZooKeeper
  namespaceOverride: ""

  # -- Zookeeper pod(s) annotation.
  # @section -- ZooKeeper
  podAnnotations:
    signoz.io/scrape: "true"
    signoz.io/port: "9141"
    signoz.io/path: "/metrics"

  # -- Ongoing data directory cleanup configuration.
  # @section -- ZooKeeper
  autopurge:
    # -- The time interval (in hours) for which the purge task has to be triggered
    # @section -- ZooKeeper
    purgeInterval: 1

  # -- ZooKeeper Prometheus Exporter configuration.
  # @section -- ZooKeeper
  metrics:
    # -- Enable Prometheus to access ZooKeeper metrics endpoint.
    # @section -- ZooKeeper
    enabled: true

    service:
      enabled: true
      # -- ZooKeeper metrics service annotation
      # @section -- ZooKeeper
      annotations: {}
        # signoz.io/scrape: 'true'
        # signoz.io/port: '9141'
        # signoz.io/path: /metrics

  # -- Zookeeper log level.
  # @section -- ZooKeeper
  logLevel: INFO

  # -- Zookeeper liveness probe settings.
  # @section -- ZooKeeper
  livenessProbe:
    enabled: false
  # -- Zookeeper readiness probe settings.
  # @section -- ZooKeeper
  readinessProbe:
    enabled: false
  # -- Custom liveness probe for Zookeeper.
  # @section -- ZooKeeper
  customLivenessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep ruok']
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6
  # -- Custom readiness probe for Zookeeper.
  # @section -- ZooKeeper
  customReadinessProbe:
    exec:
      command: ['/bin/bash', '-c', 'curl -s -m 2 http://localhost:8080/commands/ruok | grep error | grep null']
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    successThreshold: 1
    failureThreshold: 6

  # -- Minimal SERVER_ID value, nodes increment their IDs respectively.
  # Servers increment their ID starting at this minimal value.
  # Eg. with `minServerId=10` and 3 replicas, server IDs will be 10,
  # 11, 12 for z-0, z-1 and z-2 respectively.
  # @section -- ZooKeeper
  minServerId: 1

  # -- Replica count for zookeeper
  # @section -- ZooKeeper
  replicaCount: 1

  # -- ZooKeeper Pod Disruption Budget
  # Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
  # @section -- ZooKeeper
  pdb:
    # -- Specifies whether a Pod Disruption Budget should be created
    # @section -- ZooKeeper
    create: false

  # -- Enable persistence using Persistent Volume Claims
  #
  # Ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
  # @section -- ZooKeeper
  persistence:
    # -- Enable ZooKeeper data persistence using PVC. If false, use emptyDir
    # @section -- ZooKeeper
    enabled: true

    # -- Name of an existing PVC to use (only when deploying a single replica)
    # @section -- ZooKeeper
    existingClaim: ""

    # -- PVC Storage Class for ZooKeeper data volume
    # If defined, storageClassName: <storageClass>
    # If set to "-", storageClassName: "", which disables dynamic provisioning
    # If undefined (the default) or set to null, no storageClassName spec is
    #   set, choosing the default provisioner.  (gp2 on AWS, standard on
    #   GKE, AWS & OpenStack)
    # @section -- ZooKeeper
    storageClass: null

    # -- PVC Access modes
    # @section -- ZooKeeper
    accessModes:
      - ReadWriteOnce

    # -- PVC Storage Request for ZooKeeper data volume
    # @section -- ZooKeeper
    size: 8Gi

    # -- Annotations for the PVC
    # @section -- ZooKeeper
    annotations: {}

  # -- Resources requests and limits for zookeeper
  # @section -- ZooKeeper
  resources:
    limits: {}
    requests:
      memory: 256Mi
      cpu: 100m
# The operator is installed from Altinity's clickhouse-operator chart (https://helm.altinity.com),
# pulled in as a chart dependency. All operator values live under this key, in Altinity's format.
# The former `clickhouse.clickhouseOperator` key is rejected at render time (see templates/validate.yaml).
# Full list: https://github.com/Altinity/clickhouse-operator/tree/release-0.27.4/deploy/helm
# `podAnnotations`: the SigNoz collectors discover scrape targets on `signoz.io/scrape`.
# `configs`: only what differs from Altinity's 0.27.4 defaults is set here (config.yaml: statefulSet.update.timeout 900;
# configd/usersd: SigNoz's changed or added files). Everything else is inherited from the subchart's values.
# altinity-clickhouse-operator -- Values for Altinity's clickhouse-operator chart, in its own format. The operator is installed only when ClickHouse is; set `altinity-clickhouse-operator.enabled` to override.
# @ignored
altinity-clickhouse-operator:
  # altinity-clickhouse-operator.enabled -- Install the Altinity clickhouse-operator. Defaults to the value of clickhouse.enabled; set it only to override that (external ClickHouse: leave unset).
  # enabled: true

  # -- Keeps the operator objects named `<release>-clickhouse-operator`, as before the
  # switch to Altinity's chart (Deployment, ServiceAccount, Secret, metrics Service).
  nameOverride: clickhouse-operator
  rbac:
    # -- Give the operator rights in its own namespace only (Role/RoleBinding), as this chart always did.
    namespaceScoped: true
  # -- Restores the component label the operator pod carried before the switch to Altinity's chart,
  # so metrics labels and selectors keyed on it keep working.
  podLabels:
    app.kubernetes.io/component: operator
  podAnnotations:
    signoz.io/port: '8888'
    signoz.io/scrape: 'true'
    # Altinity's default annotations, removed so the pod carries only the SigNoz scrape annotations.
    prometheus.io/port: null
    prometheus.io/scrape: null
    clickhouse-operator-metrics/port: null
    clickhouse-operator-metrics/scrape: null
  configs:
    files:
      # Only the keys that differ from Altinity's default are set here; the rest of config.yaml comes from the
      # subchart's values (Helm deep-merges them). On a subchart bump, diff `helm show values` of the old and new
      # versions and re-check these overrides.
      config.yaml:
        reconcile:
          statefulSet:
            update:
              # How many seconds to wait for created/updated StatefulSet to be 'Ready'.
              # SigNoz: 900, not Altinity's 300; large ClickHouse volumes need longer to come back.
              timeout: 900
    configdFiles:
      # level information + JSON formatting; Altinity's default is debug text.
      01-clickhouse-02-logger.xml: |
        <yandex>
            <logger>
                <!-- Possible levels: https://github.com/pocoproject/poco/blob/devel/Foundation/include/Poco/Logger.h#L105 -->
                <level>information</level>
                <formatting>
                  <type>json</type>
                </formatting>
                <log>/var/log/clickhouse-server/clickhouse-server.log</log>
                <errorlog>/var/log/clickhouse-server/clickhouse-server.err.log</errorlog>
                <size>1000M</size>
                <count>10</count>
                <!-- Default behavior is autodetection (log to console if not daemon mode and is tty) -->
                <console>1</console>
            </logger>
        </yandex>
      # Altinity's default also drops query_thread_log via remove="1"; SigNoz keeps that table, see 01-clickhouse-12-query_thread_log.xml.
      01-clickhouse-03-query_log.xml: |
        <yandex>
            <query_log replace="1">
                <database>system</database>
                <table>query_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_log>
        </yandex>
      # TTL 7 days; Altinity's default is 30.
      01-clickhouse-05-trace_log.xml: |-
        <yandex>
            <trace_log replace="1">
                <database>system</database>
                <table>trace_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </trace_log>
        </yandex>
      # Files 06-16 are SigNoz additions with no upstream counterpart.
      01-clickhouse-06-asynchronous_insert_log.xml: |
        <yandex>
            <asynchronous_insert_log replace="1">
                <database>system</database>
                <table>asynchronous_insert_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_insert_log>
        </yandex>
      01-clickhouse-07-asynchronous_metric_log.xml: |
        <yandex>
            <asynchronous_metric_log replace="1">
                <database>system</database>
                <table>asynchronous_metric_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </asynchronous_metric_log>
        </yandex>
      01-clickhouse-08-backup_log.xml: |
        <yandex>
            <backup_log replace="1">
                <database>system</database>
                <table>backup_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </backup_log>
        </yandex>
      01-clickhouse-09-blob_storage_log.xml: |
        <yandex>
            <blob_storage_log replace="1">
                <database>system</database>
                <table>blob_storage_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </blob_storage_log>
        </yandex>
      01-clickhouse-10-crash_log.xml: |
        <yandex>
            <crash_log replace="1">
                <database>system</database>
                <table>crash_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </crash_log>
        </yandex>
      01-clickhouse-11-metric_log.xml: |
        <yandex>
            <metric_log replace="1">
                <database>system</database>
                <table>metric_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </metric_log>
        </yandex>
      01-clickhouse-12-query_thread_log.xml: |
        <yandex>
            <query_thread_log replace="1">
                <database>system</database>
                <table>query_thread_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_thread_log>
        </yandex>
      01-clickhouse-13-query_views_log.xml: |
        <yandex>
            <query_views_log replace="1">
                <database>system</database>
                <table>query_views_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 15 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </query_views_log>
        </yandex>
      01-clickhouse-14-session_log.xml: |
        <yandex>
            <session_log replace="1">
                <database>system</database>
                <table>session_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </session_log>
        </yandex>
      01-clickhouse-15-zookeeper_log.xml: |
        <yandex>
            <zookeeper_log replace="1">
                <database>system</database>
                <table>zookeeper_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 30 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </zookeeper_log>
        </yandex>
      01-clickhouse-16-processors_profile_log.xml: |
        <yandex>
            <processors_profile_log replace="1">
                <database>system</database>
                <table>processors_profile_log</table>
                <engine>Engine = MergeTree PARTITION BY event_date ORDER BY event_time TTL event_date + interval 7 day</engine>
                <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            </processors_profile_log>
        </yandex>
    usersdFiles:
      # Kept because it differs from Altinity's default: Altinity's file additionally sets os_thread_priority 2,
      # do_not_merge_across_partitions_select_final 1, load_balancing nearest_hostname and prefer_localhost_replica 0,
      # which SigNoz deliberately does not adopt, so existing installs keep their current query behaviour
      # (routing, FINAL merges, thread priority).
      02-clickhouse-default-profile.xml: |
        <yandex>
          <profiles>
            <default>
              <log_queries>1</log_queries>
              <connect_timeout_with_failover_ms>1000</connect_timeout_with_failover_ms>
              <distributed_aggregation_memory_efficient>1</distributed_aggregation_memory_efficient>
              <parallel_view_processing>1</parallel_view_processing>
            </default>
          </profiles>
        </yandex>
      # SigNoz-only, no upstream counterpart.
      03-database-ordinary.xml: |
        <yandex>
            <profiles>
                <default>
                    <default_database_engine>Ordinary</default_database_engine>
                </default>
            </profiles>
        </yandex>
# externalClickhouse -- External ClickHouse configuration. Required when `clickhouse.enabled` is false.
# @section -- External ClickHouse
externalClickhouse:
  # externalClickhouse.host -- Host of the external ClickHouse cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- null
  # @section -- External ClickHouse
  host:
  # externalClickhouse.cluster -- Name of the external cluster to run DDL queries on.
  # Used only when `clickhouse.enabled` is false.
  # @default -- "cluster"
  # @section -- External ClickHouse
  cluster: cluster
  # externalClickhouse.database -- Database name for the external cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- "signoz_metrics"
  # @section -- External ClickHouse
  database: signoz_metrics
  # externalClickhouse.traceDatabase -- Database name for SigNoz Traces on the external cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- "signoz_traces"
  # @section -- External ClickHouse
  traceDatabase: signoz_traces
  # externalClickhouse.logDatabase -- Database name for SigNoz Logs on the external cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- "signoz_logs"
  # @section -- External ClickHouse
  logDatabase: signoz_logs
  # externalClickhouse.meterDatabase -- Database name for SigNoz Meter on the external cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- "signoz_meter"
  # @section -- External ClickHouse
  meterDatabase: signoz_meter
  # externalClickhouse.user -- Username to connect to the external cluster.
  # Used only when `clickhouse.enabled` is false.
  # @default -- ""
  # @section -- External ClickHouse
  user: ""
  # externalClickhouse.password -- Password for the external cluster. Ignored if `externalClickhouse.existingSecret` is set.
  # Used only when `clickhouse.enabled` is false.
  # @default -- ""
  # @section -- External ClickHouse
  password: ""
  # externalClickhouse.existingSecret -- Name of an existing Kubernetes secret containing the password.
  # Used only when `clickhouse.enabled` is false.
  # @default -- null
  # @section -- External ClickHouse
  existingSecret:
  # externalClickhouse.existingSecretPasswordKey -- Key in the existing secret that contains the password.
  # Used only when `clickhouse.enabled` is false.
  # @default -- null
  # @section -- External ClickHouse
  existingSecretPasswordKey:
  # externalClickhouse.secure -- Whether to use a TLS connection when connecting to ClickHouse.
  # Used only when `clickhouse.enabled` is false.
  # @default -- false
  # @section -- External ClickHouse
  secure: false
  # externalClickhouse.verify -- Whether to verify the TLS certificate on connection to ClickHouse.
  # Used only when `clickhouse.enabled` is false.
  # @default -- false
  # @section -- External ClickHouse
  verify: false
  # externalClickhouse.httpPort -- HTTP port of the external ClickHouse instance.
  # Used only when `clickhouse.enabled` is false.
  # @default -- 8123
  # @section -- External ClickHouse
  httpPort: 8123
  # externalClickhouse.tcpPort -- TCP port of the external ClickHouse instance.
  # Used only when `clickhouse.enabled` is false.
  # @default -- 9000
  # @section -- External ClickHouse
  tcpPort: 9000
# signoz -- Default values for SigNoz.
# @section -- SigNoz
# @default -- "Please checkout the default values in values.yml"
signoz:
  # signoz.name -- The name of the SigNoz component.
  # @default -- "signoz"
  # @section -- SigNoz
  name: "signoz"
  # signoz.replicaCount -- The number of pod replicas for SigNoz.
  # @default -- 1
  # @section -- SigNoz
  replicaCount: 1
  # signoz.image -- Image configuration for SigNoz.
  # @section -- SigNoz
  image:
    # signoz.image.registry - The container image registry.
    # @default -- "docker.io"
    # @section -- SigNoz
    registry: docker.io
    # signoz.image.repository - The container image repository.
    # @default -- "signoz/signoz"
    repository: signoz/signoz
    # signoz.image.tag - The container image tag.
    # @default -- "v0.110.1"
    tag: v0.151.0
    # signoz.image.pullPolicy - The image pull policy.
    # @default -- "IfNotPresent"
    pullPolicy: IfNotPresent
  # signoz.imagePullSecrets -- Image pull secrets for SigNoz.
  # This has higher precedence than the root level or global value.
  # @section -- SigNoz
  # @default -- []
  imagePullSecrets: []
  # signoz.serviceAccount -- Service Account configuration for SigNoz.
  # @section -- SigNoz
  serviceAccount:
    # signoz.serviceAccount.create - Specifies whether a service account should be created.
    # @default -- true
    create: true
    # signoz.serviceAccount.annotations - Annotations to add to the service account.
    # @default -- {}
    annotations: {}
    # signoz.serviceAccount.name - The name of the service account to use. If not set and `create` is true, a name is generated.
    # @default -- null
    name:
  # signoz.service -- Service configuration for SigNoz.
  # This allows you to configure how SigNoz is exposed within the Kubernetes cluster.
  # @section -- SigNoz Networking
  service:
    # signoz.service.annotations - Annotations for the SigNoz service object.
    # @default -- {}
    annotations: {}
    # signoz.service.labels - Labels for the SigNoz service object.
    # @default -- {}
    labels: {}
    # signoz.service.type - The service type (`ClusterIP`, `NodePort`, `LoadBalancer`).
    # @default -- "ClusterIP"
    type: ClusterIP
    # signoz.service.port - The external HTTP port for SigNoz.
    # @default -- 8080
    port: 8080
    # signoz.service.internalPort - The internal gRPC port for SigNoz.
    # @default -- 8085
    internalPort: 8085
    # signoz.service.opampPort - The internal OpAMP port for SigNoz.
    # @default -- 4320
    opampPort: 4320
    # signoz.service.nodePort - Manually specify the nodePort for HTTP when `service.type` is `NodePort`.
    # @default -- null
    nodePort: null
    # signoz.service.internalNodePort - Manually specify the nodePort for the internal port when `service.type` is `NodePort`.
    # @default -- null
    internalNodePort: null
    # signoz.service.opampInternalNodePort - Manually specify the nodePort for OpAMP when `service.type` is `NodePort`.
    # @default -- null
    opampInternalNodePort: null
  # signoz.annotations -- Annotations for the SigNoz pod.
  # @section -- SigNoz
  # @default -- null
  annotations:
  # signoz.additionalArgs -- Additional command-line arguments for SigNoz.
  # @section -- SigNoz
  # @default -- []
  additionalArgs: []
  # Environment variables for the SigNoz.
  # You can specify variables in two ways:
  # 1. Flexible structure for advanced configurations (recommended):
  #    Example:
  #      env:
  #        MY_KEY:
  #          value: my-value  # Direct value
  #        SECRET_KEY:
  #          valueFrom:       # Reference from a Secret or ConfigMap
  #            secretKeyRef:
  #              name: my-secret
  #              key: my-key
  # 2. Simple key-value pairs (backward-compatible):
  #    Example:
  #      env:
  #        MY_KEY: my-value

  # signoz.env -- Environment variables for SigNoz.
  # Refer to the official documentation for a complete list: https://github.com/SigNoz/signoz/blob/main/conf/example.yaml
  # Note on Variable Naming: Environment variables are derived from the YAML configuration.
  # For example, a key `provider` under the `telemetry_store` section becomes
  # `signoz_telemetrystore_provider`.
  # @section -- SigNoz
  env:
    signoz_telemetrystore_provider: clickhouse
    # ClickHouse URL is set and applied internally. Don't override unless you know what you are doing.
    # signoz_telemetrystore_clickhouse_dsn: tcp://clickhouse_operator:clickhouse_operator_password@my-release-clickhouse:9000/signoz_traces

    # Enable SMTP for user invitations. For more details see: https://signoz.io/docs/manage/administrator-guide/configuration/smtp-email-invitations/
    signoz_emailing_enabled: false
    # To enable/disable the active query tracker.
    signoz_prometheus_active__query__tracker_enabled: false
    # signoz alertemanager configuration
    # For more details see: https://signoz.io/docs/manage/administrator-guide/configuration/alertmanager/
    signoz_alertmanager_provider: signoz
    # The URL under which Alertmanager is externally reachable, Used for generating relative and absolute links back to Alertmanager itself.
    signoz_alertmanager_signoz_external__url: http://localhost:8080
  # signoz.podSecurityContext -- Pod-level security context.
  # @section -- SigNoz
  # @default -- {}
  podSecurityContext: {}
  # fsGroup: 2000

  # signoz.podAnnotations -- Annotations for the SigNoz pod.
  # @section -- SigNoz
  # @default -- {}
  podAnnotations: {}
  # signoz.securityContext -- Container-level security context.
  # @section -- SigNoz
  # @default -- {}
  securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

  # signoz.additionalVolumeMounts -- Additional volume mounts for the SigNoz container.
  # @section -- SigNoz
  # @default -- []
  additionalVolumeMounts: []
  # signoz.additionalVolumes -- Additional volumes for the SigNoz pod.
  # @section -- SigNoz
  # @default -- []
  additionalVolumes: []
  # signoz.livenessProbe -- Liveness probe configuration.
  # @section -- SigNoz
  # @default -- "Please checkout the default values in values.yml"
  livenessProbe:
    enabled: true
    port: http
    path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # signoz.readinessProbe -- Readiness probe configuration.
  # @section -- SigNoz
  # @default -- "Please checkout the default values in values.yml"
  readinessProbe:
    enabled: true
    port: http
    path: /api/v1/health?live=1
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # signoz.customLivenessProbe -- Custom liveness probe to override the default.
  # @section -- SigNoz
  # @default -- {}
  customLivenessProbe: {}
  # signoz.customReadinessProbe -- Custom readiness probe to override the default.
  # @section -- SigNoz
  # @default -- {}
  customReadinessProbe: {}
  # signoz.ingress -- (object) Ingress configuration for SigNoz.
  # @section -- SigNoz Networking
  ingress:
    # signoz.ingress.enabled - Enable ingress controller resource.
    # @default -- false
    enabled: false
    # signoz.ingress.className - Ingress class name.
    # @default -- ""
    className: ""
    # signoz.ingress.annotations - Annotations for the ingress resource.
    # @default -- {}
    annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # signoz.ingress.hosts - Hostname and path configurations for the ingress.
    # @section -- SigNoz Networking
    hosts:
      - host: signoz.domain.com
        paths:
          - path: /
            pathType: ImplementationSpecific
            port: 8080
    # signoz.ingress.tls - TLS configuration for the ingress.
    # @default -- []
    # @section -- SigNoz Networking
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - signoz.domain.com
  # signoz.resources -- Resource requests and limits.
  # Ref: http://kubernetes.io/docs/user-guide/compute-resources/
  # @section -- SigNoz
  # @default -- '{ requests: { cpu: "100m", memory: "100Mi" } }'
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  #   limits:
  #     cpu: 750m
  #     memory: 1000Mi

  # signoz.priorityClassName -- Priority class for the SigNoz pods.
  # @section -- SigNoz
  # @default -- ""
  priorityClassName: ""
  # signoz.nodeSelector -- Node selector for pod assignment.
  # @section -- SigNoz
  # @default -- {}
  nodeSelector: {}
  # signoz.tolerations -- Tolerations for pod assignment.
  # @section -- SigNoz
  # @default -- []
  tolerations: []
  # signoz.affinity -- Affinity settings for pod assignment.
  # @section -- SigNoz
  # @default -- {}
  affinity: {}
  # signoz.topologySpreadConstraints -- Topology spread constraints for pod distribution.
  # @section -- SigNoz
  # @default -- []
  topologySpreadConstraints: []
  # signoz.persistence -- Persistence configuration for the internal SQLite database.
  # @section -- SigNoz
  persistence:
    # signoz.persistence.enabled - Enable data persistence using a PVC.
    # @default -- true
    enabled: true
    # signoz.persistence.existingClaim - Use a manually managed PVC.
    # @default -- ""
    existingClaim: ""
    # signoz.persistence.storageClass - The storage class for the PVC. If "-", disables dynamic provisioning.
    # @default -- null
    storageClass: null
    # signoz.persistence.accessModes - Access modes for the persistent volume.
    # @default -- ["ReadWriteOnce"]
    accessModes:
      - ReadWriteOnce
    # signoz.persistence.size - The size of the persistent volume.
    # @default -- "1Gi"
    size: 1Gi
