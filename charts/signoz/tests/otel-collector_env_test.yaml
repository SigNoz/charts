# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: otel-collector_env_test.yaml
templates:
  - templates/otel-collector/deployment.yaml
  - templates/otel-collector/configmap.yaml
release:
  name: signoz
  namespace: signoz
tests:
  - it: should give the collector the bundled ClickHouse's connection and database variables
    template: templates/otel-collector/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: signoz-clickhouse
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_DATABASE
            value: signoz_metrics
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_TRACE_DATABASE
            value: signoz_traces
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_LOG_DATABASE
            value: signoz_logs
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_METER_DATABASE
            value: signoz_meter
  - it: should give the collector an external ClickHouse's connection and database variables
    template: templates/otel-collector/deployment.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.database: my_metrics
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_DATABASE
            value: my_metrics
  - it: should connect the check init container to the bundled ClickHouse, with the connection variables before the migrator's own
    template: templates/otel-collector/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value:
            - name: CLICKHOUSE_HOST
              value: signoz-clickhouse
            - name: CLICKHOUSE_PORT
              value: "9000"
            - name: CLICKHOUSE_CLUSTER
              value: cluster
            - name: CLICKHOUSE_USER
              value: admin
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signoz-clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: CLICKHOUSE_VERIFY
              value: "false"
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
              value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
              value: $(CLICKHOUSE_CLUSTER)
            - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
              value: 10m
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
              value: "true"
  - it: should connect the check init container to an external ClickHouse without TLS
    template: templates/otel-collector/deployment.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse.example.com
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
  - it: should connect the check init container over TLS with externalClickhouse.secure and externalClickhouse.verify
    template: templates/otel-collector/deployment.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.secure: true
      externalClickhouse.verify: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true
  - it: should connect the check init container over TLS without certificate verification with externalClickhouse.verify false
    template: templates/otel-collector/deployment.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.secure: true
      externalClickhouse.verify: false
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true&skip_verify=true
