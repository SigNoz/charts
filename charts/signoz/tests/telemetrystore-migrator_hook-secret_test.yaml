# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: telemetrystore-migrator_hook-secret_test.yaml
templates:
  - templates/telemetrystore-migrator/secret.yaml
  - templates/telemetrystore-migrator/job.yaml
release:
  name: signoz
  namespace: platform
tests:
  - it: renders the hook Secret with clickhouse.password on upgrade
    release:
      upgrade: true
    template: templates/telemetrystore-migrator/secret.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: signoz-telemetrystore-migrator-credentials
      - equal:
          path: metadata.namespace
          value: platform
      - equal:
          path: metadata.annotations
          value:
            helm.sh/hook: pre-upgrade
            helm.sh/hook-weight: "-10"
            helm.sh/hook-delete-policy: before-hook-creation
      - equal:
          path: stringData.password
          value: 27ff0399-0d3a-4bd8-919d-17c2181e6fb9
  - it: renders the hook Secret with externalClickhouse.password when ClickHouse is external
    release:
      upgrade: true
    template: templates/telemetrystore-migrator/secret.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
      externalClickhouse.cluster: cluster
      externalClickhouse.password: x
    asserts:
      - equal:
          path: stringData.password
          value: x
  - it: reads the hook Secret in every migrator container on upgrade
    release:
      upgrade: true
    template: templates/telemetrystore-migrator/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: &hookPassword
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-telemetrystore-migrator-credentials
                key: password
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: *hookPassword
      - contains:
          path: spec.template.spec.initContainers[2].env
          content: *hookPassword
      - contains:
          path: spec.template.spec.containers[0].env
          content: *hookPassword
  - it: renders no hook Secret on install
    template: templates/telemetrystore-migrator/secret.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no hook Secret when telemetryStoreMigrator.enabled is false
    release:
      upgrade: true
    template: templates/telemetrystore-migrator/secret.yaml
    set:
      telemetryStoreMigrator.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: renders no hook Secret and reads the chart's Secret when upgradeHelmHooks is false
    release:
      upgrade: true
    set:
      telemetryStoreMigrator.upgradeHelmHooks: false
    asserts:
      - template: templates/telemetrystore-migrator/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
  - it: renders no hook Secret and reads clickhouse.existingSecret when it is set
    release:
      upgrade: true
    set:
      clickhouse.existingSecret: my-ch
    asserts:
      - template: templates/telemetrystore-migrator/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-ch
                key: password
