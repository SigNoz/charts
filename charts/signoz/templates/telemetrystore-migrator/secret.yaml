{{- /* Helm creates pre-upgrade hooks before release resources, so the hook Job cannot read the release's Secret on the first upgrade. hook-succeeded would delete this Secret before the Job runs, and Helm does not delete hook resources on uninstall. */}}
{{- if include "telemetryStoreMigrator.createHookSecret" . }}
{{- $password := .Values.externalClickhouse.password }}
{{- if .Values.clickhouse.enabled }}
{{- $password = .Values.clickhouse.password }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telemetryStoreMigrator.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "telemetryStoreMigrator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
