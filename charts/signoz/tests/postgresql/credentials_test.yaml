# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql/credentials
templates:
  - templates/postgresql/secret.yaml
  - templates/postgresql/statefulset.yaml
set:
  postgresql.enabled: true
tests:
  - it: stores auth.password in Secret <fullname>-auth under the key password
    set:
      postgresql.auth.password: pg-s3cret
      postgresql.auth.existingSecret: ""
    asserts:
      - template: templates/postgresql/secret.yaml
        isKind:
          of: Secret
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-postgresql-auth
      - template: templates/postgresql/secret.yaml
        equal:
          path: stringData.password
          value: pg-s3cret

  - it: creates no Secret when auth.existingSecret names one
    set:
      postgresql.auth.password: pg-s3cret
      postgresql.auth.existingSecret: my-pg-secret
    asserts:
      - template: templates/postgresql/secret.yaml
        hasDocuments:
          count: 0

  - it: starts Postgres with the password from Secret <fullname>-auth under the key password
    set:
      postgresql.auth.password: pg-s3cret
      postgresql.auth.existingSecret: ""
    asserts:
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-postgresql-auth
      - template: templates/postgresql/secret.yaml
        equal:
          path: stringData.password
          value: pg-s3cret
      - template: templates/postgresql/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "postgres")].env
          content:
            name: POSTGRES_PASSWORD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-postgresql-auth, key: password}}
