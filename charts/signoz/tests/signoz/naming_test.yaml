# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/naming
templates:
  - templates/signoz/statefulset.yaml
  - templates/signoz/service.yaml
  - templates/signoz/serviceaccount.yaml
  - templates/signoz/ingress.yaml
  - templates/otel-collector/configmap.yaml
tests:
  - it: names the StatefulSet and its Service <release>-signoz
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz

  - it: names the StatefulSet and its Service after the release alone when the release name contains signoz
    release:
      name: my-signoz-prod
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: my-signoz-prod
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: my-signoz-prod

  - it: names the StatefulSet, its Service and its ServiceAccount fullnameOverride
    set:
      fullnameOverride: foo
      signoz.serviceAccount.create: true
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: foo
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: foo
      - template: templates/signoz/serviceaccount.yaml
        equal:
          path: metadata.name
          value: foo

  - it: points the Ingress and the collector's OpAMP client at the SigNoz Service by its fullnameOverride name
    capabilities:
      majorVersion: "1"
      minorVersion: "30"
      apiVersions:
        - networking.k8s.io/v1
    set:
      fullnameOverride: foo
      signoz.service.opampPort: 4320
      signoz.ingress.enabled: true
      signoz.ingress.hosts:
        - host: signoz.example.com
          paths:
            - path: /
              pathType: Prefix
              port: 8080
    asserts:
      - template: templates/signoz/ingress.yaml
        equal:
          path: spec.rules[?(@.host == "signoz.example.com")].http.paths[?(@.path == "/")].backend.service.name
          value: foo
      - template: templates/otel-collector/configmap.yaml
        matchRegex:
          path: data["otel-collector-opamp-config.yaml"]
          pattern: ws://foo:4320/v1/opamp
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: foo

  - it: names the StatefulSet and its Service <release>-<nameOverride>
    set:
      nameOverride: x
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-x
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-x

  - it: keeps a 53-character release name whole in <release>-signoz
    release:
      name: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghi
    set:
      clickhouse.fullnameOverride: ch
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghi-signoz
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghi-signoz

  - it: cuts a fullnameOverride longer than 63 characters to its first 63
    set:
      fullnameOverride: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghijk
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefgh
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefghij-abcdefgh

  - it: selects the SigNoz pods by the chart name, the release and signoz.name, the same on the StatefulSet, its pods and the Service
    set:
      signoz.name: srv
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: signoz
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: srv
      - template: templates/signoz/statefulset.yaml
        isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/name: signoz
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: srv
      - template: templates/signoz/service.yaml
        equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: signoz
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: srv

  - it: puts nameOverride in the app.kubernetes.io/name selector label of the StatefulSet, its pods and the Service
    set:
      nameOverride: x
      signoz.name: srv
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/name"]
          value: x
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: x
      - template: templates/signoz/service.yaml
        equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: x

  - it: keeps the StatefulSet and Service names when signoz.name changes the component label
    set:
      signoz.name: srv
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz

  - it: labels the component signoz in the selector when signoz.name is empty
    set:
      signoz.name: ""
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: signoz
      - template: templates/signoz/service.yaml
        equal:
          path: spec.selector["app.kubernetes.io/component"]
          value: signoz

  - it: governs the StatefulSet's pods through the SigNoz Service
    set:
      fullnameOverride: foo
    asserts:
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.serviceName
          value: foo
      - template: templates/signoz/service.yaml
        equal:
          path: metadata.name
          value: foo
