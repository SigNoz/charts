# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse/naming
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
  - templates/clickhouse/configmap-functions.yaml
  - templates/clickhouse/secret.yaml
tests:
  - it: names the installation <release>-clickhouse
    template: templates/clickhouse/clickhouseinstallation.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse
  - it: names the installation after the release alone when the release name contains clickhouse
    template: templates/clickhouse/clickhouseinstallation.yaml
    release:
      name: clickhouse
    asserts:
      - equal:
          path: metadata.name
          value: clickhouse
  - it: names the installation, its Service, Secret and ConfigMap after clickhouse.fullnameOverride
    set:
      clickhouse.fullnameOverride: ch
    asserts:
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: metadata.name
          value: ch
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.templates.serviceTemplates[?(@.name == $.spec.defaults.templates.serviceTemplate)].generateName
          value: ch
      - template: templates/clickhouse/secret.yaml
        equal:
          path: metadata.name
          value: ch-credentials
      - template: templates/clickhouse/configmap-functions.yaml
        equal:
          path: metadata.name
          value: ch-custom-functions
  - it: replaces clickhouse in the name and the name label with clickhouse.nameOverride
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      clickhouse.nameOverride: chdb
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-chdb
      - equal:
          path: spec.templates.podTemplates[0].metadata.labels["app.kubernetes.io/name"]
          value: chdb
  - it: renders a 34-character name
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      clickhouse.fullnameOverride: abcdefghij-abcdefghij-abcdefghij-a
    asserts:
      - equal:
          path: metadata.name
          value: abcdefghij-abcdefghij-abcdefghij-a
  - it: gives the download container a name Kubernetes accepts, also at the 34-character limit
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      clickhouse.fullnameOverride: abcdefghij-abcdefghij-abcdefghij-a
    asserts:
      - matchRegex:
          path: spec.templates.podTemplates[0].spec.initContainers[0].name
          pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$
  - it: labels the ClickHouse pods with the selector labels and clickhouse.podLabels only
    template: templates/clickhouse/clickhouseinstallation.yaml
    set:
      clickhouse.podLabels:
        team: db
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].metadata.labels
          value:
            app.kubernetes.io/name: clickhouse
            app.kubernetes.io/instance: RELEASE-NAME
            app.kubernetes.io/component: clickhouse
            team: db
  - it: labels the installation, its Secret and its ConfigMap with the release instance label the upgrade guide selects them by
    asserts:
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - template: templates/clickhouse/secret.yaml
        equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
      - template: templates/clickhouse/configmap-functions.yaml
        equal:
          path: metadata.labels["app.kubernetes.io/instance"]
          value: RELEASE-NAME
