{{- if .Values.otelCollector.ingress.enabled }}
{{- $ingress := .Values.otelCollector.ingress }}
{{- $fullName := include "otelCollector.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "otelCollector.labels" . | fromYaml) $ingress.labels)) | nindent 4 }}
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- range . }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      {{- with .secretName }}
      secretName: {{ . }}
      {{- end }}
    {{- end }}
  {{- end }}
  rules:
    {{- range $ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          {{- $port := .port }}
          {{- if not $port }}
          {{- $port = index $.Values.otelCollector.ports "otlp-http" "servicePort" }}
          {{- end }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "ImplementationSpecific" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $port }}
          {{- end }}
    {{- end }}
{{- end }}
