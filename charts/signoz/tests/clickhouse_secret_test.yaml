# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse_secret_test.yaml
templates:
  - templates/clickhouse/secret.yaml
release:
  name: signoz
  namespace: platform
tests:
  - it: renders the Secret with clickhouse.password in the release namespace by default
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: signoz-clickhouse-credentials
      - equal:
          path: metadata.namespace
          value: platform
      - equal:
          path: stringData.password
          value: 27ff0399-0d3a-4bd8-919d-17c2181e6fb9
  - it: renders nothing when clickhouse.existingSecret is set
    set:
      clickhouse.existingSecret: my-ch
    asserts:
      - hasDocuments:
          count: 0
  - it: renders a second Secret in clickhouse.namespace when it differs from the release namespace
    set:
      clickhouse.namespace: other
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: platform
      - documentIndex: 1
        equal:
          path: metadata.namespace
          value: other
      - documentIndex: 1
        equal:
          path: metadata.name
          value: signoz-clickhouse-credentials
  - it: renders the Secret with externalClickhouse.password when ClickHouse is external
    set:
      clickhouse.enabled: false
      externalClickhouse.password: x
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: signoz-clickhouse-credentials
      - equal:
          path: stringData.password
          value: x
  - it: renders nothing when ClickHouse is external and externalClickhouse.existingSecret is set
    set:
      clickhouse.enabled: false
      externalClickhouse.password: x
      externalClickhouse.existingSecret: my-ch
    asserts:
      - hasDocuments:
          count: 0
