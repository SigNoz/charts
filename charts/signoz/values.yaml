    cluster:
      auto_create_topics_enabled: true
      default_topic_partitions: 3
      delete_retention_ms: 21600000
    tunable:
      kafka_batch_max_bytes: 209715200
      kafka_request_max_bytes: 209715200
  # @ignored
  rbac:
    enabled: false
  # @ignored
  resources:
    cpu:
      cores: 7
    memory:
      container:
        max: 28Gi
  # @ignored
  serviceAccount:
    create: false
  # @ignored
  statefulset:
    podTemplate:
      annotations:
        signoz.io/path: /public_metrics
        signoz.io/port: "9644"
        signoz.io/scrape: "true"
    replicas: 3
    terminationGracePeriodSeconds: 180
  # @ignored
  storage:
    persistentVolume:
      size: 100Gi
      storageClass: null
  # @ignored
  tls:
    certs:
      external:
        caEnabled: false
    enabled: false
