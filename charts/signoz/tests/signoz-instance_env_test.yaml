suite: Test SigNoz Environment Variables

# We are testing the output of the StatefulSet template,
# where the environment variables are defined.
templates:
  - templates/signoz/statefulset.yaml

tests:
  # --- Test Case 1: SMTP is explicitly disabled ---
  - it: should not render SMTP-specific variables when emailing is disabled
    set:
      # Set values to disable the SMTP feature
      signoz:
        env:
          signoz_emailing_enabled: false
    asserts:
      # Assert that SMTP host variable is not present in the environment list.
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_EMAILING_SMTP_HOST

  # --- Test Case 2: SMTP enabled with the new 'env' convention ---
  - it: should render SMTP variables correctly using the new 'env' convention
    set:
      signoz:
        env:
          signoz_emailing_enabled: true
          signoz_emailing_smtp_address:
            valueFrom:
              secretKeyRef:
                name: my-smtp-secret
                key: smtp-address
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_EMAILING_ENABLED
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_EMAILING_SMTP_ADDRESS
            valueFrom:
              secretKeyRef:
                key: smtp-address
                name: my-smtp-secret


# --- Test Case 6: ClickHouse environment variables ---
  - it: should set the clickhouse creds first and the dsn and cluster from them
    set:
      clickhouse:
        enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0]
          value:
            name: CLICKHOUSE_HOST
            value: RELEASE-NAME-clickhouse
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
            value: $(CLICKHOUSE_CLUSTER)
      - exists:
          path: spec.template.spec.containers[0].env[?(@.name == 'CLICKHOUSE_USER')]
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-clickhouse-credentials
                key: password

# --- Test Case 7: External ClickHouse environment variables ---
  - it: should set external clickhouse creds and dsn environment variable
    set:
      clickhouse:
        enabled: false
      externalClickhouse:
        host: "sample.clickhouse.com"
        cluster: "cluster"
        user: "user"
        password: "password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: "sample.clickhouse.com"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_CLUSTER
            value: "cluster"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: "user"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: RELEASE-NAME-clickhouse-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)

# --- Test Case 8: External ClickHouse creds with secret and dsn environment variable ---
  - it: should set external clickhouse creds with secret and dsn environment variable
    set:
      clickhouse:
        enabled: false
      externalClickhouse:
        host: "sample.clickhouse.com"
        cluster: "cluster"
        user: "user"
        password: 
        existingSecret: "test-clickhouse-secret"
        existingSecretPasswordKey: "password"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_USER
            value: "user"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: test-clickhouse-secret
                key: password
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)

# --- Test Case 9: External ClickHouse over TLS ---
  - it: should connect to external clickhouse over TLS with externalClickhouse.secure and externalClickhouse.verify
    set:
      clickhouse:
        enabled: false
      externalClickhouse:
        host: "sample.clickhouse.com"
        secure: true
        verify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true

# --- Test Case 10: External ClickHouse over TLS without certificate verification ---
  - it: should connect to external clickhouse over TLS without certificate verification with externalClickhouse.verify false
    set:
      clickhouse:
        enabled: false
      externalClickhouse:
        host: "sample.clickhouse.com"
        secure: true
        verify: false
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true&skip_verify=true

# --- Test Case 11: ClickHouse DSN overridden in upper case ---
  - it: should replace the chart's clickhouse dsn with SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN set in signoz.env
    set:
      signoz:
        env:
          SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@clickhouse.example.com:9440?secure=true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@clickhouse.example.com:9440?secure=true
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)

# --- Test Case 12: Bundled ClickHouse with clickhouse.secure ---
  - it: should pass clickhouse.secure as CLICKHOUSE_SECURE and keep the bundled clickhouse dsn without parameters
    set:
      clickhouse:
        enabled: true
        secure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_SECURE
            value: "true"
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
