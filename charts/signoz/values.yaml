  # @ignored
  fullnameOverride: opentelemetry-gateway
  # @ignored
  ingress: []
  # @ignored
  service:
    annotations: {}
    ports:
      otlp:
        containerPort: 4317
        enabled: true
        protocol: TCP
        servicePort: 4317
      otlp-grpc:
        enabled: false
      aws-cwmetrics:
        enabled: true
        containerPort: 8084
        servicePort: 8084
        protocol: TCP
      aws-cwlogs:
        enabled: true
        containerPort: 8085
        servicePort: 8085
        protocol: TCP
      aws-otlp:
        enabled: true
        containerPort: 8086
        servicePort: 8086
        protocol: TCP
    type: NodePort
# -- This component is configurable with licensed version of SigNoz.
# @section -- Redpanda Settings
redpanda:
  enabled: false
  # @ignored
  fullnameOverride: redpanda
  # @ignored
  config:
    cluster:
      auto_create_topics_enabled: true
      default_topic_partitions: 3
      delete_retention_ms: 21600000
    tunable:
      kafka_batch_max_bytes: 209715200
      kafka_request_max_bytes: 209715200
  # @ignored
  rbac:
    enabled: false
  # @ignored
  resources:
    cpu:
      cores: 7
    memory:
      container:
        max: 28Gi
  # @ignored
  serviceAccount:
    create: false
  # @ignored
  statefulset:
    podTemplate:
      annotations:
        signoz.io/path: /public_metrics
        signoz.io/port: "9644"
        signoz.io/scrape: "true"
    replicas: 3
    terminationGracePeriodSeconds: 180
  # @ignored
  storage:
    persistentVolume:
      size: 100Gi
      storageClass: null
  # @ignored
  tls:
    certs:
      external:
        caEnabled: false
    enabled: false
