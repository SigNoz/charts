{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- include "signoz-operator.crdAnnotations" . | nindent 4 }}
  name: authdomains.resources.signoz.io
  labels:
    {{- include "signoz-operator.crdLabels" . | nindent 4 }}
spec:
  group: resources.signoz.io
  names:
    kind: AuthDomain
    listKind: AuthDomainList
    plural: authdomains
    singular: authdomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.signozResource.id
      name: ID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              interval:
                description: |-
                  Interval is the steady-state cadence at which the resource is re-checked
                  against SigNoz. Omitted, it falls back to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              objectTemplate:
                maxProperties: 1
                minProperties: 1
                properties:
                  jsonSpec:
                    minLength: 1
                    type: string
                  spec:
                    properties:
                      config:
                        properties:
                          kind:
                            enum:
                            - saml
                            - google
                            - oidc
                            type: string
                          spec:
                            properties:
                              allowedGroups:
                                items:
                                  type: string
                                type: array
                              attributeMapping:
                                properties:
                                  email:
                                    type: string
                                  groups:
                                    type: string
                                  name:
                                    type: string
                                  role:
                                    type: string
                                type: object
                              certificate:
                                type: string
                              claimMapping:
                                properties:
                                  email:
                                    type: string
                                  groups:
                                    type: string
                                  name:
                                    type: string
                                  role:
                                    type: string
                                type: object
                              clientId:
                                type: string
                              clientSecret:
                                type: string
                              domainToAdminEmail:
                                additionalProperties:
                                  type: string
                                type: object
                              entityId:
                                type: string
                              fetchGroups:
                                type: boolean
                              fetchTransitiveGroupMembership:
                                type: boolean
                              getUserInfo:
                                type: boolean
                              insecureSkipAuthNRequestsSigned:
                                type: boolean
                              insecureSkipEmailVerified:
                                type: boolean
                              issuer:
                                type: string
                              issuerAlias:
                                type: string
                              location:
                                type: string
                              serviceAccountJson:
                                type: string
                            type: object
                        required:
                        - kind
                        - spec
                        type: object
                        x-kubernetes-validations:
                        - message: kind saml requires spec.entityId, spec.location,
                            spec.certificate
                          rule: self.kind != 'saml' || (has(self.spec.entityId) &&
                            has(self.spec.location) && has(self.spec.certificate))
                        - message: kind google requires spec.clientId, spec.clientSecret
                          rule: self.kind != 'google' || (has(self.spec.clientId)
                            && has(self.spec.clientSecret))
                        - message: kind oidc requires spec.issuer, spec.clientId,
                            spec.clientSecret
                          rule: self.kind != 'oidc' || (has(self.spec.issuer) && has(self.spec.clientId)
                            && has(self.spec.clientSecret))
                      enabled:
                        type: boolean
                      name:
                        minLength: 1
                        type: string
                      roleMapping:
                        properties:
                          defaultRole:
                            type: string
                          groupMappings:
                            additionalProperties:
                              type: string
                            type: object
                          useRoleAttribute:
                            type: boolean
                        type: object
                    required:
                    - config
                    - name
                    type: object
                type: object
              providerConfigRef:
                description: |-
                  ProviderConfigRef names the SigNoz backend to write through, resolved in
                  the resource's own namespace unless its kind is ClusterProviderConfig.
                properties:
                  kind:
                    default: ProviderConfig
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy controls what happens in SigNoz when this custom resource is
                  deleted. Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              retryInterval:
                description: |-
                  RetryInterval is the cadence at which a Recoverable failure is retried.
                  Omitted, it falls back to Interval, then to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              suspend:
                description: |-
                  Suspend stops reconciling this resource without changing or deleting
                  anything in SigNoz.
                type: boolean
              timeout:
                description: |-
                  Timeout bounds a single reconciliation attempt, including the HTTP calls
                  to SigNoz. Omitted, it falls back to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
            required:
            - objectTemplate
            - providerConfigRef
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions report the reconcile outcome. The type vocabulary is fixed and
                  shared across kinds; per-kind detail lives in reason and message.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the operator
                  last reconciled.
                format: int64
                type: integer
              observedHash:
                description: |-
                  ObservedHash is a hash of the last body the operator sent to SigNoz. It is
                  an optimisation that lets a reconcile skip the remote fetch when desired
                  state is unchanged, never the drift mechanism.
                type: string
              reconciledAt:
                description: |-
                  ReconciledAt is when the operator last reconciled the resource against
                  SigNoz.
                format: date-time
                type: string
              signozResource:
                description: |-
                  SigNozResource records the object's identity in SigNoz. Its ID is
                  empty until a create or lookup confirms it. It is a cache, not the source
                  of truth for identity: if lost, the next reconcile re-discovers it.
                properties:
                  id:
                    description: |-
                      ID is the identifier SigNoz assigned, set once the operator has created or
                      adopted the remote object.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
