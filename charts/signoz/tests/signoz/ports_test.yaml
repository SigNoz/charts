# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/ports
templates:
  - templates/signoz/statefulset.yaml
  - templates/signoz/service.yaml
tests:
  - it: keeps the SigNoz container on 8080, 8085 and 4320 while signoz.service.port, internalPort and opampPort move only the Service
    set:
      signoz.service.port: 9090
      signoz.service.internalPort: 9095
      signoz.service.opampPort: 4321
    asserts:
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].ports
          content: {name: http, containerPort: 8080}
          any: true
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].ports
          content: {name: http-internal, containerPort: 8085}
          any: true
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].ports
          content: {name: opamp-internal, containerPort: 4320}
          any: true
      - template: templates/signoz/service.yaml
        contains:
          path: spec.ports
          content: {name: http, port: 9090, targetPort: http}
          any: true
      - template: templates/signoz/service.yaml
        contains:
          path: spec.ports
          content: {name: http-internal, port: 9095, targetPort: http-internal}
          any: true
      - template: templates/signoz/service.yaml
        contains:
          path: spec.ports
          content: {name: opamp-internal, port: 4321, targetPort: opamp-internal}
          any: true
