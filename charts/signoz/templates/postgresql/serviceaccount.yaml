{{- if .Values.postgresql.enabled }}
{{- if .Values.postgresql.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "postgresql.serviceAccountName" . }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  {{- with .Values.postgresql.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- include "postgresql.imagePullSecrets" . }}
{{- end -}}
{{- end }}
