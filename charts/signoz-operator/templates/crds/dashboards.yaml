{{- if .Values.crds.install }}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
    {{- include "signoz-operator.crdAnnotations" . | nindent 4 }}
  name: dashboards.resources.signoz.io
  labels:
    {{- include "signoz-operator.crdLabels" . | nindent 4 }}
spec:
  group: resources.signoz.io
  names:
    kind: Dashboard
    listKind: DashboardList
    plural: dashboards
    singular: dashboard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      type: string
    - jsonPath: .status.signozResource.id
      name: ID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              interval:
                description: |-
                  Interval is the steady-state cadence at which the resource is re-checked
                  against SigNoz. Omitted, it falls back to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              objectTemplate:
                maxProperties: 1
                minProperties: 1
                properties:
                  jsonSpec:
                    minLength: 1
                    type: string
                  spec:
                    properties:
                      image:
                        description: 'Icon or logo shown in the dashboard list: the
                          path of an icon or logo bundled with the UI under /assets/Icons/
                          or /assets/Logos/ (only the prefix is validated), or a base64
                          image data URI for png, jpeg, gif, webp, avif or svg. Empty
                          for none.'
                        type: string
                      name:
                        description: The dashboard's unique name, a DNS-1123 label
                          (lowercase letters, digits and hyphens, at most 63 characters).
                          Immutable after creation. Must be empty when generateName
                          is true.
                        type: string
                      schemaVersion:
                        description: The dashboard schema version. Must be v6.
                        minLength: 1
                        type: string
                      spec:
                        description: 'The dashboard content: display, variables, panels,
                          layouts and links.'
                        properties:
                          display:
                            description: The dashboard title and description.
                            properties:
                              description:
                                description: A free-text description.
                                type: string
                              name:
                                description: The human-readable title, at most 128
                                  characters.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          duration:
                            description: The default time range, as a Prometheus duration
                              such as 1h or 7d. Stored, but not applied by the UI.
                            type: string
                          layouts:
                            description: The Grid layouts that place panels, at most
                              500. Each panel can be placed at most once. Use [] for
                              none.
                            items:
                              properties:
                                kind:
                                  description: The layout kind.
                                  enum:
                                  - Grid
                                  type: string
                                spec:
                                  description: 'The grid section: an optional display
                                    title and up to 100 items that place panels. Each
                                    item has a content.$ref of #/spec/panels/<id>
                                    plus x, y, width and height on a 12-column grid:
                                    x and y at least 0, width and height at least
                                    1, x plus width at most 12, and no two items overlapping.'
                                  properties:
                                    display:
                                      properties:
                                        collapse:
                                          properties:
                                            open:
                                              type: boolean
                                          type: object
                                        title:
                                          type: string
                                      type: object
                                    items:
                                      items:
                                        properties:
                                          content:
                                            properties:
                                              $ref:
                                                type: string
                                            type: object
                                          height:
                                            format: int64
                                            type: integer
                                          width:
                                            format: int64
                                            type: integer
                                          x:
                                            format: int64
                                            type: integer
                                          "y":
                                            format: int64
                                            type: integer
                                        type: object
                                      type: array
                                    repeatVariable:
                                      type: string
                                  type: object
                              required:
                              - kind
                              - spec
                              type: object
                            type: array
                          links:
                            description: External links stored with the dashboard.
                              Not shown by the UI.
                            items:
                              properties:
                                name:
                                  description: The link label.
                                  type: string
                                renderVariables:
                                  description: Whether dashboard variable values are
                                    substituted into url before opening it.
                                  type: boolean
                                targetBlank:
                                  description: Whether the link opens in a new tab.
                                  type: boolean
                                tooltip:
                                  description: Hover text for the link. Stored, but
                                    not shown by the UI.
                                  type: string
                                url:
                                  description: The link target. May reference dashboard
                                    variables as {{ "{{" }}name{{ "}}" }} when renderVariables is
                                    true.
                                  type: string
                              type: object
                            type: array
                          panels:
                            additionalProperties:
                              properties:
                                kind:
                                  description: The panel envelope kind. Always Panel.
                                  enum:
                                  - Panel
                                  type: string
                                spec:
                                  description: 'The panel content: display, plugin,
                                    queries and links.'
                                  properties:
                                    display:
                                      description: The panel title and description.
                                      properties:
                                        description:
                                          description: A free-text description.
                                          type: string
                                        name:
                                          description: The human-readable title, at
                                            most 128 characters.
                                          minLength: 1
                                          type: string
                                      required:
                                      - name
                                      type: object
                                    links:
                                      description: Context links offered in the data
                                        point drilldown menu of the panel, with dashboard
                                        variables resolved in the URL.
                                      items:
                                        properties:
                                          name:
                                            description: The link label.
                                            type: string
                                          renderVariables:
                                            description: Whether dashboard variable
                                              values are substituted into url before
                                              opening it.
                                            type: boolean
                                          targetBlank:
                                            description: Whether the link opens in
                                              a new tab.
                                            type: boolean
                                          tooltip:
                                            description: Hover text for the link.
                                              Stored, but not shown by the UI.
                                            type: string
                                          url:
                                            description: The link target. May reference
                                              dashboard variables as {{ "{{" }}name{{ "}}" }} when
                                              renderVariables is true.
                                            type: string
                                        type: object
                                      type: array
                                    plugin:
                                      description: 'The visualization: kind is one
                                        of signoz/TimeSeriesPanel, signoz/BarChartPanel,
                                        signoz/AreaChartPanel, signoz/NumberPanel,
                                        signoz/PieChartPanel, signoz/TablePanel, signoz/HistogramPanel,
                                        signoz/ListPanel, signoz/TextPanel or signoz/HeatmapPanel,
                                        and spec holds that kind''s options ({} accepts
                                        every default).'
                                      properties:
                                        kind:
                                          description: The panel kind.
                                          enum:
                                          - signoz/TimeSeriesPanel
                                          - signoz/BarChartPanel
                                          - signoz/AreaChartPanel
                                          - signoz/NumberPanel
                                          - signoz/PieChartPanel
                                          - signoz/TablePanel
                                          - signoz/HistogramPanel
                                          - signoz/ListPanel
                                          - signoz/TextPanel
                                          - signoz/HeatmapPanel
                                          type: string
                                        spec:
                                          description: The options for this panel
                                            kind. {} accepts every default.
                                          properties:
                                            axes:
                                              properties:
                                                isLogScale:
                                                  description: Whether the Y axis
                                                    uses a logarithmic scale.
                                                  type: boolean
                                                softMax:
                                                  description: The highest value the
                                                    Y axis always shows; data above
                                                    it still extends the axis. Null
                                                    fits the data.
                                                  type: number
                                                softMin:
                                                  description: The lowest value the
                                                    Y axis always shows; data below
                                                    it still extends the axis. Null
                                                    fits the data.
                                                  type: number
                                                "y":
                                                  description: The bucket axis.
                                                  properties:
                                                    scale:
                                                      description: 'How bucket bounds
                                                        are spaced on the axis: auto
                                                        (default), linear, log or
                                                        symlog.'
                                                      enum:
                                                      - auto
                                                      - linear
                                                      - log
                                                      - symlog
                                                      type: string
                                                  type: object
                                              type: object
                                            chartAppearance:
                                              properties:
                                                colors:
                                                  description: The color scale applied
                                                    to bucket counts.
                                                  properties:
                                                    fill:
                                                      description: The hex color varied
                                                        in opacity mode. Empty uses
                                                        the series legend color.
                                                      type: string
                                                    maxCount:
                                                      description: The count mapped
                                                        to the highest color. Null
                                                        uses the highest count in
                                                        the grid.
                                                      type: number
                                                    minCount:
                                                      description: The count mapped
                                                        to the lowest color. Null
                                                        uses 0. Must not exceed maxCount.
                                                      type: number
                                                    mode:
                                                      description: 'How counts are
                                                        colored: palette (default)
                                                        picks a hue from palette,
                                                        opacity varies the opacity
                                                        of fill.'
                                                      enum:
                                                      - palette
                                                      - opacity
                                                      type: string
                                                    palette:
                                                      description: The named color
                                                        ramp used in palette mode,
                                                        such as lava (default), ice
                                                        or ember.
                                                      enum:
                                                      - ice
                                                      - moss
                                                      - rust
                                                      - graphite
                                                      - ember
                                                      - lagoon
                                                      - orchid
                                                      - verdant
                                                      - lava
                                                      - beacon
                                                      type: string
                                                    scale:
                                                      description: 'How counts map
                                                        onto the color range: log
                                                        (default), sqrt or linear.'
                                                      enum:
                                                      - log
                                                      - sqrt
                                                      - linear
                                                      type: string
                                                    steps:
                                                      description: The number of distinct
                                                        color steps, 2 to 128. 0 uses
                                                        the chart default.
                                                      format: int64
                                                      type: integer
                                                  type: object
                                                fillMode:
                                                  enum:
                                                  - solid
                                                  - gradient
                                                  - none
                                                  type: string
                                                fillOpacity:
                                                  description: The fill opacity from
                                                    0 (transparent) to 1 (opaque).
                                                    Null uses the chart default.
                                                  type: number
                                                lineInterpolation:
                                                  description: 'How points are joined:
                                                    linear, spline (default), step_after
                                                    or step_before.'
                                                  enum:
                                                  - linear
                                                  - spline
                                                  - step_after
                                                  - step_before
                                                  type: string
                                                lineStyle:
                                                  description: 'The line stroke: solid
                                                    (default) or dashed.'
                                                  enum:
                                                  - solid
                                                  - dashed
                                                  type: string
                                                showPoints:
                                                  description: Whether each data point
                                                    is marked on the line.
                                                  type: boolean
                                                spanGaps:
                                                  description: Whether lines connect
                                                    across missing points.
                                                  properties:
                                                    fillLessThan:
                                                      description: The largest gap
                                                        still connected when fillOnlyBelow
                                                        is true; longer gaps are left
                                                        disconnected. Required in
                                                        that case, as a positive Prometheus
                                                        duration such as 30s, 5m or
                                                        1d.
                                                      type: string
                                                    fillOnlyBelow:
                                                      description: Controls whether
                                                        lines connect across null
                                                        values. When false (default),
                                                        all gaps are connected. When
                                                        true, only gaps smaller than
                                                        fillLessThan are connected.
                                                      type: boolean
                                                  type: object
                                              type: object
                                            formatting:
                                              properties:
                                                columnUnits:
                                                  additionalProperties:
                                                    type: string
                                                  description: 'Unit id per value
                                                    column, keyed by the column key:
                                                    the query name for a builder query
                                                    with one aggregation (A), the
                                                    query name dotted with the aggregation
                                                    expression for several (A.count()),
                                                    or the SQL alias for a ClickHouse
                                                    SQL column. Aggregation aliases
                                                    are display labels, not keys.'
                                                  type: object
                                                decimalPrecision:
                                                  description: 'Decimal places shown:
                                                    0, 1, 2 (default), 3, 4 or full.'
                                                  enum:
                                                  - "0"
                                                  - "1"
                                                  - "2"
                                                  - "3"
                                                  - "4"
                                                  - full
                                                  type: string
                                                unit:
                                                  description: The display unit of
                                                    the values, such as By, ms, s,
                                                    percent or percentunit. Use percent
                                                    for values already expressed as
                                                    percentages (95 displays as 95%)
                                                    and percentunit for fractions
                                                    (0.95 displays as 95%). Empty
                                                    shows plain numbers.
                                                  type: string
                                              type: object
                                            headerOptions:
                                              description: Whether the panel header
                                                is shown.
                                              properties:
                                                hide:
                                                  description: Whether the title and
                                                    description row above the content
                                                    is hidden.
                                                  type: boolean
                                              type: object
                                            histogramBuckets:
                                              description: How values are grouped
                                                into buckets.
                                              properties:
                                                bucketCount:
                                                  description: The approximate target
                                                    number of buckets. Ignored when
                                                    bucketWidth is positive. Null
                                                    uses the chart default.
                                                  type: number
                                                bucketWidth:
                                                  description: The width of each bucket
                                                    in the value unit. A positive
                                                    value takes precedence over bucketCount;
                                                    null or 0 lets the chart choose.
                                                  type: number
                                                mergeAllActiveQueries:
                                                  description: Whether every series
                                                    is combined into a single histogram
                                                    instead of one per series.
                                                  type: boolean
                                              type: object
                                            legend:
                                              properties:
                                                customColors:
                                                  additionalProperties:
                                                    type: string
                                                  description: Hex colors keyed by
                                                    series label, overriding the automatic
                                                    palette.
                                                  type: object
                                                mode:
                                                  description: The legend layout.
                                                    Only list is supported.
                                                  enum:
                                                  - list
                                                  type: string
                                                position:
                                                  description: 'Where the legend sits:
                                                    bottom (default) or right.'
                                                  enum:
                                                  - bottom
                                                  - right
                                                  type: string
                                              type: object
                                            mode:
                                              description: How text is interpreted.
                                                Only markdown is supported.
                                              enum:
                                              - markdown
                                              type: string
                                            presentation:
                                              description: Alignment and background
                                                of the content.
                                              properties:
                                                background:
                                                  description: 'A hex background color
                                                    such as #1f2937. Omit for the
                                                    panel default.'
                                                  type: string
                                                textAlign:
                                                  description: 'Horizontal alignment:
                                                    left (default), center or right.'
                                                  enum:
                                                  - left
                                                  - center
                                                  - right
                                                  type: string
                                                verticalAlign:
                                                  description: 'Vertical alignment:
                                                    top (default), center or bottom.'
                                                  enum:
                                                  - top
                                                  - center
                                                  - bottom
                                                  type: string
                                              type: object
                                            selectFields:
                                              description: The columns shown for each
                                                row, as field keys with name and optional
                                                fieldContext, fieldDataType and signal.
                                                Empty shows the default columns.
                                              items:
                                                properties:
                                                  description:
                                                    description: Human-readable summary
                                                      of the field, present only for
                                                      well-known fields.
                                                    type: string
                                                  fieldContext:
                                                    description: 'Where the field
                                                      lives: resource, attribute,
                                                      scope, span, trace, log, body
                                                      or metric. Empty means unspecified,
                                                      so the server resolves it.'
                                                    enum:
                                                    - metric
                                                    - log
                                                    - span
                                                    - trace
                                                    - resource
                                                    - scope
                                                    - attribute
                                                    - body
                                                    type: string
                                                  fieldDataType:
                                                    description: 'Data type of the
                                                      field values: string, bool,
                                                      int64, float64 or number. Empty
                                                      means unspecified.'
                                                    enum:
                                                    - string
                                                    - bool
                                                    - float64
                                                    - int64
                                                    - number
                                                    type: string
                                                  name:
                                                    description: The field name, such
                                                      as service.name, k8s.pod.name
                                                      or http.response.status_code.
                                                      Dots are part of the name, and
                                                      the names available depend on
                                                      the signal and the data ingested.
                                                    minLength: 1
                                                    type: string
                                                  signal:
                                                    description: 'The signal the field
                                                      belongs to: traces, logs or
                                                      metrics. Empty means any signal.'
                                                    enum:
                                                    - traces
                                                    - logs
                                                    - metrics
                                                    type: string
                                                  unit:
                                                    description: Unit of the field
                                                      values, present only for well-known
                                                      fields.
                                                    type: string
                                                required:
                                                - name
                                                type: object
                                              type: array
                                            text:
                                              description: The content to render.
                                              type: string
                                            thresholds:
                                              items:
                                                properties:
                                                  color:
                                                    minLength: 1
                                                    type: string
                                                  columnName:
                                                    description: 'The key of the value
                                                      column the rule applies to:
                                                      the query name for a builder
                                                      query with one aggregation (A),
                                                      the query name dotted with the
                                                      aggregation expression for several
                                                      (A.count()), or the SQL alias
                                                      for a ClickHouse SQL column.
                                                      Group-by columns are never colored,
                                                      and aggregation aliases are
                                                      display labels, not keys.'
                                                    type: string
                                                  format:
                                                    description: 'What the color is
                                                      applied to: text (default) or
                                                      background.'
                                                    enum:
                                                    - text
                                                    - background
                                                    type: string
                                                  label:
                                                    description: The caption shown
                                                      on the line.
                                                    type: string
                                                  operator:
                                                    description: 'The comparison that
                                                      activates the threshold: above
                                                      (default), below, above_or_equal,
                                                      below_or_equal, equal or not_equal.'
                                                    enum:
                                                    - above
                                                    - below
                                                    - above_or_equal
                                                    - below_or_equal
                                                    - equal
                                                    - not_equal
                                                    type: string
                                                  unit:
                                                    description: The unit id of value,
                                                      such as ms or percent. Empty
                                                      means the panel's unit, or the
                                                      column's unit for a table threshold.
                                                      Prefer the panel's unit; a different
                                                      unit works only when it converts
                                                      to it, such as s against a panel
                                                      in ms.
                                                    type: string
                                                  value:
                                                    type: number
                                                required:
                                                - color
                                                - value
                                                type: object
                                              type: array
                                            visualization:
                                              properties:
                                                fillSpans:
                                                  description: Whether intervals with
                                                    no data are drawn as zero instead
                                                    of a gap.
                                                  type: boolean
                                                stack:
                                                  description: 'How the areas combine:
                                                    none (default) overlays them,
                                                    normal stacks the values, percent
                                                    stacks them as shares of the total.'
                                                  enum:
                                                  - none
                                                  - normal
                                                  - percent
                                                  type: string
                                                stackedBarChart:
                                                  description: Whether the series
                                                    are stacked on top of each other.
                                                  type: boolean
                                                timePreference:
                                                  description: 'The time range the
                                                    panel queries: global_time (default)
                                                    follows the dashboard range; last_5_min,
                                                    last_15_min, last_30_min, last_1_hr,
                                                    last_6_hr, last_1_day, last_3_days,
                                                    last_1_week or last_1_month pin
                                                    a fixed window.'
                                                  enum:
                                                  - global_time
                                                  - last_5_min
                                                  - last_15_min
                                                  - last_30_min
                                                  - last_1_hr
                                                  - last_6_hr
                                                  - last_1_day
                                                  - last_3_days
                                                  - last_1_week
                                                  - last_1_month
                                                  type: string
                                              type: object
                                          type: object
                                      required:
                                      - kind
                                      - spec
                                      type: object
                                    queries:
                                      description: The queries the panel runs. Use
                                        exactly one entry for a data panel and []
                                        for signoz/TextPanel. To run several named
                                        queries or formulas, use one entry whose spec.plugin.kind
                                        is signoz/CompositeQuery and put the constituent
                                        queries in its plugin spec.
                                      items:
                                        properties:
                                          kind:
                                            description: 'The result shape the panel
                                              requests: time_series for time series,
                                              bar, area and histogram panels, scalar
                                              for number, table and pie panels, raw
                                              for list panels, heatmap for heatmap
                                              panels, trace for trace panels.'
                                            enum:
                                            - scalar
                                            - time_series
                                            - raw
                                            - raw_stream
                                            - trace
                                            - heatmap
                                            type: string
                                          spec:
                                            description: 'The query content: an optional
                                              name and the query plugin.'
                                            properties:
                                              name:
                                                description: An optional label for
                                                  the query. The name queries refer
                                                  to each other by lives in the plugin
                                                  spec.
                                                type: string
                                              plugin:
                                                description: 'The query: kind is one
                                                  of signoz/BuilderQuery, signoz/AIBuilderQuery
                                                  (builder query over AI observability
                                                  traces), signoz/CompositeQuery (several
                                                  named queries and formulas), signoz/Formula,
                                                  signoz/PromQLQuery, signoz/ClickHouseSQL
                                                  or signoz/TraceOperator, and spec
                                                  holds that kind''s query. Pie and
                                                  table panels reject signoz/PromQLQuery;
                                                  heatmap panels reject signoz/AIBuilderQuery
                                                  and signoz/TraceOperator; list panels
                                                  accept only signoz/BuilderQuery
                                                  and signoz/AIBuilderQuery.'
                                                properties:
                                                  kind:
                                                    description: The query kind.
                                                    enum:
                                                    - signoz/BuilderQuery
                                                    - signoz/AIBuilderQuery
                                                    - signoz/CompositeQuery
                                                    - signoz/Formula
                                                    - signoz/PromQLQuery
                                                    - signoz/ClickHouseSQL
                                                    - signoz/TraceOperator
                                                    type: string
                                                  spec:
                                                    description: The kind-specific
                                                      query spec.
                                                    properties:
                                                      aggregations:
                                                        items:
                                                          properties:
                                                            alias:
                                                              description: The name
                                                                the aggregation is
                                                                reported under; when
                                                                omitted, the result
                                                                carries the alias
                                                                __result_N, with N
                                                                the zero-based index
                                                                of the aggregation.
                                                              type: string
                                                            comparisonSpaceAggregationParam:
                                                              description: 'Histogram
                                                                metrics with spaceAggregation
                                                                count only: the comparison
                                                                operator and bucket
                                                                bound used to estimate
                                                                how many observations
                                                                fall at or below,
                                                                or above, the threshold.
                                                                Ignored for other
                                                                metric types and aggregations.'
                                                              properties:
                                                                operator:
                                                                  description: 'Comparison
                                                                    applied to histogram
                                                                    bucket bounds
                                                                    when spaceAggregation
                                                                    is count: <= gives
                                                                    the estimated
                                                                    count of observations
                                                                    at or below threshold,
                                                                    > the estimated
                                                                    count above it.'
                                                                  minLength: 1
                                                                  type: string
                                                                threshold:
                                                                  description: Bucket
                                                                    bound the comparison
                                                                    uses, in the unit
                                                                    of the histogram
                                                                    metric. The count
                                                                    is exact when
                                                                    threshold equals
                                                                    one of the metric's
                                                                    le bucket bounds,
                                                                    and otherwise
                                                                    an estimate interpolated
                                                                    linearly between
                                                                    the two nearest
                                                                    bounds.
                                                                  type: number
                                                              required:
                                                              - operator
                                                              - threshold
                                                              type: object
                                                            expression:
                                                              type: string
                                                            metricName:
                                                              description: The name
                                                                of the metric to query,
                                                                for example k8s.pod.cpu_request_utilization.
                                                              type: string
                                                            reduceTo:
                                                              description: 'How a
                                                                series collapses to
                                                                one number in scalar
                                                                requests: sum, count,
                                                                avg, min, max, last
                                                                or median. Ignored
                                                                by time_series requests.'
                                                              enum:
                                                              - sum
                                                              - count
                                                              - avg
