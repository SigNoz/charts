# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# The Secret holding the ClickHouse password when ClickHouse is external (clickhouse.createSecret).
suite: clickhouse_external-secret_test.yaml
templates:
  - templates/clickhouse/secret.yaml
  - templates/signoz/statefulset.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: renders the Secret under a clickhouse.fullnameOverride over 34 characters
    template: templates/clickhouse/secret.yaml
    set:
      clickhouse.enabled: false
      clickhouse.fullnameOverride: signoz-clickhouse-0123456789-012345
      externalClickhouse.host: ch.example
      externalClickhouse.password: x
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: signoz-clickhouse-0123456789-012345-credentials
  - it: renders the Secret with an empty password when externalClickhouse.password is unset
    template: templates/clickhouse/secret.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData.password
          value: ""
  - it: stores clickhouse.password, not externalClickhouse.password, when clickhouse.enabled is true
    template: templates/clickhouse/secret.yaml
    set:
      clickhouse.password: bundled-password
      externalClickhouse.password: golden-password
    asserts:
      - equal:
          path: stringData.password
          value: bundled-password
  - it: reads CLICKHOUSE_PASSWORD from the chart's Secret under password when externalClickhouse.existingSecret is unset
    template: templates/signoz/statefulset.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
      externalClickhouse.password: golden-password
      externalClickhouse.existingSecretPasswordKey: pw
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: golden-clickhouse-credentials
                key: password
