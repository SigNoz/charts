{{- if .Values.otelCollector.httpRoute.enabled }}
{{- $args := dict "kind" "HTTPRoute" }}
{{- $_ := set $args "name" (include "otelCollector.fullname" .) }}
{{- $_ := set $args "namespace" (include "signoz.namespace" .) }}
{{- $_ := set $args "labels" (include "otelCollector.labels" . | fromYaml) }}
{{- $_ := set $args "route" .Values.otelCollector.httpRoute }}
{{- $_ := set $args "port" (dig "otlp-http" "servicePort" "" .Values.otelCollector.ports) }}
{{- include "signoz.lib.route" $args }}
{{- end }}
