# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: keeper_installation_test.yaml
templates:
  - templates/keeper/clickhousekeeperinstallation.yaml
release:
  name: signoz
  namespace: signoz
tests:
  - it: names the installation after the release
    asserts:
      - equal:
          path: metadata.name
          value: signoz-keeper
      - equal:
          path: metadata.namespace
          value: signoz
  - it: renders a 34-character keeper name
    set:
      keeper.fullnameOverride: signoz-keeper-0123456789-012345678
    asserts:
      - equal:
          path: metadata.name
          value: signoz-keeper-0123456789-012345678
  - it: fails on a keeper name over 34 characters
    set:
      keeper.fullnameOverride: signoz-keeper-0123456789-0123456789
    asserts:
      - failedTemplate:
          errorPattern: "may be at most 34"
  - it: names the cluster cluster
    asserts:
      - equal:
          path: spec.configuration.clusters[0].name
          value: cluster
      - equal:
          path: spec.configuration.clusters[0].layout.replicasCount
          value: 1
  - it: names the pod and claim templates default
    asserts:
      - equal:
          path: spec.defaults.templates.podTemplate
          value: default
      - equal:
          path: spec.defaults.templates.dataVolumeClaimTemplate
          value: default
      - equal:
          path: spec.templates.podTemplates[0].name
          value: default
      - equal:
          path: spec.templates.volumeClaimTemplates[0].name
          value: default
  - it: retains the claim when the installation or a replica is removed
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].reclaimPolicy
          value: Retain
  - it: retains unknown claims on reconcile
    asserts:
      - equal:
          path: spec.reconciling.cleanup.unknownObjects.pvc
          value: Retain
  - it: renders the image with no registry by default
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].name
          value: clickhouse-keeper
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: clickhouse/clickhouse-keeper:25.12.5
  - it: prefixes global.imageRegistry to the image
    set:
      global.imageRegistry: mirror.example.internal
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.internal/clickhouse/clickhouse-keeper:25.12.5
  - it: takes global.storageClass over keeper.persistence.storageClass
    set:
      global.storageClass: global-class
      keeper.persistence.storageClass: keeper-class
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName
          value: global-class
  - it: takes keeper.persistence.storageClass when global.storageClass is unset
    set:
      keeper.persistence.storageClass: keeper-class
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName
          value: keeper-class
  - it: renders an empty storage class for -
    set:
      keeper.persistence.storageClass: "-"
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName
          value: ""
  - it: renders no storage class when both are unset
    asserts:
      - notExists:
          path: spec.templates.volumeClaimTemplates[0].spec.storageClassName
  - it: passes keeper.persistence.accessModes and size through
    set:
      keeper.persistence.accessModes:
        - ReadWriteMany
      keeper.persistence.size: 20Gi
    asserts:
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.accessModes
          value:
            - ReadWriteMany
      - equal:
          path: spec.templates.volumeClaimTemplates[0].spec.resources.requests.storage
          value: 20Gi
  - it: merges keeper.settings per key
    set:
      keeper:
        settings:
          logger/level: trace
          keeper_server/max_requests_batch_size: "100"
    asserts:
      - equal:
          path: spec.configuration.settings["logger/level"]
          value: trace
      - equal:
          path: spec.configuration.settings["keeper_server/max_requests_batch_size"]
          value: "100"
      - equal:
          path: spec.configuration.settings["prometheus/port"]
          value: "9141"
  - it: drops a keeper.settings key set to null
    set:
      keeper:
        settings:
          logger/console: null
    asserts:
      - notExists:
          path: spec.configuration.settings["logger/console"]
  - it: renders no container securityContext by default
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].spec.containers[0].securityContext
  - it: renders the container securityContext when set
    set:
      keeper.containerSecurityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].securityContext
          value:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
  - it: renders the pod securityContext from keeper.podSecurityContext
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.securityContext
          value:
            fsGroup: 101
  - it: renders no pod securityContext when keeper.podSecurityContext is null
    set:
      keeper.podSecurityContext: null
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].spec.securityContext
  - it: renders only the selector labels on the pod template
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].metadata.labels["app.kubernetes.io/version"]
      - notExists:
          path: spec.templates.podTemplates[0].metadata.labels["app.kubernetes.io/managed-by"]
      - exists:
          path: metadata.labels["app.kubernetes.io/version"]
      - exists:
          path: metadata.labels["app.kubernetes.io/managed-by"]
