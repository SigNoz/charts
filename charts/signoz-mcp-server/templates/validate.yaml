{{- /*
Install-time check on the shape of the chart's own values. This file renders
no object.

1. env is a map.
*/ -}}

{{- /* 1. env is a map. The env helper reads env as a map. A null env is treated as an empty map. */ -}}
{{- $env := .Values.env -}}
{{- if and (not (kindIs "invalid" $env)) (not (kindIs "map" $env)) -}}
{{- fail (printf "env must be a map of NAME: value, for example env: {SIGNOZ_URL: http://...}; got a %s. A list of name/value pairs is not accepted." (kindOf $env)) -}}
{{- end -}}
