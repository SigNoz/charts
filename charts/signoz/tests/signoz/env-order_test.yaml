# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/env-order
templates:
  - templates/signoz/statefulset.yaml
tests:
  - it: lists the ClickHouse variables, then SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN and _CLUSTER, then the signoz.env keys in alphabetical order
    set:
      signoz.env:
        tz: Europe/Berlin
        https_proxy: http://proxy.example.com:3128
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[7].name
          value: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_DSN
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[8].name
          value: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[9].name
          value: HTTPS_PROXY
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[-1].name
          value: TZ
  - it: lists POSTGRES_USER, POSTGRES_PORT, POSTGRES_PASSWORD, POSTGRES_DB, SIGNOZ_SQLSTORE_PROVIDER and SIGNOZ_SQLSTORE_POSTGRES_DSN in that order, after the telemetry store variables and before the signoz.env keys
    set:
      postgresql.enabled: true
      postgresql.auth.database: signozdb
      signoz.env:
        https_proxy: http://proxy.example.com:3128
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[8].name
          value: SIGNOZ_TELEMETRYSTORE_CLICKHOUSE_CLUSTER
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[9].name
          value: POSTGRES_USER
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[10].name
          value: POSTGRES_PORT
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[11].name
          value: POSTGRES_PASSWORD
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[12].name
          value: POSTGRES_DB
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[13].name
          value: SIGNOZ_SQLSTORE_PROVIDER
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[14].name
          value: SIGNOZ_SQLSTORE_POSTGRES_DSN
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[15].name
          value: HTTPS_PROXY
  - it: renders a signoz.env key after the signoz.env key its value references through $(NAME)
    set:
      signoz.env:
        webhook_url: https://$(PUBLIC_HOST)/hooks
        public_host: signoz.example.com
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "signoz")].env[-1]
          value: {name: WEBHOOK_URL, value: "https://$(PUBLIC_HOST)/hooks"}
      - contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: {name: PUBLIC_HOST, value: signoz.example.com}
