{{- if .Values.signoz.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "signoz.lib.serviceAccountName" (dict "serviceAccount" .Values.signoz.serviceAccount "fullname" (include "signoz.fullname" .)) }}
  labels:
    {{- include "signoz.labels" . | nindent 4 }}
  {{- with .Values.signoz.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
