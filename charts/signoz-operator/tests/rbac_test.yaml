suite: Test the controller RBAC
templates:
  - role.yaml
  - rolebinding.yaml
  - serviceaccount.yaml
release:
  name: prod
  namespace: signoz-operator
tests:
  - it: should grant the controller rules cluster wide by default
    template: role.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: prod-signoz-operator
  - it: should confine the controller rules to the release namespace when asked
    template: role.yaml
    documentIndex: 0
    set:
      rbac:
        namespaced: true
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.namespace
          value: signoz-operator
  - it: should always scope the leader election rules to the release namespace
    template: role.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: prod-signoz-operator-leader-election
      - equal:
          path: metadata.namespace
          value: signoz-operator
  - it: should bind the controller role to the ServiceAccount it creates
    template: rolebinding.yaml
    documentIndex: 0
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: prod-signoz-operator
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: prod-signoz-operator
            namespace: signoz-operator
  - it: should bind a namespaced Role when the rules are confined
    template: rolebinding.yaml
    documentIndex: 0
    set:
      rbac:
        namespaced: true
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.kind
          value: Role
      - equal:
          path: metadata.namespace
          value: signoz-operator
  - it: should bind the leader election role to the same ServiceAccount
    template: rolebinding.yaml
    documentIndex: 1
    asserts:
      - isKind:
          of: RoleBinding
      - equal:
          path: roleRef.name
          value: prod-signoz-operator-leader-election
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: prod-signoz-operator
            namespace: signoz-operator
  - it: should bind to an existing ServiceAccount when one is supplied
    template: rolebinding.yaml
    documentIndex: 0
    set:
      serviceAccount:
        enabled: false
        name: existing-sa
    asserts:
      - contains:
          path: subjects
          content:
            kind: ServiceAccount
            name: existing-sa
            namespace: signoz-operator
  - it: should not create a ServiceAccount when one is supplied
    template: serviceaccount.yaml
    set:
      serviceAccount:
        enabled: false
        name: existing-sa
    asserts:
      - hasDocuments:
          count: 0
