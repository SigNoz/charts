# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# Installs the chart, runs helm test, then uninstalls it. The release or its namespace not going within
# the timeouts fails the test.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: signoz-mcp-server
spec:
  timeouts:
    exec: 7m
    cleanup: 3m
  steps:
    - name: install
      try:
        - script:
            content: helm install signoz-mcp-server ../.. --namespace $NAMESPACE --wait --timeout 5m --set env[0].name=SIGNOZ_URL --set env[0].value=http://signoz.invalid:8080
        - script:
            content: helm test signoz-mcp-server --namespace $NAMESPACE --timeout 5m
      catch: &diagnostics
        - events: {}
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs: {}
    - name: uninstall
      try:
        - script:
            content: helm uninstall signoz-mcp-server --namespace $NAMESPACE --wait --timeout 5m
      catch: *diagnostics
