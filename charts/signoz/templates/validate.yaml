{{- /*
Values keys that no longer do anything at these paths (removed, or moved to a new path).
Fail the render instead of ignoring them, so an old values file is caught at `helm upgrade` time rather than silently misapplied.
*/ -}}
{{- if hasKey (.Values.clickhouse | default dict) "clickhouseOperator" }}
{{- fail "`clickhouse.clickhouseOperator` is no longer a supported value. The operator is installed from Altinity's chart; its settings live at `altinity-clickhouse-operator.*` (top level, Altinity's keys); `altinity-clickhouse-operator.enabled: false` skips it." }}
{{- end }}
{{- if hasKey (.Values.clickhouse | default dict) "altinity-clickhouse-operator" }}
{{- fail "operator values moved from `clickhouse.altinity-clickhouse-operator.*` to `altinity-clickhouse-operator.*` (top level)." }}
{{- end }}
{{- if hasKey (.Values.clickhouse | default dict) "zookeeper" }}
{{- fail "ZooKeeper values moved from `clickhouse.zookeeper.*` to `zookeeper.*` (top level); `clickhouse.externalZookeeper` is unchanged." }}
{{- end }}
{{- /*
ClickHouse values that took the Kubernetes shape: the probes, the pod security context and the extra volumes.
An old key fails when it is set and non-empty; a probe in the old enabled/port/path shape fails on the presence of any of those keys.
*/ -}}
{{- $ch := .Values.clickhouse | default dict }}
{{- if dig "securityContext" dict $ch }}
{{- fail "`clickhouse.securityContext` has moved to `clickhouse.podSecurityContext`, a pod security context object without the enabled flag." }}
{{- end }}
{{- if dig "customStartupProbe" dict $ch }}
{{- fail "`clickhouse.customStartupProbe` has been removed; set `clickhouse.startupProbe` to the probe object itself; for a non-HTTP probe also set `httpGet: null`." }}
{{- end }}
{{- if dig "customLivenessProbe" dict $ch }}
{{- fail "`clickhouse.customLivenessProbe` has been removed; set `clickhouse.livenessProbe` to the probe object itself; for a non-HTTP probe also set `httpGet: null`." }}
{{- end }}
{{- if dig "customReadinessProbe" dict $ch }}
{{- fail "`clickhouse.customReadinessProbe` has been removed; set `clickhouse.readinessProbe` to the probe object itself; for a non-HTTP probe also set `httpGet: null`." }}
{{- end }}
{{- if dig "additionalVolumes" list $ch }}
{{- fail "`clickhouse.additionalVolumes` has moved to `clickhouse.extraVolumes`, the same list of Kubernetes Volume objects." }}
{{- end }}
{{- if dig "additionalVolumeMounts" list $ch }}
{{- fail "`clickhouse.additionalVolumeMounts` has moved to `clickhouse.extraVolumeMounts`, the same list of Kubernetes VolumeMount objects." }}
{{- end }}
{{- $startupProbe := dig "startupProbe" dict $ch | default dict }}
{{- if or (hasKey $startupProbe "enabled") (hasKey $startupProbe "port") (hasKey $startupProbe "path") }}
{{- fail "`clickhouse.startupProbe` is now a Kubernetes probe object (httpGet.port, httpGet.path, timings); the enabled/port/path shape is no longer read." }}
{{- end }}
{{- $livenessProbe := dig "livenessProbe" dict $ch | default dict }}
{{- if or (hasKey $livenessProbe "enabled") (hasKey $livenessProbe "port") (hasKey $livenessProbe "path") }}
{{- fail "`clickhouse.livenessProbe` is now a Kubernetes probe object (httpGet.port, httpGet.path, timings); the enabled/port/path shape is no longer read." }}
{{- end }}
{{- $readinessProbe := dig "readinessProbe" dict $ch | default dict }}
{{- if or (hasKey $readinessProbe "enabled") (hasKey $readinessProbe "port") (hasKey $readinessProbe "path") }}
{{- fail "`clickhouse.readinessProbe` is now a Kubernetes probe object (httpGet.port, httpGet.path, timings); the enabled/port/path shape is no longer read." }}
{{- end }}
{{- /*
ClickHouse image blocks without a registry key: the repository carries the registry, and global.imageRegistry replaces it.
An old registry key fails when it is set and non-empty.
*/ -}}
{{- if dig "image" "registry" "" $ch }}
{{- fail "`clickhouse.image.registry` has been removed; put the registry in front of `clickhouse.image.repository` (for example `my.registry/clickhouse/clickhouse-server`), or set `global.imageRegistry`." }}
{{- end }}
{{- if dig "logs" "system" "image" "registry" "" $ch }}
{{- fail "`clickhouse.logs.system.image.registry` has been removed; put the registry in front of `clickhouse.logs.system.image.repository` (for example `my.registry/signoz/signoz-otel-collector`), or set `global.imageRegistry`." }}
{{- end }}
{{- if dig "initContainers" "udf" "image" "registry" "" $ch }}
{{- fail "`clickhouse.initContainers.udf.image.registry` has been removed; put the registry in front of `clickhouse.initContainers.udf.image.repository` (for example `my.registry/alpine`), or set `global.imageRegistry`." }}
{{- end }}
{{- if dig "initContainers" "init" "image" "registry" "" $ch }}
{{- fail "`clickhouse.initContainers.init.image.registry` has been removed; put the registry in front of `clickhouse.initContainers.init.image.repository` (for example `my.registry/busybox`), or set `global.imageRegistry`." }}
{{- end }}
{{- /*
ClickHouse in another namespace with none of the operator's watch settings set.
This check protects installs that set `clickhouse.namespace` under older chart versions, where the operator was
installed into that namespace. The operator now stays in the release namespace and watches only it unless told
otherwise, so an unchanged values file would leave the CHI unreconciled.
It fires only when none of the operator's watch settings (namespaceOverride, watchNamespaces, the watch list in
the operator's config file) has been set; it never judges their value.
*/ -}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.namespace (ne .Values.clickhouse.namespace .Release.Namespace) (eq (include "clickhouse.operatorEnabled" .) "true") }}
{{- $ns := .Values.clickhouse.namespace }}
{{- $op := index .Values "altinity-clickhouse-operator" | default dict }}
{{- if and (not ($op.namespaceOverride | default "")) (not ($op.watchNamespaces | default list)) (not (dig "configs" "files" "config.yaml" "watch" "namespaces" "include" list $op)) }}
{{- fail (printf "`clickhouse.namespace` is set to `%s` but the operator's watch settings are untouched, so it would watch only the release namespace and never reconcile the ClickHouseInstallation. Older chart versions installed the operator into that namespace; to keep that layout set `altinity-clickhouse-operator.namespaceOverride: %s`. To keep the operator in the release namespace instead, set `altinity-clickhouse-operator.watchNamespaces: [\"%s\"]` (or the watch list inside `altinity-clickhouse-operator.configs.files.config.yaml`) and `altinity-clickhouse-operator.rbac.namespaceScoped: false` so it has rights there." $ns $ns $ns) }}
{{- end }}
{{- end }}
