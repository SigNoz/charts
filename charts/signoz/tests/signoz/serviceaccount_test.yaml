# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: signoz/serviceaccount
templates:
  - templates/signoz/serviceaccount.yaml
  - templates/signoz/statefulset.yaml
tests:
  - it: creates ServiceAccount <fullname> and runs the SigNoz pods as it
    set:
      signoz.serviceAccount.create: true
    asserts:
      - template: templates/signoz/serviceaccount.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-signoz
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: RELEASE-NAME-signoz

  - it: creates ServiceAccount signoz.serviceAccount.name and runs the SigNoz pods as it
    set:
      signoz.serviceAccount.create: true
      signoz.serviceAccount.name: sa1
    asserts:
      - template: templates/signoz/serviceaccount.yaml
        equal:
          path: metadata.name
          value: sa1
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: sa1

  - it: runs the SigNoz pods as default, creating no ServiceAccount, when signoz.serviceAccount.create is false
    set:
      signoz.serviceAccount.create: false
    asserts:
      - template: templates/signoz/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default

  - it: runs the SigNoz pods as signoz.serviceAccount.name without creating it when create is false
    set:
      signoz.serviceAccount.create: false
      signoz.serviceAccount.name: bar
    asserts:
      - template: templates/signoz/serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: templates/signoz/statefulset.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: bar
