suite: Test the install-time checks
templates:
  - validate.yaml
release:
  name: signoz-mcp
  namespace: platform
chart:
  version: 0.0.0-test
  appVersion: v0.0.0-test
tests:
  - it: should fail when env is a list
    set:
      env:
        - name: SIGNOZ_URL
          value: http://signoz.platform.svc.cluster.local:8080
    asserts:
      - failedTemplate:
          errorMessage: "env must be a map of NAME: value, for example env: {SIGNOZ_URL: http://...}; got a slice. A list of name/value pairs is not accepted."

  - it: should fail when env is a string
    set:
      env: SIGNOZ_URL=http://signoz.platform.svc.cluster.local:8080
    asserts:
      - failedTemplate:
          errorMessage: "env must be a map of NAME: value, for example env: {SIGNOZ_URL: http://...}; got a string. A list of name/value pairs is not accepted."

  - it: should fail with empty env and name both variables
    set:
      env: {}
    asserts:
      - failedTemplate:
          errorMessage: "Set env.SIGNOZ_URL (for example http://<release>-signoz.<namespace>.svc.cluster.local:8080) or env.SIGNOZ_INSTANCE_URL_ALLOWLIST. The server exits at startup without one of them. Names under env are case-sensitive."

  - it: should pass with SIGNOZ_URL as a string and render no object
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0

  - it: should pass with SIGNOZ_URL as a {value} map
    set:
      env.SIGNOZ_URL:
        value: http://signoz.platform.svc.cluster.local:8080
    asserts:
      - notFailedTemplate: {}

  - it: should pass with SIGNOZ_URL as a {valueFrom} map
    set:
      env.SIGNOZ_URL:
        valueFrom:
          configMapKeyRef:
            name: signoz-mcp
            key: SIGNOZ_URL
    asserts:
      - notFailedTemplate: {}

  - it: should pass with only SIGNOZ_INSTANCE_URL_ALLOWLIST
    set:
      env.SIGNOZ_INSTANCE_URL_ALLOWLIST: signoz-a.example.com,signoz-b.example.com
    asserts:
      - notFailedTemplate: {}

  - it: should fail with an empty SIGNOZ_URL and give no did-you-mean hint
    set:
      env.SIGNOZ_URL: ""
    asserts:
      # helm-unittest shows only the lines after the first line of a multi-line
      # error, so an exact match on the one-line message also proves no hint
      # line was appended.
      - failedTemplate:
          errorMessage: "Set env.SIGNOZ_URL (for example http://<release>-signoz.<namespace>.svc.cluster.local:8080) or env.SIGNOZ_INSTANCE_URL_ALLOWLIST. The server exits at startup without one of them. Names under env are case-sensitive."

  - it: should fail with signoz_url set and hint at SIGNOZ_URL
    set:
      env.signoz_url: http://signoz.platform.svc.cluster.local:8080
    asserts:
      # helm-unittest shows only the lines after the first line of a multi-line
      # error: here, the hint line appended to the backend message.
      - failedTemplate:
          errorMessage: "env.signoz_url is not read by the server; did you mean SIGNOZ_URL?"

  - it: should fail with Signoz_Instance_Url_Allowlist set and hint at SIGNOZ_INSTANCE_URL_ALLOWLIST
    set:
      env.Signoz_Instance_Url_Allowlist: signoz-a.example.com
    asserts:
      - failedTemplate:
          errorMessage: "env.Signoz_Instance_Url_Allowlist is not read by the server; did you mean SIGNOZ_INSTANCE_URL_ALLOWLIST?"

  - it: should fail with a 64-character fullnameOverride
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - failedTemplate:
          errorMessage: "fullnameOverride must be at most 63 characters; got 64"

  - it: should pass with a 63-character fullnameOverride
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
      fullnameOverride: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    asserts:
      - notFailedTemplate: {}

  - it: should fail when autoscaling is enabled and both utilization targets are cleared with null
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
      autoscaling.targetMemoryUtilizationPercentage: null
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.enabled needs autoscaling.targetCPUUtilizationPercentage or autoscaling.targetMemoryUtilizationPercentage"

  - it: should fail when autoscaling is enabled and both utilization targets are cleared with 0
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: 0
      autoscaling.targetMemoryUtilizationPercentage: 0
    asserts:
      - failedTemplate:
          errorMessage: "autoscaling.enabled needs autoscaling.targetCPUUtilizationPercentage or autoscaling.targetMemoryUtilizationPercentage"

  - it: should pass when autoscaling is enabled and one utilization target is set
    set:
      env.SIGNOZ_URL: http://signoz.platform.svc.cluster.local:8080
      autoscaling.enabled: true
      autoscaling.targetCPUUtilizationPercentage: null
      autoscaling.targetMemoryUtilizationPercentage: 60
    asserts:
      - notFailedTemplate: {}
