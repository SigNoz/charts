# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# signoz.lib.image through the ClickHouse container of the ClickHouseInstallation.
suite: lib_image_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: renders the repository and tag with no registry by default
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: clickhouse/clickhouse-server:25.12.5
  - it: prefixes global.imageRegistry to a repository without a registry
    set:
      global.imageRegistry: mirror.example.internal
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.internal/clickhouse/clickhouse-server:25.12.5
  - it: keeps a registry carried by the repository when global.imageRegistry is empty
    set:
      clickhouse.image.repository: my.registry:5000/clickhouse/clickhouse-server
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: my.registry:5000/clickhouse/clickhouse-server:25.12.5
  - it: replaces a registry carried by the repository with global.imageRegistry
    set:
      global.imageRegistry: mirror.example.internal
      clickhouse.image.repository: my.registry:5000/clickhouse/clickhouse-server
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.internal/clickhouse/clickhouse-server:25.12.5
  - it: treats localhost as a registry and replaces it with global.imageRegistry
    set:
      global.imageRegistry: mirror.example.internal
      clickhouse.image.repository: localhost/clickhouse/clickhouse-server
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.internal/clickhouse/clickhouse-server:25.12.5
  - it: renders the tag from clickhouse.image.tag
    set:
      clickhouse.image.tag: 24.1.2-alpine
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: clickhouse/clickhouse-server:24.1.2-alpine
