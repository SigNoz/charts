# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql/credentials
templates:
  - templates/secret.yaml
tests:
  - it: stores auth.password in Secret <fullname>-auth under the key password
    set:
      auth.password: pg-s3cret
      auth.existingSecret: ""
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-postgresql-auth
      - equal:
          path: stringData.password
          value: pg-s3cret

  - it: creates no Secret when auth.existingSecret names one
    set:
      auth.password: pg-s3cret
      auth.existingSecret: my-pg-secret
    asserts:
      - hasDocuments:
          count: 0
