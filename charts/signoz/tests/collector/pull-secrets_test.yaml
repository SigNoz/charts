# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: collector/pull-secrets
templates:
  - templates/otel-collector/deployment.yaml
  - templates/otel-collector/configmap.yaml
tests:
  - it: pulls the collector pod with the global, root and otelCollector imagePullSecrets
    template: templates/otel-collector/deployment.yaml
    set:
      global.imagePullSecrets: [global-pull]
      imagePullSecrets: [root-pull]
      otelCollector.imagePullSecrets: [collector-pull]
    asserts:
      - contains:
          path: spec.template.spec.imagePullSecrets
          content: {name: global-pull}
      - contains:
          path: spec.template.spec.imagePullSecrets
          content: {name: root-pull}
      - contains:
          path: spec.template.spec.imagePullSecrets
          content: {name: collector-pull}
