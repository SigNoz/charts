# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# signoz.lib.image through the ClickHouse container of the ClickHouseInstallation.
suite: lib_image_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: uses global.imageRegistry over clickhouse.image.registry
    set:
      global.imageRegistry: mirror.example.internal
      clickhouse.image.registry: registry.example.internal
      clickhouse.image.tag: 25.12.5
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.internal/clickhouse/clickhouse-server:25.12.5
  - it: omits the registry when both registries are empty
    set:
      global.imageRegistry: ""
      clickhouse.image.registry: ""
      clickhouse.image.tag: 25.12.5
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: clickhouse/clickhouse-server:25.12.5
  - it: renders the tag from clickhouse.image.tag
    set:
      clickhouse.image.tag: 24.1.2-alpine
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: docker.io/clickhouse/clickhouse-server:24.1.2-alpine
