# namespace -- Which namespace to install postgresql to (defaults to namespace chart is installed to)
namespace: ""
# -- Name override for postgresql
nameOverride: ""
# -- Fullname override for postgreql
fullnameOverride: ""

# replicaCount -- Number of Postgres replicas.
# @default -- 1
replicaCount: 1

image:
  # image.repository -- Postgres image repository.
  # @default -- "postgres"
  repository: postgres
  # image.tag -- Postgres image tag.
  # @default -- "15"
  tag: 15
  # image.pullPolicy -- Image pull policy.
  # @default -- "IfNotPresent"
  pullPolicy: IfNotPresent

# imagePullSecrets -- Image pull secrets for Postgres pods
# @default -- []
imagePullSecrets: []

service:
  # service.annotations -- Annotations for the Postgres service object.
  # @default -- {}
  annotations: {}
  # service.labels -- Labels for the Postgres service object.
  # @default -- {}
  labels: {}
  # service.type -- The service type (`ClusterIP`, `NodePort`, `LoadBalancer`).
  # @default -- "ClusterIP"
  type: ClusterIP
  # service.port -- The external port for Postgres service
  # @default -- 5432
  port: 5432

auth:
  # auth.username -- Username for the custom user to create.
  # @default -- "signoz"
  username: "signoz"
  # auth.password -- Password for the custom user to create, stored in the Secret `<fullname>-auth` under the key `password`. Ignored if `auth.existingSecret` is provided, and then no Secret is created.
  password: "signoz123"
  # auth.database -- Name for a custom database to create.
  # @default -- ""
  database: "signoz"
  # auth.existingSecret -- Name of existing secret to use for PostgreSQL credentials. `auth.password` will be ignored and picked up from this secret.
  # @default -- ""
  existingSecret: ""
  secretKeys:
    # auth.secretKeys.userPasswordKey -- Name of key in existing secret to use for PostgreSQL credentials. Only used when `auth.existingSecret` is set.
    # @default -- "password"
    userPasswordKey: ""

# resources -- Resource requests and limits for Postgres pods.
# @default -- {}
resources: {}

# priorityClassName -- Priority class name for Postgres pods.
# @default -- ""
priorityClassName: ""

# podSecurityContext -- Security context for Postgres pods.
# @default -- {}
podSecurityContext: {}

# securityContext -- Container security context for Postgres containers.
# @default -- {}
securityContext: {}

# podAnnotations -- Annotations for Postgres pods.
# @default -- {}
podAnnotations: {}

# annotations -- Additional annotations for Postgres resources.
# @default -- {}
annotations: {}

# nodeSelector -- Node selector for Postgres pods.
# @default -- {}
nodeSelector: {}

# tolerations -- Tolerations for Postgres pods.
# @default -- []
tolerations: []

# affinity -- Affinity rules for Postgres pods.
# @default -- {}
affinity: {}

# topologySpreadConstraints -- Topology spread constraints for Postgres pods.
# @default -- []
topologySpreadConstraints: []

livenessProbe:
  # livenessProbe.enabled -- Enable liveness probe.
  # @default -- true
  enabled: true
  # livenessProbe.initialDelaySeconds -- Initial delay seconds for liveness probe.
  # @default -- 20
  initialDelaySeconds: 20
  # livenessProbe.periodSeconds -- Period seconds for liveness probe.
  # @default -- 10
  periodSeconds: 10
  # livenessProbe.timeoutSeconds -- Timeout seconds for liveness probe.
  # @default -- 5
  timeoutSeconds: 5
  # livenessProbe.successThreshold -- Success threshold for liveness probe.
  # @default -- 1
  successThreshold: 1
  # livenessProbe.failureThreshold -- Failure threshold for liveness probe.
  # @default -- 6
  failureThreshold: 6

readinessProbe:
  # readinessProbe.enabled -- Enable readiness probe.
  # @default -- true
  enabled: true
  # readinessProbe.initialDelaySeconds -- Initial delay seconds for readiness probe.
  # @default -- 5
  initialDelaySeconds: 5
  # readinessProbe.periodSeconds -- Period seconds for readiness probe.
  # @default -- 5
  periodSeconds: 5
  # readinessProbe.timeoutSeconds -- Timeout seconds for readiness probe.
  # @default -- 3
  timeoutSeconds: 3
  # readinessProbe.successThreshold -- Success threshold for readiness probe.
  # @default -- 1
  successThreshold: 1
  # readinessProbe.failureThreshold -- Failure threshold for readiness probe.
  # @default -- 6
  failureThreshold: 6

startupProbe:
  # Passes once Postgres answers on TCP and no dump is waiting at
  # `backups/pre-upgrade.sql` under `persistence.mountPath`, so a pod that has
  # not loaded its dump never becomes Ready. The liveness and readiness probes
  # start only after it passes.
  # -- Enable the startup probe.
  # @section -- Pod Configuration
  enabled: true
  # In seconds.
  # -- Delay before the first startup probe.
  # @section -- Pod Configuration
  initialDelaySeconds: 0
  # In seconds.
  # -- Interval between startup probes.
  # @section -- Pod Configuration
  periodSeconds: 10
  # In seconds.
  # -- Timeout of each startup probe.
  # @section -- Pod Configuration
  timeoutSeconds: 5
  # Kubernetes accepts only 1 for a startup probe.
  # -- Consecutive successes for the startup probe to pass.
  # @section -- Pod Configuration
  successThreshold: 1
  # With the default interval, 180 failures give a first start that loads a
  # dump 30 minutes before the container is restarted.
  # -- Consecutive failures before the container is restarted.
  # @section -- Pod Configuration
  failureThreshold: 180

persistence:
  # persistence.enabled -- Enable persistent storage for Postgres.
  # @default -- true
  enabled: true
  # persistence.existingClaim -- Use an existing PVC for Postgres data.
  # @default -- ""
  existingClaim: ""
  # persistence.size -- Size of the persistent volume claim.
  # @default -- "10Gi"
  size: 10Gi
  # persistence.storageClass -- Storage class for the persistent volume claim.
  # @default -- null
  storageClass: null
  # persistence.accessModes -- Access modes for the persistent volume claim.
  # @default -- ["ReadWriteOnce"]
  accessModes:
    - ReadWriteOnce
  # At `/var/lib/postgresql` the chart also mounts the claim's `data` folder,
  # under `persistence.subPath`, at `/var/lib/postgresql/data`, the image's data
  # volume, so the database is stored on the claim. It skips that mount for the
  # official `postgres` or `docker.io/library/postgres` repository at tag 18 or
  # later, and when an `additionalVolumeMounts` entry uses that path. At any
  # other path, keep `persistence.dataDir` under this one.
  # -- Mount path of the data claim.
  # @section -- Persistence Configuration
  mountPath: /var/lib/postgresql
  # persistence.subPath -- Subpath within the volume for Postgres data.
  # @default -- ""
  subPath: ""
  # Keep it a subdirectory of `persistence.mountPath`, so the database is
  # stored on the claim. A container that does not run as root, such as one
  # under OpenShift's restricted policy, cannot initialize the `data` folder
  # created for the mount described under `persistence.mountPath`: set
  # `/var/lib/postgresql/pgdata` instead. This applies to any image that gets
  # that mount, including an official image pulled through a mirror named in
  # `image.repository`.
  # -- Data directory of Postgres (`PGDATA`).
  # @section -- Persistence Configuration
  dataDir: /var/lib/postgresql/data

# The pre-upgrade backup Job. It always runs the Postgres image, so pg_dump
# matches the server, on the Postgres pod's node, with no retry: its image,
# affinity, topology spread and backoffLimit are not settable. `nodeSelector`,
# `priorityClassName` and the security contexts below take the Postgres pod's
# values when left empty.
upgradeBackupHook:
  # On `helm upgrade` with the default `persistence.mountPath`, the Job checks
  # the claim for the data directory at `persistence.dataDir`. When it is
  # missing, the Job dumps the running database to `backups/pre-upgrade.sql` on
  # the claim, and the upgraded pod loads that dump on its first start; a failed
  # dump stops the upgrade before anything changes. When the Postgres pod is
  # absent or cannot be scheduled, the Job stays Pending ("didn't match pod
  # affinity rules") and Helm fails the upgrade after
  # `upgradeBackupHook.activeDeadlineSeconds` with DeadlineExceeded; set this
  # to false for that upgrade. When false and the database is not on the
  # claim, take the dump yourself before upgrading, with the manual command in
  # the upgrade guide.
  # -- Run the hook on `helm upgrade`.
  # @section -- Upgrade Backup Hook Configuration
  enabled: true
  # In seconds. A large database needs more time. A value of 300 or more needs
  # `helm upgrade --timeout` raised with it, or Helm's own wait, 5 minutes by
  # default, ends first with a generic timeout.
  # -- Time limit of the Job before it, and with it the upgrade, is marked failed.
  # @section -- Upgrade Backup Hook Configuration
  activeDeadlineSeconds: 240
  # Requests and limits let the Job start in a namespace with a ResourceQuota.
  # `null` sets none; `{}` keeps these, because Helm merges maps.
  # -- Resource requests and limits for the container.
  # @default -- "requests 50m CPU and 64Mi memory, limits 1 CPU and 256Mi memory"
  # @section -- Upgrade Backup Hook Configuration
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi
  # The Job has to run on the node of the Postgres pod, so a selector set here
  # must match that node.
  # -- Node labels for pod assignment.
  # @default -- "the value of `nodeSelector`"
  # @section -- Upgrade Backup Hook Configuration
  nodeSelector: {}
  # Added to the Postgres pod's `tolerations`, which the Job always carries so
  # it can run on that pod's node.
  # -- Tolerations for pod assignment.
  # @section -- Upgrade Backup Hook Configuration
  tolerations: []
  # -- Priority class of the pod.
  # @default -- "the value of `priorityClassName`"
  # @section -- Upgrade Backup Hook Configuration
  priorityClassName: ""
  # A Kubernetes PodSecurityContext, rendered as given. The Job must run as the
  # Postgres pod's user to read the data directory; empty means exactly that.
  # -- Security context for the pod.
  # @default -- "the value of `podSecurityContext`"
  # @section -- Upgrade Backup Hook Configuration
  podSecurityContext: {}
  # A Kubernetes SecurityContext for the backup container, rendered as given.
  # The Job must run as the Postgres pod's user to read the data directory;
  # empty means exactly that.
  # -- Security context for the container.
  # @default -- "the value of `securityContext`"
  # @section -- Upgrade Backup Hook Configuration
  containerSecurityContext: {}
  # -- Annotations to add to the pod.
  # @section -- Upgrade Backup Hook Configuration
  podAnnotations: {}
  # The chart's own labels win over a key set here.
  # -- Labels to add to the pod.
  # @section -- Upgrade Backup Hook Configuration
  podLabels: {}
  # The chart's `helm.sh/hook`, `helm.sh/hook-weight` and
  # `helm.sh/hook-delete-policy` win over the same keys set here.
  # -- Annotations to add to the Job.
  # @section -- Upgrade Backup Hook Configuration
  annotations: {}

# additionalArgs -- Additional command-line arguments for Postgres containers.
# @default -- []
additionalArgs: []

# additionalVolumes -- Additional volumes for Postgres pods.
# @default -- []
additionalVolumes: []

# additionalVolumeMounts -- Additional volume mounts for Postgres containers.
# @default -- []
additionalVolumeMounts: []

# extraEnv -- Extra environment variables for Postgres containers.
# @default -- []
extraEnv: []

serviceAccount:
  # serviceAccount.create -- Specifies whether a service account should be created.
  # @default -- true
  create: true
  # serviceAccount.annotations -- Annotations to add to the service account.
  # @default -- {}
  annotations: {}
  # serviceAccount.name -- The name of the service account to use. If not set and `create` is true, a name is generated.
  # @default -- null
  name:
