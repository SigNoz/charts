{{- $persistence := .Values.signoz.persistence }}
{{- $sqliteVolume := "" }}
{{- if not .Values.postgresql.enabled }}
{{- if not $persistence.enabled }}
{{- $sqliteVolume = "signoz-db-volume" }}
{{- else if $persistence.existingClaim }}
{{- $sqliteVolume = "signoz-db-existing-claim" }}
{{- else }}
{{- $sqliteVolume = "signoz-db" }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "signoz.fullname" . }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "signoz.labels" . | fromYaml) .Values.signoz.labels)) | nindent 4 }}
  {{- with .Values.signoz.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ include "signoz.fullname" . }}
  replicas: {{ .Values.signoz.replicaCount }}
  selector:
    matchLabels:
      {{- include "signoz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with include "signoz.lib.mergedMap" (dict "maps" (list .Values.signoz.pod.annotations)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "signoz.lib.mergedMap" (dict "maps" (list .Values.signoz.pod.labels) "keep" (include "signoz.selectorLabels" . | fromYaml)) | nindent 8 }}
    spec:
      {{- with include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.signoz.imagePullSecrets)) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "signoz.lib.serviceAccountName" (dict "serviceAccount" .Values.signoz.serviceAccount "fullname" (include "signoz.fullname" .)) }}
      {{- with .Values.signoz.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.signoz.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.signoz.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.signoz.podSecurityContext | nindent 8 }}
      {{- with .Values.signoz.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: signoz
          securityContext:
            {{- toYaml .Values.signoz.containerSecurityContext | nindent 12 }}
          image: {{ include "signoz.lib.image" (dict "registry" .Values.global.imageRegistry "image" .Values.signoz.image "defaultTag" .Chart.AppVersion "name" "signoz.image") }}
          imagePullPolicy: {{ .Values.signoz.image.pullPolicy }}
          {{- with .Values.signoz.extraArgs }}
          args:
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          {{- end }}
          {{- /* SigNoz binds these ports itself; signoz.service ports move only the Service, which targets them by name. */}}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: http-internal
              containerPort: 8085
              protocol: TCP
            - name: opamp-internal
              containerPort: 4320
              protocol: TCP
          {{- $chartEnv := list (include "clickhouse.env" . | fromYamlArray) (include "signoz.telemetryStoreEnv" . | fromYamlArray) }}
          {{- if .Values.postgresql.enabled }}
          {{- $chartEnv = append $chartEnv (include "signoz.postgresqlEnv" . | fromYamlArray) }}
          {{- end }}
          {{- with include "signoz.lib.env" (dict "chart" $chartEnv "user" .Values.signoz.env) }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.signoz.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.signoz.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.signoz.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.signoz.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            {{- with $sqliteVolume }}
            - name: {{ . }}
              mountPath: /var/lib/signoz/
            {{- end }}
            {{- with .Values.signoz.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.signoz.resources | nindent 12 }}
        {{- with .Values.signoz.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or (has $sqliteVolume (list "signoz-db-volume" "signoz-db-existing-claim")) .Values.signoz.extraVolumes }}
      volumes:
        {{- if eq $sqliteVolume "signoz-db-volume" }}
        - name: signoz-db-volume
          emptyDir: {}
        {{- else if eq $sqliteVolume "signoz-db-existing-claim" }}
        - name: signoz-db-existing-claim
          persistentVolumeClaim:
            claimName: {{ $persistence.existingClaim }}
        {{- end }}
        {{- with .Values.signoz.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
  {{- if eq $sqliteVolume "signoz-db" }}
  volumeClaimTemplates:
    - metadata:
        name: signoz-db
      spec:
        accessModes:
          {{- toYaml $persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $persistence.size }}
        {{- with default $persistence.storageClass .Values.global.storageClass }}
        storageClassName: {{ if eq . "-" }}""{{ else }}{{ . }}{{ end }}
        {{- end }}
  {{- end }}
