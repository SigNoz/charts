# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
# Installs the chart, runs helm test, then uninstalls it in the order the README's "Uninstalling the
# chart" documents: the ClickHouse resources go while the operator still runs, then the release, then
# the namespace. A resource or namespace that does not go within its timeout fails the test.
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: signoz
spec:
  timeouts:
    exec: 12m
    delete: 5m
    cleanup: 5m
  steps:
    - name: install
      try:
        - script:
            content: helm install signoz ../.. --namespace $NAMESPACE --wait --timeout 10m
        - script:
            content: helm test signoz --namespace $NAMESPACE --timeout 5m
      catch: &diagnostics
        - events: {}
        - describe:
            apiVersion: v1
            kind: Pod
        - podLogs: {}
    - name: uninstall
      try:
        - delete:
            ref:
              apiVersion: clickhouse-keeper.altinity.com/v1
              kind: ClickHouseKeeperInstallation
              name: signoz-keeper
        - delete:
            ref:
              apiVersion: clickhouse.altinity.com/v1
              kind: ClickHouseInstallation
              name: signoz-clickhouse
        - script:
            content: helm uninstall signoz --namespace $NAMESPACE --wait --timeout 5m
      catch: *diagnostics
