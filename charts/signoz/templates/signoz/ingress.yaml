{{- if .Values.signoz.ingress.enabled }}
{{- $args := dict "name" (include "signoz.fullname" .) }}
{{- $_ := set $args "namespace" (include "signoz.namespace" .) }}
{{- $_ := set $args "labels" (include "signoz.labels" . | fromYaml) }}
{{- $_ := set $args "ingress" .Values.signoz.ingress }}
{{- $_ := set $args "port" .Values.signoz.service.port }}
{{- include "signoz.lib.ingress" $args }}
{{- end }}
