{{- /*
Values keys that no longer do anything at these paths (removed, or moved to a new path).
Fail the render instead of ignoring them, so an old values file is caught at `helm upgrade` time rather than silently misapplied.
*/ -}}
{{- if hasKey (.Values.clickhouse | default dict) "clickhouseOperator" }}
{{- fail "`clickhouse.clickhouseOperator` is no longer a supported value. The operator is installed from Altinity's chart; its settings live at `altinity-clickhouse-operator.*` (top level, Altinity's keys); `altinity-clickhouse-operator.enabled: false` skips it." }}
{{- end }}
{{- if hasKey (.Values.clickhouse | default dict) "altinity-clickhouse-operator" }}
{{- fail "operator values moved from `clickhouse.altinity-clickhouse-operator.*` to `altinity-clickhouse-operator.*` (top level)." }}
{{- end }}
{{- if hasKey (.Values.clickhouse | default dict) "zookeeper" }}
{{- fail "ZooKeeper values moved from `clickhouse.zookeeper.*` to `zookeeper.*` (top level); `clickhouse.externalZookeeper` is unchanged." }}
{{- end }}
{{- /*
ClickHouse in another namespace with no operator in this release watching it.
This only catches values that contradict themselves (the CHI would never be reconciled); it does not
enforce a layout. Any of: operator disabled here, operator moved next to ClickHouse via namespaceOverride,
or operator kept in the release namespace and pointed at ClickHouse via watchNamespaces + cluster-scoped RBAC.
*/ -}}
{{- if and .Values.clickhouse.enabled .Values.clickhouse.namespace (ne .Values.clickhouse.namespace .Release.Namespace) (eq (include "clickhouse.operatorEnabled" .) "true") }}
{{- $ns := .Values.clickhouse.namespace }}
{{- $op := index .Values "altinity-clickhouse-operator" | default dict }}
{{- $nextToClickHouse := eq ($op.namespaceOverride | default "") $ns }}
{{- $watchesClickHouse := and (has $ns ($op.watchNamespaces | default list)) (not (dig "rbac" "namespaceScoped" true $op)) }}
{{- if not (or $nextToClickHouse $watchesClickHouse) }}
{{- fail (printf "`clickhouse.namespace` is set to `%s` but no operator in this release will watch it, so the ClickHouseInstallation would never be reconciled. Either run the operator next to ClickHouse (`altinity-clickhouse-operator.namespaceOverride: %s`, the layout older chart versions used), or keep the operator in the release namespace and point it at ClickHouse (`altinity-clickhouse-operator.watchNamespaces: [\"%s\"]` plus `altinity-clickhouse-operator.rbac.namespaceScoped: false`)." $ns $ns $ns) }}
{{- end }}
{{- end }}
