# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/configuration-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Configuration
metadata:
  name: configuration
spec:
  # Tests of one chart share a cluster: two signoz installs at once would race on the
  # cluster-wide ClickHouse operator CRDs, so scenarios run one at a time.
  parallel: 1
  timeouts:
    assert: 6m0s
    cleanup: 5m0s
    delete: 5m0s
    error: 5m0s
    apply: 15s
    # Every command is a helm call bounded by its own --timeout 5m; a slower one sets its own timeout.
    exec: 6m0s
  # Diagnostics collected automatically on ANY test failure, giving every test a
  # consistent baseline without per-test boilerplate. Per-test `catch` blocks still
  # run in addition to these and may add test-specific collectors.
  catch:
    # Namespace events first: these surface scheduling, image-pull and volume-mount
    # failures that pod logs cannot show (e.g. a pod stuck in ContainerCreating).
    - events: {}
    # Describe every pod in the test namespace, with its events, so a pod that never
    # started - and therefore has no logs - still yields a diagnosable reason.
    - describe:
        apiVersion: v1
        kind: Pod
        showEvents: true
    # Logs of every pod in the test namespace: each test installs its chart there,
    # operators included, so a failed reconcile is explained by what they logged.
    - podLogs: {}
