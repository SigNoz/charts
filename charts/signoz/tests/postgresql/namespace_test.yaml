# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: postgresql/namespace
templates:
  - templates/postgresql/statefulset.yaml
  - templates/postgresql/service.yaml
  - templates/postgresql/serviceaccount.yaml
  - templates/postgresql/secret.yaml
  - templates/postgresql/restore-configmap.yaml
  - templates/postgresql/upgrade-backup-job.yaml
set:
  postgresql.enabled: true
tests:
  - it: places the Postgres StatefulSet, Service, ServiceAccount, Secret, restore ConfigMap and upgrade backup Job in the release namespace
    release:
      namespace: obs
      upgrade: true
    asserts:
      - template: templates/postgresql/statefulset.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/postgresql/service.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/postgresql/serviceaccount.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/postgresql/secret.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/postgresql/restore-configmap.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/postgresql/upgrade-backup-job.yaml
        equal:
          path: metadata.namespace
          value: obs
