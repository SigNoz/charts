# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: upgrade-contract/migrator
templates:
  - templates/validate.yaml
tests:
  - it: rejects telemetryStoreMigrator.upgradeHelmHooks true
    set:
      telemetryStoreMigrator.upgradeHelmHooks: true
    asserts:
      - failedTemplate:
          errorPattern: "telemetryStoreMigrator\\.upgradeHelmHooks"
  - it: renders an old values file that sets telemetryStoreMigrator.upgradeHelmHooks false
    set:
      telemetryStoreMigrator.upgradeHelmHooks: false
    asserts:
      - notFailedTemplate: {}
