# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: migrator/namespace
templates:
  - templates/telemetrystore-migrator/job.yaml
  - templates/telemetrystore-migrator/serviceaccount.yaml
tests:
  - it: places the migrator Job and ServiceAccount in the release namespace
    release:
      namespace: obs
      revision: 1
    set:
      telemetryStoreMigrator.serviceAccount.create: true
    asserts:
      - template: templates/telemetrystore-migrator/job.yaml
        equal:
          path: metadata.namespace
          value: obs
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        equal:
          path: metadata.namespace
          value: obs
