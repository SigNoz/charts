{{- if .Values.telemetryStoreMigrator.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  {{- /* A Job's pod template is immutable, so every release revision gets a new Job, and the migrations run again on every upgrade. */}}
  name: {{ include "telemetryStoreMigrator.fullname" . }}-{{ .Release.Revision }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "telemetryStoreMigrator.selectorLabels" . | fromYaml) .Values.telemetryStoreMigrator.labels)) | nindent 4 }}
  annotations:
    {{- toYaml (mergeOverwrite (dict "argocd.argoproj.io/sync-options" "Force=true,Replace=true") (.Values.telemetryStoreMigrator.annotations | default dict)) | nindent 4 }}
spec:
  {{- /* 0 deletes the Job as soon as it finishes; only an unset value keeps it. */}}
  {{- if not (kindIs "invalid" .Values.telemetryStoreMigrator.ttlSecondsAfterFinished) }}
  ttlSecondsAfterFinished: {{ .Values.telemetryStoreMigrator.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "signoz.lib.mergedMap" (dict "maps" (list .Values.telemetryStoreMigrator.pod.labels) "keep" (include "telemetryStoreMigrator.selectorLabels" . | fromYaml)) | nindent 8 }}
      {{- with include "signoz.lib.mergedMap" (dict "maps" (list .Values.telemetryStoreMigrator.pod.annotations)) }}
      annotations:
        {{- . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.telemetryStoreMigrator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.telemetryStoreMigrator.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "telemetryStoreMigrator.serviceAccountName" . }}
      {{- with include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.otelCollector.imagePullSecrets)) }}
      {{- . | nindent 6 }}
      {{- end }}
      {{- /* The steps run in this order, and the Job completes when async does; the collector's check waits only for sync. */}}
      initContainers:
        {{- include "telemetryStoreMigrator.migration" (dict "name" "ready" "args" (list "migrate" "ready") "context" $) | nindent 8 }}
        {{- include "telemetryStoreMigrator.migration" (dict "name" "bootstrap" "args" (list "migrate" "bootstrap") "context" $) | nindent 8 }}
        {{- include "telemetryStoreMigrator.migration" (dict "name" "sync" "args" (list "migrate" "sync" "up") "context" $) | nindent 8 }}
      containers:
        {{- include "telemetryStoreMigrator.migration" (dict "name" "async" "args" (list "migrate" "async" "up") "context" $) | nindent 8 }}
      {{- with .Values.telemetryStoreMigrator.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: OnFailure
{{- end }}
