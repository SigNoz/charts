{{- $service := .Values.otelCollector.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otelCollector.fullname" . }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "otelCollector.labels" . | fromYaml) $service.labels)) | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  {{- if and (eq $service.type "LoadBalancer") $service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges:
    {{- range $service.loadBalancerSourceRanges }}
    - {{ . }}
    {{- end }}
  {{- end }}
  ports:
    {{- range $name, $port := .Values.otelCollector.ports }}
    {{- if $port.enabled }}
    - name: {{ $name }}
      port: {{ $port.servicePort }}
      targetPort: {{ $name }}
      protocol: {{ $port.protocol }}
      {{- if eq $service.type "ClusterIP" }}
      {{- /* null clears a nodePort the API server kept from an earlier NodePort type */}}
      nodePort: null
      {{- else if eq $service.type "NodePort" }}
      nodePort: {{ $port.nodePort }}
      {{- end }}
    {{- end }}
    {{- end }}
  selector:
    {{- include "otelCollector.selectorLabels" . | nindent 4 }}
