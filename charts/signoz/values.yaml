# -- External ClickHouse configuration. Required when `clickhouse.enabled` is false, and used only then.
# @section -- External ClickHouse
externalClickhouse:
  # -- Host of the external ClickHouse.
  # @default -- null
  # @section -- External ClickHouse
  host:
  # -- Cluster of the external ClickHouse that the migrator creates SigNoz's tables on and SigNoz queries.
  # @default -- "cluster"
  # @section -- External ClickHouse
  cluster: cluster
  # -- Database the collector writes metrics to.
  # @default -- "signoz_metrics"
  # @section -- External ClickHouse
  database: signoz_metrics
  # -- Database the collector writes traces to.
  # @default -- "signoz_traces"
  # @section -- External ClickHouse
  traceDatabase: signoz_traces
  # -- Database the collector writes logs to.
  # @default -- "signoz_logs"
  # @section -- External ClickHouse
  logDatabase: signoz_logs
  # -- Database the collector writes meter data to.
  # @default -- "signoz_meter"
  # @section -- External ClickHouse
  meterDatabase: signoz_meter
  # -- User the components connect as.
  # @default -- ""
  # @section -- External ClickHouse
  user: ""
  # -- Password of `externalClickhouse.user`, written into the Secret `<clickhouse.fullname>-credentials` that the
  # components read. Ignored when `externalClickhouse.existingSecret` is set.
  # @default -- ""
  # @section -- External ClickHouse
  password: ""
  # -- Name of a Secret you created that holds the password of `externalClickhouse.user`. When set, the chart
  # creates no Secret and the components read this one.
  # @default -- null
  # @section -- External ClickHouse
  existingSecret:
  # -- Key of the password inside `externalClickhouse.existingSecret`.
  # @default -- "password"
  # @section -- External ClickHouse
  existingSecretPasswordKey: password
  # -- Connect to an external ClickHouse behind TLS by appending `?secure=true` to the SigNoz and migrator connection strings.
  # Set `externalClickhouse.tcpPort` to its secure port, usually 9440, and add the same parameters to the exporter connection strings in `otelCollector.config`.
  # @default -- false
  # @section -- External ClickHouse
  secure: false
  # -- Verify the server's TLS certificate when `externalClickhouse.secure` is true. False appends
  # `&skip_verify=true` to the SigNoz and migrator connection strings. Add it to the exporter connection strings in `otelCollector.config` yourself.
  # @default -- false
  # @section -- External ClickHouse
  verify: false
  # -- HTTP port of the external ClickHouse.
  # @default -- 8123
  # @section -- External ClickHouse
  httpPort: 8123
  # -- Native TCP port of the external ClickHouse.
  # @default -- 9000
  # @section -- External ClickHouse
  tcpPort: 9000
signoz:
  # -- Name of the SigNoz component, the `app.kubernetes.io/component` selector label. An upgrade cannot change it.
  # @section -- SigNoz
  name: "signoz"
  # -- Number of replicas. With SQLite, each replica has its own database.
  # @section -- SigNoz
  replicaCount: 1
  image:
    # -- Image repository, with its registry. `global.imageRegistry` replaces that registry when set.
    # @section -- SigNoz
    repository: docker.io/signoz/signoz
    # -- Image tag. Empty means the chart's `appVersion`.
    # @section -- SigNoz
    tag: v0.151.0
    # -- Image pull policy.
    # @section -- SigNoz
    pullPolicy: IfNotPresent
  # -- Image pull secrets for the SigNoz Pod.
  # @section -- SigNoz
  imagePullSecrets: []
  serviceAccount:
    # -- Create a ServiceAccount.
    # @section -- SigNoz
    create: true
    # -- Annotations to add to the ServiceAccount.
    # @section -- SigNoz
    annotations: {}
    # -- Name of the ServiceAccount. Empty means the release's full name when `create` is true, and `default` otherwise.
    # @default -- "the release's full name, or default"
    # @section -- SigNoz
    name:
  service:
    # -- Annotations to add to the Service.
    # @section -- SigNoz Networking
    annotations: {}
    # -- Labels to add to the Service. A key that matches a chart label replaces it.
    # @section -- SigNoz Networking
    labels: {}
    # -- Kubernetes Service type: `ClusterIP`, `NodePort` or `LoadBalancer`.
    # @section -- SigNoz Networking
    type: ClusterIP
    # -- Service port of the HTTP API and UI. The container port stays 8080.
    # @section -- SigNoz Networking
    port: 8080
    # -- Service port for the internal API. The container port stays 8085.
    # @section -- SigNoz Networking
    internalPort: 8085
    # -- Service port for OpAMP. The container port stays 4320.
    # @section -- SigNoz Networking
    opampPort: 4320
    # -- NodePort for HTTP. Only used when `signoz.service.type` is `NodePort`.
    # @default -- "chosen by the cluster"
    # @section -- SigNoz Networking
    nodePort: null
    # -- NodePort for the internal API. Only used when `signoz.service.type` is `NodePort`.
    # @default -- "chosen by the cluster"
    # @section -- SigNoz Networking
    internalNodePort: null
    # -- NodePort for OpAMP. Only used when `signoz.service.type` is `NodePort`.
    # @default -- "chosen by the cluster"
    # @section -- SigNoz Networking
    opampInternalNodePort: null
  # -- Annotations to add to the StatefulSet.
  # @default -- "no annotations"
  # @section -- SigNoz
  annotations:
  # -- Labels to add to the StatefulSet. A key that matches a chart label replaces it.
  # @section -- SigNoz
  labels: {}
  # -- Extra arguments for the container, added after the image's own.
  # @section -- SigNoz
  extraArgs: []
  # -- Extra environment variables for the container, as `NAME: value`. A key named like a variable the chart sets replaces it.
  # A string, number or boolean is the value. A map is the rest of the EnvVar, such as `valueFrom`.
  # The names follow the SigNoz configuration: `provider` under `telemetry_store` is `signoz_telemetrystore_provider`.
  # When a key is set in both cases, the lower-case one wins. Set a default to `null` to remove it.
  # All names: https://github.com/SigNoz/signoz/blob/main/conf/example.yaml
  # @raw
  # A plain value and a value from a Secret:
  #
  #   ```yaml
  #   MY_KEY: my-value
  #   SECRET_KEY:
  #     valueFrom:
  #       secretKeyRef:
  #         name: my-secret
  #         key: my-key
  #   ```
  #
  # @default -- "the five SigNoz settings in values.yaml"
  # @section -- SigNoz
  env:
    signoz_telemetrystore_provider: clickhouse
    # ClickHouse URL is set and applied internally. Don't override unless you know what you are doing.
    # signoz_telemetrystore_clickhouse_dsn: tcp://clickhouse_operator:clickhouse_operator_password@my-release-clickhouse:9000/signoz_traces

    # Enable SMTP for user invitations. For more details see: https://signoz.io/docs/manage/administrator-guide/configuration/smtp-email-invitations/
    signoz_emailing_enabled: false
    # To enable/disable the active query tracker.
    signoz_prometheus_active__query__tracker_enabled: false
    # signoz alertemanager configuration
    # For more details see: https://signoz.io/docs/manage/administrator-guide/configuration/alertmanager/
    signoz_alertmanager_provider: signoz
    # The URL under which Alertmanager is externally reachable, Used for generating relative and absolute links back to Alertmanager itself.
    signoz_alertmanager_signoz_external__url: http://localhost:8080
  # -- Sources of extra environment variables for the container.
  # A variable of the same name in `signoz.env` or set by the chart takes precedence.
  # @section -- SigNoz
  envFrom: []
  # -- Security context for the Pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- SigNoz
  podSecurityContext: {}
  pod:
    # -- Annotations to add to the Pod.
    # @section -- SigNoz
    annotations: {}
    # -- Labels to add to the Pod. A key named like a selector label is ignored.
    # @section -- SigNoz
    labels: {}
  # -- Security context for the container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- SigNoz
  containerSecurityContext: {}
  # -- Extra volume mounts for the container.
  # @section -- SigNoz
  extraVolumeMounts: []
  # -- Extra volumes for the Pod.
  # @section -- SigNoz
  extraVolumes: []
  # -- Extra init containers for the Pod.
  # @section -- SigNoz
  extraInitContainers: []
  # -- Extra containers for the Pod.
  # The SQLite database is on the PVC `signoz-db`, mounted at `/var/lib/signoz`.
  # @section -- SigNoz
  extraContainers: []
  # -- Liveness probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`. Set a field to `null` to drop it.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "an HTTP GET of /api/v1/health on port http"
  # @section -- SigNoz
  livenessProbe:
    httpGet:
      port: http
      path: /api/v1/health
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # -- Readiness probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`. Set a field to `null` to drop it.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "an HTTP GET of /api/v1/health?live=1 on port http"
  # @section -- SigNoz
  readinessProbe:
    httpGet:
      port: http
      path: /api/v1/health?live=1
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # -- Startup probe for the container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "no startup probe"
  # @section -- SigNoz
  startupProbe: {}
  ingress:
    # -- Create an Ingress for SigNoz.
    # @section -- SigNoz Networking
    enabled: false
    # -- IngressClass of the Ingress.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
    # @section -- SigNoz Networking
    className: ""
    # -- Annotations to add to the Ingress.
    # @section -- SigNoz Networking
    annotations: {}
    # -- Hosts and paths of the Ingress.
    # A path without `port` routes to `signoz.service.port`, and a path without `pathType` gets `ImplementationSpecific`.
    # @default -- "the host signoz.domain.com, with the path / on port 8080"
    # @section -- SigNoz Networking
    hosts:
      - host: signoz.domain.com
        paths:
          - path: /
            pathType: ImplementationSpecific
            port: 8080
    # -- TLS settings of the Ingress, as entries with `hosts` and an optional `secretName`.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
    # @section -- SigNoz Networking
    tls: []
  # -- Resource requests and limits for the container.
  # @default -- "requests of 100m CPU and 100Mi of memory"
  # @section -- SigNoz
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  # -- PriorityClass of the Pod.
  # @default -- "no PriorityClass"
  # @section -- SigNoz
  priorityClassName: ""
  # -- Node labels for Pod assignment.
  # @section -- SigNoz
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @section -- SigNoz
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @section -- SigNoz
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @section -- SigNoz
  topologySpreadConstraints: []
  persistence:
    # -- Enable persistence with a PersistentVolumeClaim. When false, the SQLite database is in an `emptyDir`.
    # Ignored when `postgresql.enabled` is true.
    # @section -- SigNoz
    enabled: true
    # -- Name of an existing PVC to use. Only used when `signoz.persistence.enabled` is true.
    # @default -- "none, the chart's volume claim template"
    # @section -- SigNoz
    existingClaim: ""
    # -- StorageClass of the PVC. `-` disables dynamic provisioning, and `global.storageClass` overrides it.
    # @default -- "the cluster's default StorageClass"
    # @section -- SigNoz
    storageClass: null
    # -- Access modes of the PVC.
    # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
    # @section -- SigNoz
    accessModes:
      - ReadWriteOnce
    # -- Size of the PVC.
    # @section -- SigNoz
    size: 1Gi
# -- Telemetry store migrator configuration.
# @section -- Telemetry Store Migrator
# @default -- "Please checkout the default values in values.yml"
telemetryStoreMigrator:
  # -- Enable the telemetry store migrator, a Job that runs on every install and upgrade.
  # The collector's `check` init container waits for its migrations.
  # @section -- Telemetry Store Migrator
  enabled: true
  # -- Name of the migrator component. The Job is named `<name>-<release revision>`. At most 57 characters.
  # @section -- Telemetry Store Migrator
  name: "signoz-telemetrystore-migrator"
  # -- Annotations added to the Job, merged over the chart's `argocd.argoproj.io/sync-options: Force=true,Replace=true`. A value for that key replaces the chart's.
  # @default -- {}
  # @section -- Telemetry Store Migrator
  annotations: {}
  # -- Labels to add to the Job. A key the chart also sets takes your value.
  # @section -- Telemetry Store Migrator
  labels: {}
  pod:
    # -- Labels to add to the Pod. A key the chart also sets keeps the chart's value.
    # @section -- Telemetry Store Migrator
    labels: {}
    # -- Annotations to add to the Pod.
    # @section -- Telemetry Store Migrator
    annotations: {}
  # -- Enable replication in the migrations.
  # @default -- true
  # @section -- Telemetry Store Migrator
  enableReplication: true
  # -- Timeout of the migration.
  # @default -- "10m"
  # @section -- Telemetry Store Migrator
  timeout: "10m"
  # -- (int) Seconds Kubernetes keeps a finished migrator Job, and its logs, before deleting it.
  # Set it (for example `604800`) to clean up Jobs a failed upgrade leaves behind. Leave it unset under Argo CD, which recreates a deleted Job
  # and re-runs the migrator.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/ttlafterfinished/
  # @default -- null
  # @section -- Telemetry Store Migrator
  ttlSecondsAfterFinished:
  # -- Node labels for Pod assignment.
  # @section -- Telemetry Store Migrator
  # @default -- {}
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @section -- Telemetry Store Migrator
  # @default -- []
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @section -- Telemetry Store Migrator
  # @default -- {}
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @section -- Telemetry Store Migrator
  # @default -- []
  topologySpreadConstraints: []
  # -- PriorityClass of the Pod.
  # @section -- Telemetry Store Migrator
  priorityClassName: ""
  # -- Security context for the Pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- Telemetry Store Migrator
  podSecurityContext: {}
  # -- Resource requests and limits for the migration containers and the collector's `check` init container.
  # @section -- Telemetry Store Migrator
  resources: {}
  # -- Security context for the migration containers.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- Telemetry Store Migrator
  containerSecurityContext: {}
  # -- Extra environment variables for the migration containers and the collector's `check` init container.
  # An entry named like one the chart sets replaces it.
  # @section -- Telemetry Store Migrator
  env: []
  # -- Sources of extra environment variables for the migration containers and the collector's `check` init container.
  # @section -- Telemetry Store Migrator
  envFrom: []
  # -- Extra volumes for the Pod.
  # @section -- Telemetry Store Migrator
  extraVolumes: []
  # -- Extra volume mounts for the migration containers.
  # @section -- Telemetry Store Migrator
  extraVolumeMounts: []
  # -- ServiceAccount of the migrator Job; by default none is created and the Job runs as `default`.
  # Set `create: true` when a policy or credential is bound to a ServiceAccount. On an install from a chart before 1.0.0, first delete
  # the old `signoz-telemetrystore-migrator` ServiceAccount or upgrade with `--take-ownership`.
  # @section -- Telemetry Store Migrator
  serviceAccount:
    # -- Create a ServiceAccount.
    # @section -- Telemetry Store Migrator
    create: false
    # -- Annotations to add to the ServiceAccount.
    # @section -- Telemetry Store Migrator
    annotations: {}
    # -- Name of the ServiceAccount to create, or of an existing one to run as when `create` is false.
    # @section -- Telemetry Store Migrator
    name:
# -- OpenTelemetry Collector configuration.
# @section -- Otel Collector
# @default -- "Please checkout the default values in values.yml"
otelCollector:
  # -- Name of the collector component.
  # @default -- "otel-collector"
  # @section -- Otel Collector
  name: "otel-collector"
  image:
    # -- Image repository, with its registry. `global.imageRegistry` replaces that registry when set.
    # @section -- Otel Collector
    repository: docker.io/signoz/signoz-otel-collector
    # -- Image tag.
    # @section -- Otel Collector
    tag: v0.144.16
    # -- Image pull policy.
    # @section -- Otel Collector
    pullPolicy: IfNotPresent
  # -- Image pull secrets for the collector Pod, as a list of Secret names.
  # @section -- Otel Collector
  imagePullSecrets: []
  # -- Deployment strategy.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#strategy
  # @section -- Otel Collector
  # @default -- "RollingUpdate"
  strategy: ""
  # -- Extra arguments for the container, added after the chart's `--config`, `--manager-config` and `--copy-path`.
  # @section -- Otel Collector
  extraArgs: []
  configMap:
    # -- Create a ConfigMap.
    # @section -- Otel Collector
    create: true
  serviceAccount:
    # -- Create a ServiceAccount.
    # @section -- Otel Collector
    create: true
    # -- Annotations to add to the ServiceAccount.
    # @section -- Otel Collector
    annotations: {}
    # -- Name of the ServiceAccount. When empty and `create` is true, the chart generates one.
    # @section -- Otel Collector
    name:
  service:
    # -- Annotations to add to the Service.
    # @section -- Otel Collector Networking
    annotations: {}
    # -- Labels to add to the Service.
    # @section -- Otel Collector Networking
    labels: {}
    # -- Kubernetes Service type: `ClusterIP`, `NodePort` or `LoadBalancer`.
    # @section -- Otel Collector Networking
    type: ClusterIP
    # -- Source ranges allowed when the Service type is `LoadBalancer`.
    # @section -- Otel Collector Networking
    loadBalancerSourceRanges: []
  # -- Annotations to add to the Deployment.
  # @section -- Otel Collector
  # @default -- null
  annotations:
  # -- Labels to add to the Deployment. A key that repeats a chart label replaces its value.
  # @section -- Otel Collector
  labels: {}
  pod:
    # -- Annotations to add to the Pod. Set a key to `null` to drop a default.
    # A `checksum/config` key is ignored.
    # @section -- Otel Collector
    annotations:
      signoz.io/scrape: 'true'
      signoz.io/port: '8888'
    # -- Labels to add to the Pod. A key named like a selector label is ignored.
    # @section -- Otel Collector
    labels: {}
  # -- Extra environment variables for the container. An entry named like one the chart sets replaces it.
  # The chart sets the `CLICKHOUSE_*` and `K8S_*` variables and `LOW_CARDINAL_EXCEPTION_GROUPING`.
  # @raw
  # Group exceptions with low cardinality:
  #
  #   ```yaml
  #   - name: LOW_CARDINAL_EXCEPTION_GROUPING
  #     value: "true"
  #   ```
  #
  # @section -- Otel Collector
  env: []
  # -- Sources of extra environment variables for the container.
  # @section -- Otel Collector
  envFrom: []
  # -- Seconds a new Pod must be ready before it counts as available.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#min-ready-seconds
  # @section -- Otel Collector
  # @default -- 5
  minReadySeconds: 5
  # -- Seconds the Deployment may take to progress before it is marked failed.
  # Ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#progress-deadline-seconds
  # @section -- Otel Collector
  # @default -- 600
  progressDeadlineSeconds: 600
  # -- Number of replicas.
  # @section -- Otel Collector
  # @default -- 1
  replicaCount: 1
  clusterRole:
    # -- Create a ClusterRole.
    # @section -- Otel Collector
    create: true
    # -- Annotations to add to the ClusterRole.
    # @section -- Otel Collector
    annotations: {}
    # -- Name of the ClusterRole. When empty, the chart generates one.
    # @section -- Otel Collector
    name: ""
    # -- RBAC rules of the ClusterRole. The `k8sattributes` processor requires them.
    # @default -- "See values.yaml"
    # @section -- Otel Collector
    rules:
      - apiGroups: [""]
        resources: ["pods", "namespaces", "nodes"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["apps"]
        resources: ["replicasets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["extensions"]
        resources: ["replicasets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["batch"]
        resources: ["jobs"]
        verbs: ["get", "list", "watch"]
    clusterRoleBinding:
      # -- Annotations to add to the ClusterRoleBinding.
      # @section -- Otel Collector
      annotations: {}
      # -- Name of the ClusterRoleBinding. When empty, the chart generates one.
      # @section -- Otel Collector
      name: ""
  # -- Port configuration. Each entry is a port of the collector container and of its Service.
  # An entry of your own needs `enabled`, `containerPort`, `servicePort` and `protocol`. Its name is a port name of at most 15 characters.
  # @section -- Otel Collector Ports
  # @default -- "Please checkout the default values in values.yml"
  ports:
    otlp:
      # -- Enable the Service port for OTLP gRPC.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for OTLP gRPC.
      # @section -- Otel Collector Ports
      containerPort: 4317
      # -- Service port for OTLP gRPC.
      # @section -- Otel Collector Ports
      servicePort: 4317
      # -- NodePort for OTLP gRPC.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for OTLP gRPC.
      # @section -- Otel Collector Ports
      protocol: TCP
    otlp-http:
      # -- Enable the Service port for OTLP HTTP.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for OTLP HTTP.
      # @section -- Otel Collector Ports
      containerPort: 4318
      # -- Service port for OTLP HTTP.
      # @section -- Otel Collector Ports
      servicePort: 4318
      # -- NodePort for OTLP HTTP.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for OTLP HTTP.
      # @section -- Otel Collector Ports
      protocol: TCP
    jaeger-thrift:
      # -- Enable the Service port for Jaeger Thrift.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for Jaeger Thrift.
      # @section -- Otel Collector Ports
      containerPort: 14268
      # -- Service port for Jaeger Thrift.
      # @section -- Otel Collector Ports
      servicePort: 14268
      # -- NodePort for Jaeger Thrift.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for Jaeger Thrift.
      # @section -- Otel Collector Ports
      protocol: TCP
    jaeger-grpc:
      # -- Enable the Service port for Jaeger gRPC.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for Jaeger gRPC.
      # @section -- Otel Collector Ports
      containerPort: 14250
      # -- Service port for Jaeger gRPC.
      # @section -- Otel Collector Ports
      servicePort: 14250
      # -- NodePort for Jaeger gRPC.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for Jaeger gRPC.
      # @section -- Otel Collector Ports
      protocol: TCP
    metrics:
      # -- Enable the Service port for internal metrics.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for internal metrics.
      # @section -- Otel Collector Ports
      containerPort: 8888
      # -- Service port for internal metrics.
      # @section -- Otel Collector Ports
      servicePort: 8888
      # -- NodePort for internal metrics.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for internal metrics.
      # @section -- Otel Collector Ports
      protocol: TCP
    zpages:
      # -- Enable the Service port for zPages.
      # @section -- Otel Collector Ports
      enabled: false
      # -- Container port for zPages.
      # @section -- Otel Collector Ports
      containerPort: 55679
      # -- Service port for zPages.
      # @section -- Otel Collector Ports
      servicePort: 55679
      # -- NodePort for zPages.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for zPages.
      # @section -- Otel Collector Ports
      protocol: TCP
    pprof:
      # -- Enable the Service port for pprof.
      # @section -- Otel Collector Ports
      enabled: false
      # -- Container port for pprof.
      # @section -- Otel Collector Ports
      containerPort: 1777
      # -- Service port for pprof.
      # @section -- Otel Collector Ports
      servicePort: 1777
      # -- NodePort for pprof.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for pprof.
      # @section -- Otel Collector Ports
      protocol: TCP
    logsheroku:
      # -- Enable the Service port for Heroku logs.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for Heroku logs.
      # @section -- Otel Collector Ports
      containerPort: 8081
      # -- Service port for Heroku logs.
      # @section -- Otel Collector Ports
      servicePort: 8081
      # -- NodePort for Heroku logs.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for Heroku logs.
      # @section -- Otel Collector Ports
      protocol: TCP
    logsjson:
      # -- Enable the Service port for JSON logs.
      # @section -- Otel Collector Ports
      enabled: true
      # -- Container port for JSON logs.
      # @section -- Otel Collector Ports
      containerPort: 8082
      # -- Service port for JSON logs.
      # @section -- Otel Collector Ports
      servicePort: 8082
      # -- NodePort for JSON logs.
      # @section -- Otel Collector Ports
      nodePort: ""
      # -- Protocol for JSON logs.
      # @section -- Otel Collector Ports
      protocol: TCP
  # -- Liveness probe for the container. `null` renders none.
  # A handler other than `httpGet` must also set `httpGet: null`.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "httpGet on port 13133, path /"
  # @section -- Otel Collector
  livenessProbe:
    httpGet:
      port: 13133
      path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # -- Readiness probe for the container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "httpGet on port 13133, path /"
  # @section -- Otel Collector
  readinessProbe:
    httpGet:
      port: 13133
      path: /
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  # -- Startup probe for the container. It holds the liveness and readiness probes back until it succeeds.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
  # @default -- "no startup probe"
  # @section -- Otel Collector
  startupProbe: {}
  # -- Extra volume mounts for the collector container and its `check` init container.
  # @section -- Otel Collector
  extraVolumeMounts: []
  # -- Extra volumes for the Pod.
  # @section -- Otel Collector
  # @default -- []
  extraVolumes: []
  ingress:
    # -- Create an Ingress for the collector.
    # @section -- Otel Collector Networking
    enabled: false
    # -- IngressClass of the Ingress.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#ingress-class
    # @section -- Otel Collector Networking
    className: ""
    # -- Annotations to add to the Ingress.
    # @section -- Otel Collector Networking
    annotations: {}
    # -- Hosts and paths of the Ingress.
    # @default -- "Please checkout the default values in values.yml"
    # @section -- Otel Collector Networking
    hosts:
      - host: otelcollector.domain.com
        paths:
          - path: /
            pathType: ImplementationSpecific
            port: 4318
    # -- TLS settings of the Ingress.
    # Ref: https://kubernetes.io/docs/concepts/services-networking/ingress/#tls
    # @section -- Otel Collector Networking
    tls: []
    #  - secretName: chart-example-tls
    #    hosts:
    #      - otelcollector.domain.com
  # -- Resource requests and limits for the container.
  # @section -- Otel Collector
  # @default -- { requests: { cpu: "100m", memory: "200Mi" } }
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  #   limits:
  #     cpu: "1"
  #     memory: 2Gi

  # -- PriorityClass of the Pod.
  # @section -- Otel Collector
  # @default -- ""
  priorityClassName: ""
  # -- Node labels for Pod assignment.
  # @section -- Otel Collector
  # @default -- {}
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @section -- Otel Collector
  # @default -- []
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @section -- Otel Collector
  # @default -- {}
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @section -- Otel Collector
  # @default -- "Please checkout the default values in values.yml"
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: otel-collector
  # -- Security context for the Pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- Otel Collector
  # @default -- {}
  podSecurityContext: {}
  # fsGroup: 2000

  # -- Security context for the collector container and its `check` init container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @section -- Otel Collector
  containerSecurityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

  autoscaling:
    # -- Enable autoscaling with a HorizontalPodAutoscaler (HPA).
    # Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
    # @section -- Otel Collector
    enabled: false
    # -- Minimum number of replicas.
    # @section -- Otel Collector
    minReplicas: 1
    # -- Maximum number of replicas.
    # @section -- Otel Collector
    maxReplicas: 11
    # -- Target CPU utilization percentage.
    # @section -- Otel Collector
    targetCPUUtilizationPercentage: 50
    # -- Target memory utilization percentage.
    # @section -- Otel Collector
    targetMemoryUtilizationPercentage: 50
    # -- Scaling behavior policies.
    # @section -- Otel Collector
    behavior: {}
    # scaleDown:
    #   stabilizationWindowSeconds: 300
    #  policies:
    #   - type: Pods
    #     value: 1
    #     periodSeconds: 180
    # scaleUp:
    #   stabilizationWindowSeconds: 300
    #   policies:
    #   - type: Pods
    #     value: 2
    #     periodSeconds: 60

    # -- Template for autoscaling.
    # @section -- Otel Collector
    autoscalingTemplate: []
    keda:
      # -- Annotations to add to the KEDA ScaledObject.
      # @section -- Otel Collector
      annotations:
      # -- Enable autoscaling with KEDA.
      # @section -- Otel Collector
      enabled: false
      # -- Polling interval for metrics data, in seconds.
      # @section -- Otel Collector
      pollingInterval: "30"
      # -- Cooldown period before scaling down, in seconds.
      # @section -- Otel Collector
      cooldownPeriod: "300"
      # -- Minimum replica count for KEDA.
      # @section -- Otel Collector
      minReplicaCount: "1"
      # -- Maximum replica count for KEDA.
      # @section -- Otel Collector
      maxReplicaCount: "5"
      # -- KEDA trigger configuration.
      # @section -- Otel Collector
      triggers: []
  # -- OpenTelemetry Collector pipeline configuration.
  # @section -- Otel Collector Configuration
  # @default -- "Please checkout the default values in values.yml"
  config:
    connectors:
      signozmeter:
        metrics_flush_interval: 1h
        dimensions:
          - name: service.name
          - name: deployment.environment
          - name: host.name
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 16
          http:
            endpoint: 0.0.0.0:4318
      jaeger:
        protocols:
          grpc:
            endpoint: 0.0.0.0:14250
          thrift_http:
            endpoint: 0.0.0.0:14268
      httplogreceiver/heroku:
        endpoint: 0.0.0.0:8081
        source: heroku
      httplogreceiver/json:
        endpoint: 0.0.0.0:8082
        source: json
    processors:
      batch:
        send_batch_size: 50000
        timeout: 1s
      batch/meter:
        send_batch_max_size: 25000
        send_batch_size: 20000
        timeout: 1s
      # Memory Limiter processor. If not set, it will be overridden with values based on k8s resource limits.
      # ref: https://github.com/open-telemetry/opentelemetry-collector/blob/main/processor/memorylimiterprocessor/README.md
      # memory_limiter: null
      signozspanmetrics/delta:
        metrics_exporter: signozclickhousemetrics
        latency_histogram_buckets: [100us, 1ms, 2ms, 6ms, 10ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 1400ms, 2000ms, 5s, 10s, 20s, 40s, 60s]
        dimensions_cache_size: 100000
        dimensions:
          - name: service.namespace
            default: default
          - name: deployment.environment
            default: default
          - name: signoz.collector.id
        aggregation_temporality: AGGREGATION_TEMPORALITY_DELTA
      # AI observability processors, present in signoz-otel-collector 0.144.11 and later. SigNoz fills them over OpAMP.
      # Keep both in the traces pipeline when overriding it, or drop both when pinning an older collector.
      signozspanmapper:
        groups: []
      signozllmpricing:
        attrs:
          model: gen_ai.request.model
          in: gen_ai.usage.input_tokens
          out: gen_ai.usage.output_tokens
          cache_read: gen_ai.usage.cache_read.input_tokens
          cache_write: gen_ai.usage.cache_creation.input_tokens
        default_pricing:
          rules: []
        output_attrs:
          in: signoz.gen_ai.usage.input_tokens.cost
          out: signoz.gen_ai.usage.output_tokens.cost
          cache_read: signoz.gen_ai.usage.cache_read.input_tokens.cost
          cache_write: signoz.gen_ai.usage.cache_write.input_tokens.cost
          total: signoz.gen_ai.usage.tokens.cost
      # Logs normalizer, present in signoz-otel-collector 0.144.15 and later. Drop it when pinning an older collector.
      signozlogsnormalizer: {}
      filter/drop_stale:
        error_mode: ignore
        logs:
          log_record:
            - time_unix_nano != 0 and time < Now() - Duration("360h")
            - time_unix_nano == 0 and observed_time_unix_nano != 0 and observed_time < Now() - Duration("360h")
        metrics:
          datapoint:
            - time_unix_nano != 0 and time < Now() - Duration("360h")
        traces:
          span:
            - start_time_unix_nano != 0 and start_time < Now() - Duration("360h")
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      zpages:
        endpoint: localhost:55679
      pprof:
        endpoint: localhost:1777
    exporters:
      clickhousetraces:
        datasource: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_TRACE_DATABASE}
        timeout: 45s
        low_cardinal_exception_grouping: ${env:LOW_CARDINAL_EXCEPTION_GROUPING}
        use_new_schema: true
      signozclickhousemetrics:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_DATABASE}
        timeout: 45s
      clickhouselogsexporter:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_LOG_DATABASE}
        timeout: 45s
        use_new_schema: true
      metadataexporter:
        enabled: true
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/signoz_metadata
        timeout: 45s
        tenant_id: ${env:TENANT_ID}
        cache:
          provider: in_memory
      signozclickhousemeter:
        dsn: tcp://${env:CLICKHOUSE_USER}:${env:CLICKHOUSE_PASSWORD}@${env:CLICKHOUSE_HOST}:${env:CLICKHOUSE_PORT}/${env:CLICKHOUSE_METER_DATABASE}
        timeout: 45s
        sending_queue:
          enabled: false
    service:
      telemetry:
        logs:
          encoding: json
      extensions: [health_check, zpages, pprof]
      pipelines:
        traces:
          receivers: [otlp, jaeger]
          processors: [signozspanmetrics/delta, signozspanmapper, signozllmpricing, filter/drop_stale, batch]
          exporters: [clickhousetraces, metadataexporter, signozmeter]
        metrics:
          receivers: [otlp]
          processors: [filter/drop_stale, batch]
          exporters: [metadataexporter, signozclickhousemetrics, signozmeter]
        logs:
          receivers: [otlp, httplogreceiver/heroku, httplogreceiver/json]
          processors: [signozlogsnormalizer, filter/drop_stale, batch]
          exporters: [clickhouselogsexporter, metadataexporter, signozmeter]
        metrics/meter:
          receivers: [signozmeter]
          processors: [batch/meter]
          exporters: [signozclickhousemeter]
# @section -- Postgres
postgresql:
  # -- Install PostgreSQL. Switching an existing release from SQLite to Postgres needs a new release.
  # @section -- Postgres
  enabled: false
  # -- Namespace of Postgres. Empty means the release namespace.
  # @section -- Postgres
  namespace: ""
  # -- Override the chart name.
  # @section -- Postgres
  nameOverride: ""
  # -- Override the full resource name.
  # @section -- Postgres
  fullnameOverride: ""
  # -- Number of replicas.
  # @default -- 1
  # @section -- Postgres
  replicaCount: 1
  image:
    # -- Image repository.
    # @default -- "postgres"
    # @section -- Postgres
    repository: postgres
    # -- Image tag.
    # @default -- "15"
    # @section -- Postgres
    tag: 15
    # -- Image pull policy.
    # @default -- "IfNotPresent"
    # @section -- Postgres
    pullPolicy: IfNotPresent
  # -- Image pull secrets for the Postgres Pod.
  # @default -- []
  # @section -- Postgres
  imagePullSecrets: []
  service:
    # -- Annotations to add to the Service.
    # @default -- {}
    # @section -- Postgres
    annotations: {}
    # -- Labels to add to the Service.
    # @default -- {}
    # @section -- Postgres
    labels: {}
    # -- Kubernetes Service type.
    # @default -- "ClusterIP"
    # @section -- Postgres
    type: ClusterIP
    # -- Service port.
    # @default -- 5432
    # @section -- Postgres
    port: 5432
  auth:
    # -- User to create.
    # @default -- "signoz"
    # @section -- Postgres
    username: "signoz"
    # -- Password of the user, stored in the Secret `<fullname>-auth` under the key `password`. Ignored when `auth.existingSecret` is set.
    # @section -- Postgres
    password: "signoz123"
    # -- Database to create.
    # @default -- ""
    # @section -- Postgres
    database: "signoz"
    # -- Name of a Secret you created that holds the password. When set, the chart creates no Secret and ignores `auth.password`.
    # @default -- ""
    # @section -- Postgres
    existingSecret: ""
    secretKeys:
      # -- Key of the password inside `auth.existingSecret`.
      # @default -- "password"
      # @section -- Postgres
      userPasswordKey: ""
  # -- Resource requests and limits for the container.
  # @default -- {}
  # @section -- Postgres
  resources: {}
  # -- PriorityClass of the Pod.
  # @default -- ""
  # @section -- Postgres
  priorityClassName: ""
  # -- Security context for the Pod.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @default -- {}
  # @section -- Postgres
  podSecurityContext: {}
  # -- Security context for the container.
  # Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
  # @default -- {}
  # @section -- Postgres
  securityContext: {}
  # -- Annotations to add to the Pod.
  # @default -- {}
  # @section -- Postgres
  podAnnotations: {}
  # -- Annotations to add to the Postgres objects.
  # @default -- {}
  # @section -- Postgres
  annotations: {}
  # -- Node labels for Pod assignment.
  # @default -- {}
  # @section -- Postgres
  nodeSelector: {}
  # -- Tolerations for Pod assignment.
  # @default -- []
  # @section -- Postgres
  tolerations: []
  # -- Affinity rules for Pod assignment.
  # @default -- {}
  # @section -- Postgres
  affinity: {}
  # -- Topology spread constraints for Pod assignment.
  # Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
  # @default -- []
  # @section -- Postgres
  topologySpreadConstraints: []
  livenessProbe:
    # -- Enable the liveness probe.
    # @default -- true
    # @section -- Postgres
    enabled: true
    # -- Initial delay of the liveness probe, in seconds.
    # @default -- 20
    # @section -- Postgres
    initialDelaySeconds: 20
    # -- Period of the liveness probe, in seconds.
    # @default -- 10
    # @section -- Postgres
    periodSeconds: 10
    # -- Timeout of the liveness probe, in seconds.
    # @default -- 5
    # @section -- Postgres
    timeoutSeconds: 5
    # -- Success threshold of the liveness probe.
    # @default -- 1
    # @section -- Postgres
    successThreshold: 1
    # -- Failure threshold of the liveness probe.
    # @default -- 6
    # @section -- Postgres
    failureThreshold: 6
  readinessProbe:
    # -- Enable the readiness probe.
    # @default -- true
    # @section -- Postgres
    enabled: true
    # -- Initial delay of the readiness probe, in seconds.
    # @default -- 5
    # @section -- Postgres
    initialDelaySeconds: 5
    # -- Period of the readiness probe, in seconds.
    # @default -- 5
    # @section -- Postgres
    periodSeconds: 5
    # -- Timeout of the readiness probe, in seconds.
    # @default -- 3
    # @section -- Postgres
    timeoutSeconds: 3
    # -- Success threshold of the readiness probe.
    # @default -- 1
    # @section -- Postgres
    successThreshold: 1
    # -- Failure threshold of the readiness probe.
    # @default -- 6
    # @section -- Postgres
    failureThreshold: 6
  startupProbe:
    # -- Enable the startup probe. It passes once Postgres answers and no dump waits at `backups/pre-upgrade.sql`.
    # The liveness and readiness probes start only after it passes.
    # @section -- Postgres
    enabled: true
    # -- Delay before the first startup probe.
    # @section -- Postgres
    initialDelaySeconds: 0
    # -- Interval between startup probes.
    # @section -- Postgres
    periodSeconds: 10
    # -- Timeout of each startup probe.
    # @section -- Postgres
    timeoutSeconds: 5
    # -- Consecutive successes for the startup probe to pass. Kubernetes accepts only 1.
    # @section -- Postgres
    successThreshold: 1
    # -- Consecutive failures before the container is restarted.
    # With the default period, a first start has 30 minutes to load a dump.
    # @section -- Postgres
    failureThreshold: 180
  persistence:
    # -- Enable persistence with a PersistentVolumeClaim.
    # @default -- true
    # @section -- Postgres
    enabled: true
    # -- Name of an existing PVC to use. Rendered as a template.
    # `{{ .Release.Name }}-{{ .Chart.Name }}` names the PVC `<release>-postgresql`.
    # @default -- "none, the chart's volume claim template"
    # @section -- Postgres
    existingClaim: ""
    # -- Size of the PVC.
    # @default -- "10Gi"
    # @section -- Postgres
    size: 10Gi
    # -- StorageClass of the PVC.
    # @default -- null
    # @section -- Postgres
    storageClass: null
    # -- Access modes of the PVC.
    # Ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/#access-modes
    # @default -- ["ReadWriteOnce"]
    # @section -- Postgres
    accessModes:
      - ReadWriteOnce
    # -- Mount path of the data PVC.
    # At `/var/lib/postgresql`, the chart also mounts the PVC's `data` directory at `/var/lib/postgresql/data`, so the database is on the PVC.
    # Not applied to the official `postgres` image at tag 18 or later, or when an `additionalVolumeMounts` entry uses that path.
    # At any other path, `persistence.dataDir` must be under this one.
    # @section -- Postgres
    mountPath: /var/lib/postgresql
    # -- Subpath of the PVC that holds the Postgres data.
    # @default -- ""
    # @section -- Postgres
    subPath: ""
    # -- Data directory of Postgres (`PGDATA`). It must be a subdirectory of `persistence.mountPath`.
    # A container that does not run as root cannot initialize the `data` directory. Use `/var/lib/postgresql/pgdata` for it.
    # @section -- Postgres
    dataDir: /var/lib/postgresql/data
  # Before an upgrade, dumps a database not on the PVC for the new Pod to load.
  upgradeBackupHook:
    # -- Run the pre-upgrade hook Job that dumps a database not on the PVC, for the new Pod to load.
    # Not run on `helm install`, without persistence, with a `persistence.mountPath` other than `/var/lib/postgresql`, with a
    # `persistence.dataDir` outside it, with an `additionalVolumeMounts` entry at or above the data directory, with a `ReadWriteOncePod` PVC, or with `replicaCount: 0`.
    # It runs on the Postgres Pod's node. While that Pod is absent, the upgrade fails after `activeDeadlineSeconds` with `DeadlineExceeded`.
    # When false without a dump taken by hand, a database that is not on the PVC is lost: https://signoz.io/docs/operate/migration/upgrade-0-152/#take-the-postgresql-dump-by-hand
    # @section -- Postgres
    enabled: true
    # -- Time limit of the Job. When it passes, the Job and the upgrade fail.
    # A value of 300 or more needs `helm upgrade --timeout` raised with it.
    # @section -- Postgres
    activeDeadlineSeconds: 240
    # -- Resource requests and limits for the container. `null` sets none, and `{}` keeps the defaults.
    # @default -- "requests 50m CPU and 64Mi memory, limits 1 CPU and 256Mi memory"
    # @section -- Postgres
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: "1"
        memory: 256Mi
    # -- Node labels for Pod assignment. They must match the node of the Postgres Pod.
    # @default -- "the value of `nodeSelector`"
    # @section -- Postgres
    nodeSelector: {}
    # -- Tolerations for Pod assignment, added to the Postgres Pod's `tolerations`.
    # @section -- Postgres
    tolerations: []
    # -- PriorityClass of the Pod.
    # @default -- "the value of `priorityClassName`"
    # @section -- Postgres
    priorityClassName: ""
    # -- Annotations to add to the Pod.
    # @section -- Postgres
    podAnnotations: {}
    # -- Labels to add to the Pod. A key the chart also sets keeps the chart's value.
    # @section -- Postgres
    podLabels: {}
    # -- Annotations to add to the Job. The `helm.sh/hook`, `helm.sh/hook-weight` and `helm.sh/hook-delete-policy` keys are ignored.
    # @section -- Postgres
    annotations: {}
  # -- Extra arguments for the container.
  # @default -- []
  # @section -- Postgres
  additionalArgs: []
  # -- Extra volumes for the Pod.
  # @default -- []
  # @section -- Postgres
  additionalVolumes: []
  # -- Extra volume mounts for the container.
  # @default -- []
  # @section -- Postgres
  additionalVolumeMounts: []
  # -- Extra environment variables for the container.
  # @default -- []
  # @section -- Postgres
  extraEnv: []
  serviceAccount:
    # -- Create a ServiceAccount.
    # @default -- true
    # @section -- Postgres
    create: true
    # -- Annotations to add to the ServiceAccount.
    # @default -- {}
    # @section -- Postgres
    annotations: {}
    # -- Name of the ServiceAccount. When empty and `create` is true, the chart generates one.
    # @default -- null
    # @section -- Postgres
    name:
