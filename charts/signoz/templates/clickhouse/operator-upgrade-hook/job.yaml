{{- if and (eq (include "clickhouse.operatorEnabled" .) "true") .Values.clickhouse.operatorUpgradeHook.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clickhouse.operatorFullname" . }}-upgrade
  namespace: {{ include "clickhouse.namespace" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-9"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.clickhouse.operatorUpgradeHook.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "clickhouse.operatorFullname" . }}-upgrade
      restartPolicy: OnFailure
      containers:
        - name: operator-upgrade
          image: {{ include "clickhouse.operatorUpgradeHook.image" . }}
          imagePullPolicy: {{ .Values.clickhouse.operatorUpgradeHook.image.pullPolicy }}
          # Run without a shell: registry.k8s.io/kubectl is distroless.
          # Deletes only a Deployment carrying the labels this chart gave the operator
          # before it came from Altinity's chart (name=clickhouse, component=operator).
          # Altinity's Deployment carries name=<nameOverride> and no component label,
          # so it never matches and later upgrades change nothing.
          command:
            - kubectl
          args:
            - delete
            - deployment
            - --namespace={{ include "clickhouse.namespace" . }}
            - --selector=app.kubernetes.io/name={{ include "clickhouse.name" . }},app.kubernetes.io/instance={{ .Release.Name }},app.kubernetes.io/component=operator
            - --ignore-not-found=true
            - --wait=true
          {{- with .Values.clickhouse.operatorUpgradeHook.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
