# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# signoz.lib.labels through the object labels of the ClickHouseInstallation.
suite: lib_labels_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
release:
  name: golden
  namespace: platform
tests:
  - it: carries app.kubernetes.io/managed-by Helm
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/managed-by"]
          value: Helm
  - it: carries the image tag as app.kubernetes.io/version, quoted
    set:
      # Unquoted, 25.12 would read back as a number.
      clickhouse.image.tag: "25.12"
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/version"]
          value: "25.12"
  - it: carries helm.sh/chart
    asserts:
      - matchRegex:
          path: metadata.labels["helm.sh/chart"]
          pattern: ^signoz-
