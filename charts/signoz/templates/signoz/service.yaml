{{- $service := .Values.signoz.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "signoz.fullname" . }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "signoz.labels" . | fromYaml) $service.labels)) | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $service.type }}
  {{- /* An explicit null nodePort on a ClusterIP Service removes one left from a NodePort type, which the API server refuses. */}}
  ports:
    - name: http
      port: {{ $service.port }}
      targetPort: http
      protocol: TCP
      {{- if eq $service.type "ClusterIP" }}
      nodePort: null
      {{- else if and (eq $service.type "NodePort") $service.nodePort }}
      nodePort: {{ $service.nodePort }}
      {{- end }}
    - name: http-internal
      port: {{ $service.internalPort }}
      targetPort: http-internal
      protocol: TCP
      {{- if eq $service.type "ClusterIP" }}
      nodePort: null
      {{- else if and (eq $service.type "NodePort") $service.internalNodePort }}
      nodePort: {{ $service.internalNodePort }}
      {{- end }}
    - name: opamp-internal
      port: {{ $service.opampPort }}
      targetPort: opamp-internal
      protocol: TCP
      {{- if eq $service.type "ClusterIP" }}
      nodePort: null
      {{- else if and (eq $service.type "NodePort") $service.opampInternalNodePort }}
      nodePort: {{ $service.opampInternalNodePort }}
      {{- end }}
  selector:
    {{- include "signoz.selectorLabels" . | nindent 4 }}
