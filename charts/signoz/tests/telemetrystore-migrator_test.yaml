# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: telemetrystore-migrator_test.yaml
templates:
  - templates/telemetrystore-migrator/job.yaml
  - templates/telemetrystore-migrator/serviceaccount.yaml
  - templates/validate.yaml
release:
  name: signoz
  namespace: platform
tests:
  - it: names the Job with the release revision
    template: templates/telemetrystore-migrator/job.yaml
    release:
      revision: 1
    asserts:
      - equal:
          path: metadata.name
          value: signoz-telemetrystore-migrator-1
  - it: names the Job with the release revision on upgrade
    template: templates/telemetrystore-migrator/job.yaml
    release:
      upgrade: true
      revision: 7
    asserts:
      - equal:
          path: metadata.name
          value: signoz-telemetrystore-migrator-7
  - it: renders the Job without Helm hooks under the default ServiceAccount, and no ServiceAccount, on install
    asserts:
      - template: templates/telemetrystore-migrator/job.yaml
        notExists:
          path: metadata.annotations["helm.sh/hook"]
      - template: templates/telemetrystore-migrator/job.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        hasDocuments:
          count: 0
  - it: renders the Job without Helm hooks under the default ServiceAccount, and no ServiceAccount, on upgrade
    release:
      upgrade: true
    asserts:
      - template: templates/telemetrystore-migrator/job.yaml
        notExists:
          path: metadata.annotations["helm.sh/hook"]
      - template: templates/telemetrystore-migrator/job.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        hasDocuments:
          count: 0
  - it: renders the ServiceAccount without Helm hooks and runs the Job under it with serviceAccount.create
    release:
      upgrade: true
    set:
      telemetryStoreMigrator.serviceAccount.create: true
    asserts:
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        equal:
          path: metadata.name
          value: signoz-telemetrystore-migrator
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        notExists:
          path: metadata.annotations["helm.sh/hook"]
      - template: templates/telemetrystore-migrator/job.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: signoz-telemetrystore-migrator
  - it: passes the global and root imagePullSecrets to the Job pod
    template: templates/telemetrystore-migrator/job.yaml
    set:
      global.imagePullSecrets:
        - global-pull
      imagePullSecrets:
        - root-pull
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-pull
            - name: root-pull
  - it: passes otelCollector.imagePullSecrets to the Job pod
    template: templates/telemetrystore-migrator/job.yaml
    set:
      otelCollector.imagePullSecrets:
        - collector-pull
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: collector-pull
  - it: lists the global, root and otelCollector imagePullSecrets on the Job pod and none on the ServiceAccount with serviceAccount.create
    set:
      telemetryStoreMigrator.serviceAccount.create: true
      global.imagePullSecrets:
        - global-pull
      imagePullSecrets:
        - root-pull
      otelCollector.imagePullSecrets:
        - collector-pull
    asserts:
      - template: templates/telemetrystore-migrator/serviceaccount.yaml
        notExists:
          path: imagePullSecrets
      - template: templates/telemetrystore-migrator/job.yaml
        equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: global-pull
            - name: root-pull
            - name: collector-pull
  - it: keeps the Argo CD sync options on the Job beside telemetryStoreMigrator.annotations
    template: templates/telemetrystore-migrator/job.yaml
    set:
      telemetryStoreMigrator.annotations:
        example.com/team: observability
    asserts:
      - equal:
          path: metadata.annotations
          value:
            example.com/team: observability
            argocd.argoproj.io/sync-options: Force=true,Replace=true
  - it: lets telemetryStoreMigrator.annotations replace the Argo CD sync options on the Job
    template: templates/telemetrystore-migrator/job.yaml
    set:
      telemetryStoreMigrator.annotations:
        argocd.argoproj.io/sync-options: Replace=true
    asserts:
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-options: Replace=true
  - it: renders no ttlSecondsAfterFinished by default
    template: templates/telemetrystore-migrator/job.yaml
    asserts:
      - notExists:
          path: spec.ttlSecondsAfterFinished
  - it: renders telemetryStoreMigrator.ttlSecondsAfterFinished when set
    template: templates/telemetrystore-migrator/job.yaml
    set:
      telemetryStoreMigrator.ttlSecondsAfterFinished: 604800
    asserts:
      - equal:
          path: spec.ttlSecondsAfterFinished
          value: 604800
  - it: reads CLICKHOUSE_PASSWORD from the chart's Secret in every migrator container
    template: templates/telemetrystore-migrator/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: &chartSecret
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: *chartSecret
      - contains:
          path: spec.template.spec.initContainers[2].env
          content: *chartSecret
      - contains:
          path: spec.template.spec.containers[0].env
          content: *chartSecret
  - it: reads CLICKHOUSE_PASSWORD from clickhouse.existingSecret in every migrator container
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.existingSecret: my-ch
      clickhouse.existingSecretPasswordKey: pw
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: &existingSecret
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: my-ch
                key: pw
      - contains:
          path: spec.template.spec.initContainers[1].env
          content: *existingSecret
      - contains:
          path: spec.template.spec.initContainers[2].env
          content: *existingSecret
      - contains:
          path: spec.template.spec.containers[0].env
          content: *existingSecret
  - it: fails on telemetryStoreMigrator.upgradeHelmHooks set to true
    template: templates/validate.yaml
    set:
      telemetryStoreMigrator.upgradeHelmHooks: true
    asserts:
      - failedTemplate:
          errorMessage: "`telemetryStoreMigrator.upgradeHelmHooks` has been removed: the migrator runs as an ordinary Job on install and upgrade, named with the release revision, and the otel-collector waits for its sync migrations in its `check` init container; `telemetryStoreMigrator.enabled: false` skips it."
  - it: renders with telemetryStoreMigrator.upgradeHelmHooks set to false
    template: templates/validate.yaml
    set:
      telemetryStoreMigrator.upgradeHelmHooks: false
    asserts:
      - notFailedTemplate: {}
      - hasDocuments:
          count: 0
  - it: names the Job with the release revision under a 57-character telemetryStoreMigrator.name
    template: templates/telemetrystore-migrator/job.yaml
    release:
      revision: 1
    set:
      telemetryStoreMigrator.name: 012345678-012345678-012345678-012345678-012345678-0123456
    asserts:
      - equal:
          path: metadata.name
          value: 012345678-012345678-012345678-012345678-012345678-0123456-1
  - it: fails on a telemetryStoreMigrator.name over 57 characters
    template: templates/validate.yaml
    set:
      telemetryStoreMigrator.name: 012345678-012345678-012345678-012345678-012345678-01234567
    asserts:
      - failedTemplate:
          errorPattern: "the migrator Job name appends `-<release revision>` and must stay within 63 characters, so the name can have at most 57: shorten it"
  - it: connects every migrator container to the bundled ClickHouse, with the connection variables before the migrator's own
    template: templates/telemetrystore-migrator/job.yaml
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].env
          value: &bundledEnv
            - name: CLICKHOUSE_HOST
              value: signoz-clickhouse
            - name: CLICKHOUSE_PORT
              value: "9000"
            - name: CLICKHOUSE_CLUSTER
              value: cluster
            - name: CLICKHOUSE_USER
              value: admin
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: signoz-clickhouse-credentials
                  key: password
            - name: CLICKHOUSE_SECURE
              value: "false"
            - name: CLICKHOUSE_VERIFY
              value: "false"
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
              value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_CLUSTER
              value: $(CLICKHOUSE_CLUSTER)
            - name: SIGNOZ_OTEL_COLLECTOR_TIMEOUT
              value: 10m
            - name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_REPLICATION
              value: "true"
      - equal:
          path: spec.template.spec.initContainers[1].env
          value: *bundledEnv
      - equal:
          path: spec.template.spec.initContainers[2].env
          value: *bundledEnv
      - equal:
          path: spec.template.spec.containers[0].env
          value: *bundledEnv
  - it: connects the migrator to an external ClickHouse without TLS
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLICKHOUSE_HOST
            value: clickhouse.example.com
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
  - it: connects the migrator over TLS without certificate verification with externalClickhouse.secure
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.secure: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true&skip_verify=true
  - it: connects the migrator over TLS with certificate verification with externalClickhouse.secure and externalClickhouse.verify
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.secure: true
      externalClickhouse.verify: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)?secure=true
  - it: keeps the migrator off TLS with externalClickhouse.secure set to the string "false"
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.secure: "false"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: SIGNOZ_OTEL_COLLECTOR_CLICKHOUSE_DSN
            value: tcp://$(CLICKHOUSE_USER):$(CLICKHOUSE_PASSWORD)@$(CLICKHOUSE_HOST):$(CLICKHOUSE_PORT)
