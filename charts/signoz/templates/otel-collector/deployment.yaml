{{- $image := include "signoz.lib.image" (dict "registry" .Values.global.imageRegistry "image" .Values.otelCollector.image "name" "otelCollector.image") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "otelCollector.fullname" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "otelCollector.labels" . | fromYaml) .Values.otelCollector.labels)) | nindent 4 }}
  {{- with .Values.otelCollector.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "otelCollector.selectorLabels" . | nindent 6 }}
  minReadySeconds: {{ .Values.otelCollector.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.otelCollector.progressDeadlineSeconds }}
  {{- if not .Values.otelCollector.autoscaling.enabled }}
  replicas: {{ .Values.otelCollector.replicaCount }}
  {{- end }}
  strategy:
    type: {{ .Values.otelCollector.strategy | default "RollingUpdate" }}
  template:
    metadata:
      annotations:
        {{- include "signoz.lib.mergedMap" (dict "maps" (list .Values.otelCollector.pod.annotations) "keep" (dict "checksum/config" (include (print $.Template.BasePath "/otel-collector/configmap.yaml") . | sha256sum))) | nindent 8 }}
      labels:
        {{- include "signoz.lib.mergedMap" (dict "maps" (list .Values.otelCollector.pod.labels) "keep" (include "otelCollector.selectorLabels" . | fromYaml)) | nindent 8 }}
    spec:
      {{- with include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.otelCollector.imagePullSecrets)) }}
      {{- . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "otelCollector.serviceAccountName" . }}
      {{- with .Values.otelCollector.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.otelCollector.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.otelCollector.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.otelCollector.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.otelCollector.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.otelCollector.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if .Values.telemetryStoreMigrator.enabled }}
        - name: check
          image: {{ $image }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          command:
            - /signoz-otel-collector
          args:
            - migrate
            - sync
            - check
          {{- with .Values.otelCollector.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with include "signoz.lib.env" (dict "chart" (list (include "snippet.telemetryStoreMigrator-env" . | fromYamlArray)) "user" .Values.telemetryStoreMigrator.env) }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.telemetryStoreMigrator.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.otelCollector.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.telemetryStoreMigrator.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      containers:
        - name: collector
          image: {{ $image }}
          imagePullPolicy: {{ .Values.otelCollector.image.pullPolicy }}
          ports:
            {{- range $name, $port := .Values.otelCollector.ports }}
            {{- if $port.enabled }}
            - name: {{ $name }}
              containerPort: {{ $port.containerPort }}
              protocol: {{ $port.protocol }}
            {{- end }}
            {{- end }}
          {{- with .Values.otelCollector.command.name }}
          command:
            - {{ . | quote }}
          {{- end }}
          args:
            {{- if .Values.otelCollector.configMap.create }}
            - "--config=/conf/otel-collector-config.yaml"
            - "--manager-config=/conf/otel-collector-opamp-config.yaml"
            - "--copy-path=/var/tmp/collector-config.yaml"
            {{- end }}
            {{- range .Values.otelCollector.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- with .Values.otelCollector.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $chartEnv := list (include "clickhouse.env" . | fromYamlArray) (include "clickhouse.databasesEnv" . | fromYamlArray) (include "snippet.k8s-env" . | fromYamlArray) (include "otelCollector.chartEnv" . | fromYamlArray) }}
          {{- with include "signoz.lib.env" (dict "chart" $chartEnv "user" .Values.otelCollector.env) }}
          env:
            {{- . | trim | nindent 12 }}
          {{- end }}
          {{- with .Values.otelCollector.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: otel-collector-config-vol
              mountPath: /conf
            {{- with .Values.otelCollector.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.otelCollector.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.otelCollector.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.otelCollector.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.otelCollector.resources | nindent 12 }}
      volumes:
        - name: otel-collector-config-vol
          configMap:
            name: {{ include "otelCollector.fullname" . }}
        {{- with .Values.otelCollector.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
