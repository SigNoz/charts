                            - panelType
                            - queries
                            - queryType
                            type: object
                          requireMinPoints:
                            description: Whether a series is skipped until it has
                              at least requiredNumPoints points in the window. Defaults
                              to false.
                            type: boolean
                          requiredNumPoints:
                            description: The minimum number of points a series needs
                              before it is evaluated. Must be greater than 0 when
                              requireMinPoints is true.
                            format: int64
                            type: integer
                          seasonality:
                            description: 'anomaly_rule only: the seasonal period the
                              history is compared against, hourly, daily or weekly.'
                            enum:
                            - hourly
                            - daily
                            - weekly
                            type: string
                          selectedQueryName:
                            description: The name of the query whose result is evaluated,
                              such as A or F1. Must match a query in compositeQuery.
                              When omitted, F1 is used if present, otherwise the enabled
                              query with the highest name.
                            minLength: 1
                            type: string
                          thresholds:
                            description: The thresholds to evaluate, as a kind and
                              spec. Required when schemaVersion is v2alpha1; derived
                              from op, target and matchType for v1.
                            properties:
                              kind:
                                description: The kind of threshold.
                                enum:
                                - basic
                                type: string
                              spec:
                                description: The basic threshold specification (array
                                  of thresholds).
                                items:
                                  properties:
                                    channels:
                                      description: The displayName of each notification
                                        channel alerts crossing this threshold are
                                        sent to. Ignored when notificationSettings.usePolicy
                                        is true.
                                      items:
                                        type: string
                                      type: array
                                    matchType:
                                      description: Which points in the window must
                                        satisfy op. Accepted as at_least_once, all_the_times,
                                        on_average, in_total or last, their aliases
                                        avg and sum, or the legacy codes as strings,
                                        '1' to '5'.
                                      enum:
                                      - at_least_once
                                      - all_the_times
                                      - on_average
                                      - in_total
                                      - last
                                      type: string
                                    name:
                                      description: The threshold name, conventionally
                                        critical, error, warning or info. Alerts carry
                                        it as the threshold.name label and, lowercased,
                                        as the severity label; templates can read
                                        it as $threshold.name.
                                      minLength: 1
                                      type: string
                                    op:
                                      description: How the value is compared with
                                        target. Accepted as above, below, equal, not_equal,
                                        above_or_equal, below_or_equal or outside_bounds,
                                        their symbols, or the legacy codes as strings,
                                        '1' to '7'.
                                      enum:
                                      - above
                                      - below
                                      - equal
                                      - not_equal
                                      - above_or_equal
                                      - below_or_equal
                                      - outside_bounds
                                      type: string
                                    recoveryTarget:
                                      description: The value at which a firing alert
                                        resolves, in targetUnit. Keeps an alert firing
                                        between target and recoveryTarget to avoid
                                        flapping; null resolves at target.
                                      type: number
                                    target:
                                      description: The value the query result is compared
                                        against, in targetUnit.
                                      type: number
                                    targetUnit:
                                      description: The unit of target and recoveryTarget,
                                        such as percent or ms. Converted to the query
                                        unit before comparison when the two differ;
                                        empty means the query unit.
                                      type: string
                                  required:
                                  - matchType
                                  - name
                                  - op
                                  - target
                                  type: object
                                type: array
                            required:
                            - kind
                            - spec
                            type: object
                        required:
                        - compositeQuery
                        - selectedQueryName
                        - thresholds
                        type: object
                      description:
                        description: A human readable description of what the rule
                          monitors.
                        type: string
                      disabled:
                        description: Whether the rule is paused. A disabled rule is
                          neither evaluated nor notifies. Defaults to false.
                        type: boolean
                      evaluation:
                        description: The evaluation window, as a kind and spec. Required
                          when schemaVersion is v2alpha1; derived from evalWindow
                          and frequency for v1.
                        properties:
                          kind:
                            description: The kind of evaluation.
                            enum:
                            - rolling
                            - cumulative
                            type: string
                          spec:
                            properties:
                              evalWindow:
                                description: The sliding lookback window each evaluation
                                  queries, as a Go duration such as 5m.
                                type: string
                              frequency:
                                description: How often the rule is evaluated, as a
                                  Go duration such as 1m. Must be positive.
                                type: string
                              schedule:
                                description: The boundary the accumulation window
                                  starts from. Each evaluation queries from the most
                                  recent boundary to now.
                                properties:
                                  day:
                                    description: The day of the month of the reset
                                      boundary, 1 to 31. Required for monthly.
                                    format: int64
                                    type: integer
                                  hour:
                                    description: The hour of the reset boundary, 0
                                      to 23. Required for daily, weekly and monthly.
                                    format: int64
                                    type: integer
                                  minute:
                                    description: The minute of the reset boundary,
                                      0 to 59. Required for every type.
                                    format: int64
                                    type: integer
                                  type:
                                    description: 'How often the window resets: hourly,
                                      daily, weekly or monthly.'
                                    enum:
                                    - hourly
                                    - daily
                                    - weekly
                                    - monthly
                                    type: string
                                  weekday:
                                    description: The weekday of the reset boundary,
                                      0 (Sunday) to 6 (Saturday). Required for weekly.
                                    format: int64
                                    type: integer
                                required:
                                - type
                                type: object
                              timezone:
                                description: The IANA time zone the schedule is resolved
                                  in, such as UTC or Asia/Kolkata.
                                type: string
                            type: object
                        required:
                        - kind
                        - spec
                        type: object
                        x-kubernetes-validations:
                        - message: kind rolling requires spec.evalWindow, spec.frequency
                          rule: self.kind != 'rolling' || (has(self.spec.evalWindow)
                            && has(self.spec.frequency))
                        - message: kind cumulative requires spec.schedule, spec.frequency,
                            spec.timezone
                          rule: self.kind != 'cumulative' || (has(self.spec.schedule)
                            && has(self.spec.frequency) && has(self.spec.timezone))
                      labels:
                        additionalProperties:
                          type: string
                        description: Labels attached to every alert the rule fires.
                          Keys match [a-zA-Z_.][a-zA-Z0-9_.]*; values may use Go templates
                          such as {{ "{{" }}$labels.service_name{{ "}}" }}. severity is the conventional
                          routing label.
                        type: object
                      notificationSettings:
                        description: Grouping, re-notification and routing behaviour.
                          Required when schemaVersion is v2alpha1; derived from the
                          v1 fields otherwise.
                        properties:
                          groupBy:
                            description: Label names whose values group alerts into
                              one notification, such as service.name.
                            items:
                              type: string
                            type: array
                          newGroupEvalDelay:
                            description: A grace period, as a Go duration such as
                              2m, during which a newly seen label group is excluded
                              from evaluation. Applies to metric rules only; log and
                              trace rules are never delayed. A group whose values
                              are not yet known is evaluated immediately.
                            type: string
                          renotify:
                            description: Whether and how often to re-send a notification
                              for an alert that stays active.
                            properties:
                              alertStates:
                                description: 'The alert states that are re-notified:
                                  firing, nodata or both.'
                                items:
                                  type: string
                                type: array
                              enabled:
                                description: Whether an active alert is re-sent after
                                  interval elapses. When false an alert notifies once
                                  per firing.
                                type: boolean
                              interval:
                                description: The time between repeat notifications,
                                  as a Go duration such as 4h. Must be positive when
                                  enabled is true.
                                type: string
                            type: object
                          usePolicy:
                            description: When true, alerts are routed by the organisation
                              level notification policies instead of the channels
                              named on the thresholds. Defaults to false.
                            type: boolean
                        type: object
                      ruleType:
                        description: 'The evaluation strategy: threshold_rule compares
                          against thresholds, promql_rule evaluates a PromQL expression,
                          anomaly_rule scores deviation from seasonal history. Defaults
                          to threshold_rule for builder queries and is forced to promql_rule
                          for promql queries.'
                        enum:
                        - threshold_rule
                        - promql_rule
                        - anomaly_rule
                        type: string
                      schemaVersion:
                        description: 'The rule payload schema: v1 (the default when
                          omitted) uses the flat condition fields, v2alpha1 uses condition.thresholds,
                          evaluation and notificationSettings.'
                        enum:
                        - v2alpha1
                        type: string
                    required:
                    - alert
                    - alertType
                    - condition
                    - evaluation
                    - notificationSettings
                    - ruleType
                    - schemaVersion
                    type: object
                type: object
              providerConfigRef:
                description: |-
                  ProviderConfigRef names the SigNoz backend to write through, resolved in
                  the resource's own namespace unless its kind is ClusterProviderConfig.
                properties:
                  kind:
                    default: ProviderConfig
                    enum:
                    - ProviderConfig
                    - ClusterProviderConfig
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              reclaimPolicy:
                default: Delete
                description: |-
                  ReclaimPolicy controls what happens in SigNoz when this custom resource is
                  deleted. Defaults to Delete.
                enum:
                - Delete
                - Orphan
                type: string
              retryInterval:
                description: |-
                  RetryInterval is the cadence at which a Recoverable failure is retried.
                  Omitted, it falls back to Interval, then to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
              suspend:
                description: |-
                  Suspend stops reconciling this resource without changing or deleting
                  anything in SigNoz.
                type: boolean
              timeout:
                description: |-
                  Timeout bounds a single reconciliation attempt, including the HTTP calls
                  to SigNoz. Omitted, it falls back to the operator-wide default.
                pattern: ^([0-9]+(\.[0-9]+)?(ms|s|m|h))+$
                type: string
            required:
            - objectTemplate
            - providerConfigRef
            type: object
          status:
            properties:
              conditions:
                description: |-
                  Conditions report the reconcile outcome. The type vocabulary is fixed and
                  shared across kinds; per-kind detail lives in reason and message.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the metadata.generation the operator
                  last reconciled.
                format: int64
                type: integer
              observedHash:
                description: |-
                  ObservedHash is a hash of the last body the operator sent to SigNoz. It is
                  an optimisation that lets a reconcile skip the remote fetch when desired
                  state is unchanged, never the drift mechanism.
                type: string
              reconciledAt:
                description: |-
                  ReconciledAt is when the operator last reconciled the resource against
                  SigNoz.
                format: date-time
                type: string
              signozResource:
                description: |-
                  SigNozResource records the object's identity in SigNoz. Its ID is
                  empty until a create or lookup confirms it. It is a cache, not the source
                  of truth for identity: if lost, the next reconcile re-discovers it.
                properties:
                  id:
                    description: |-
                      ID is the identifier SigNoz assigned, set once the operator has created or
                      adopted the remote object.
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
