{{- if .Values.clickhouse.enabled }}
{{- if or .Values.clickhouse.coldStorage.role.enabled .Values.clickhouse.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clickhouse.serviceAccountName" . }}
  namespace: {{ include "clickhouse.namespace" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  {{- include "clickhouse.serviceAccountAnnotations" . | nindent 2 }}
{{- include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.clickhouse.imagePullSecrets)) | nindent 0 }}
{{- end }}
{{- end }}
