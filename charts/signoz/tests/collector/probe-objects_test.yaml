# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: collector/probe-objects
templates:
  - templates/otel-collector/deployment.yaml
  - templates/otel-collector/configmap.yaml
tests:
  - it: renders no probe on the collector for a probe set to null
    template: templates/otel-collector/deployment.yaml
    set:
      otelCollector.livenessProbe: null
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "collector")].livenessProbe
      - exists:
          path: spec.template.spec.containers[?(@.name == "collector")].readinessProbe
  - it: renders a tcpSocket probe with a single handler when httpGet is set to null
    template: templates/otel-collector/deployment.yaml
    set:
      otelCollector.readinessProbe:
        httpGet: null
        tcpSocket:
          port: 13133
        periodSeconds: 20
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name == "collector")].readinessProbe.httpGet
      - equal:
          path: spec.template.spec.containers[?(@.name == "collector")].readinessProbe.tcpSocket.port
          value: 13133
  - it: runs the collector with otelCollector.startupProbe once it is set
    template: templates/otel-collector/deployment.yaml
    set:
      otelCollector.startupProbe:
        httpGet:
          port: 13133
          path: /
        failureThreshold: 36
        periodSeconds: 10
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name == "collector")].startupProbe.failureThreshold
          value: 36
