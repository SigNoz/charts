{{- $keda := .Values.otelCollector.autoscaling.keda }}
{{- if and .Values.otelCollector.autoscaling.enabled $keda.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "otelCollector.fullname" . }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "otelCollector.labels" . | nindent 4 }}
  {{- with $keda.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "otelCollector.fullname" . }}
  {{- /* printed as written: a quoted number in values renders as a number */}}
  pollingInterval: {{ $keda.pollingInterval }}
  cooldownPeriod: {{ $keda.cooldownPeriod }}
  minReplicaCount: {{ $keda.minReplicaCount }}
  maxReplicaCount: {{ $keda.maxReplicaCount }}
  {{- with $keda.triggers }}
  triggers:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
