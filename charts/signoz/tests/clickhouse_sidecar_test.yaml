# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse_sidecar_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
release:
  name: clickhouse
  namespace: signoz
tests:
  - it: There should be 1 extra container, for a total of 2.
    set:
      clickhouse:
        extraContainers:
          - name: clickhouse-backup
            image: altinity/clickhouse-backup:latest
            imagePullPolicy: Always
            args:
              - "server"
            ports:
              - name: backup-rest
                containerPort: 7171
    asserts:
      - lengthEqual:
          path: spec.templates.podTemplates[0].spec.containers
          count: 2
      - contains:
          any: true
          path: spec.templates.podTemplates[0].spec.containers
          content:
            name: clickhouse-backup
            image: altinity/clickhouse-backup:latest
            imagePullPolicy: Always
            args:
              - "server"
            ports:
              - name: backup-rest
                containerPort: 7171
  - it: should run the system logs sidecar as /signoz-otel-collector on v0.144.15 with its resources and no postStart hook on clickhouse
    set:
      clickhouse.logs.system.enabled: true
      clickhouse.logs.system.resources:
        requests:
          cpu: 10m
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[1].image
          value: signoz/signoz-otel-collector:v0.144.15
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[1].command
          value:
            - /signoz-otel-collector
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[1].resources
          value:
            requests:
              cpu: 10m
      - notExists:
          path: spec.templates.podTemplates[0].spec.containers[0].lifecycle
      - notContains:
          path: spec.templates.podTemplates[0].spec.containers[0].volumeMounts
          content:
            name: scripts
            mountPath: /scripts
  - it: should pass clickhouse.containerSecurityContext to the system logs sidecar
    set:
      clickhouse.logs.system.enabled: true
      clickhouse.containerSecurityContext:
        allowPrivilegeEscalation: false
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[1].securityContext
          value:
            allowPrivilegeEscalation: false
  - it: should render no securityContext on the system logs sidecar by default
    set:
      clickhouse.logs.system.enabled: true
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].spec.containers[1].securityContext
