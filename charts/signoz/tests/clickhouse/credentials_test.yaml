# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse/credentials
templates:
  - templates/clickhouse/secret.yaml
  - templates/clickhouse/clickhouseinstallation.yaml
  - templates/signoz/statefulset.yaml
  - templates/otel-collector/deployment.yaml
  - templates/otel-collector/configmap.yaml
  - templates/telemetrystore-migrator/job.yaml
tests:
  - it: stores clickhouse.password in Secret <fullname>-credentials, which every client reads and whose SHA-256 hex ClickHouse reads
    set:
      clickhouse.user: signoz
      clickhouse.password: s3cret
    asserts:
      - template: templates/clickhouse/secret.yaml
        isKind:
          of: Secret
      - template: templates/clickhouse/secret.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-credentials
      - template: templates/clickhouse/secret.yaml
        equal:
          path: stringData.password
          value: s3cret
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["signoz/password_sha256_hex"].valueFrom.secretKeyRef
          value: {name: RELEASE-NAME-clickhouse-credentials, key: password_sha256_hex}
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: &chartSecret
            name: CLICKHOUSE_PASSWORD
            valueFrom: {secretKeyRef: {name: RELEASE-NAME-clickhouse-credentials, key: password}}
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *chartSecret
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.initContainers[?(@.name == "check")].env
          content: *chartSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *chartSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.initContainers[?(@.name == "sync")].env
          content: *chartSecret

  - it: gives ClickHouse only the SHA-256 hex of a clickhouse.password containing & and <, never the plain password
    set:
      clickhouse.user: signoz
      clickhouse.password: "p&ss<w0rd"
    asserts:
      - template: templates/clickhouse/secret.yaml
        equal:
          path: stringData.password_sha256_hex
          value: f096afbbd91fb233b22414bb1fe71e7dfba52a33185d7502894ad4c7e2ebaa6f
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["signoz/password_sha256_hex"].valueFrom.secretKeyRef
          value: {name: RELEASE-NAME-clickhouse-credentials, key: password_sha256_hex}
      - template: templates/clickhouse/clickhouseinstallation.yaml
        notExists:
          path: spec.configuration.users["signoz/password"]

  - it: reads the password from clickhouse.existingSecret under existingSecretPasswordKey, with no chart Secret, in ClickHouse and every client
    set:
      clickhouse.user: signoz
      clickhouse.existingSecret: my-ch
      clickhouse.existingSecretPasswordKey: pw
      clickhouse.existingSecretPasswordSha256Key: ""
    asserts:
      - template: templates/clickhouse/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["signoz/password"].valueFrom.secretKeyRef
          value: {name: my-ch, key: pw}
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: &userSecret
            name: CLICKHOUSE_PASSWORD
            valueFrom: {secretKeyRef: {name: my-ch, key: pw}}
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *userSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *userSecret

  - it: reads the plain password from clickhouse.existingSecret in ClickHouse when existingSecretPasswordSha256Key is empty
    set:
      clickhouse.user: signoz
      clickhouse.existingSecret: my-ch
      clickhouse.existingSecretPasswordKey: pw
      clickhouse.existingSecretPasswordSha256Key: ""
    template: templates/clickhouse/clickhouseinstallation.yaml
    asserts:
      - equal:
          path: spec.configuration.users["signoz/password"].valueFrom.secretKeyRef
          value: {name: my-ch, key: pw}
      - notExists:
          path: spec.configuration.users["signoz/password_sha256_hex"]

  - it: reads the password hash from clickhouse.existingSecret under existingSecretPasswordSha256Key in ClickHouse, while every client reads existingSecretPasswordKey
    set:
      clickhouse.user: signoz
      clickhouse.existingSecret: my-ch
      clickhouse.existingSecretPasswordKey: pw
      clickhouse.existingSecretPasswordSha256Key: pw-sha256
    asserts:
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["signoz/password_sha256_hex"].valueFrom.secretKeyRef
          value: {name: my-ch, key: pw-sha256}
      - template: templates/clickhouse/clickhouseinstallation.yaml
        notExists:
          path: spec.configuration.users["signoz/password"]
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: *userSecret
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *userSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *userSecret

  - it: ignores existingSecretPasswordSha256Key without clickhouse.existingSecret, so ClickHouse reads the chart Secret's hash
    set:
      clickhouse.user: signoz
      clickhouse.existingSecretPasswordSha256Key: pw-sha256
    template: templates/clickhouse/clickhouseinstallation.yaml
    asserts:
      - equal:
          path: spec.configuration.users["signoz/password_sha256_hex"].valueFrom.secretKeyRef
          value: {name: RELEASE-NAME-clickhouse-credentials, key: password_sha256_hex}

  - it: creates clickhouse.user with the password, the allowed networks and the default profile, and every client connects as it
    set:
      clickhouse.user: reader
      clickhouse.allowedNetworkIps: ["10.1.0.0/16"]
    asserts:
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["reader/networks/ip"]
          value: ["10.1.0.0/16"]
      - template: templates/clickhouse/clickhouseinstallation.yaml
        exists:
          path: spec.configuration.users["reader/password_sha256_hex"].valueFrom.secretKeyRef
      - template: templates/clickhouse/clickhouseinstallation.yaml
        equal:
          path: spec.configuration.users["reader/profile"]
          value: default
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: &user {name: CLICKHOUSE_USER, value: reader}
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *user
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *user

  - it: writes the password Secret, with its SHA-256 hex, into clickhouse.namespace too, where ClickHouse reads it
    set:
      clickhouse.namespace: db
      clickhouse.password: "p&ss<w0rd"
    template: templates/clickhouse/secret.yaml
    asserts:
      - equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-credentials
        documentSelector:
          path: metadata.namespace
          value: db
      - equal:
          path: stringData.password_sha256_hex
          value: f096afbbd91fb233b22414bb1fe71e7dfba52a33185d7502894ad4c7e2ebaa6f
        documentSelector:
          path: metadata.namespace
          value: db
      - equal:
          path: metadata.name
          value: RELEASE-NAME-clickhouse-credentials
        documentSelector:
          path: metadata.namespace
          value: NAMESPACE

  - it: stores externalClickhouse.password in Secret <fullname>-credentials, which every client reads, for an external ClickHouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
      externalClickhouse.cluster: c1
      externalClickhouse.password: ext
    asserts:
      - template: templates/clickhouse/secret.yaml
        equal:
          path: stringData.password
          value: ext
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: *chartSecret
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *chartSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *chartSecret

  - it: reads the password from externalClickhouse.existingSecret under its key, with no chart Secret, for an external ClickHouse
    set:
      clickhouse.enabled: false
      externalClickhouse.host: ch.example
      externalClickhouse.cluster: c1
      externalClickhouse.existingSecret: my-ch
      externalClickhouse.existingSecretPasswordKey: pw
    asserts:
      - template: templates/clickhouse/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/signoz/statefulset.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "signoz")].env
          content: *userSecret
      - template: templates/otel-collector/deployment.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "collector")].env
          content: *userSecret
      - template: templates/telemetrystore-migrator/job.yaml
        contains:
          path: spec.template.spec.containers[?(@.name == "async")].env
          content: *userSecret
