{{- $selectorLabels := printf "app.kubernetes.io/name: %s\napp.kubernetes.io/instance: %s\napp.kubernetes.io/component: test-connection" (include "signoz.name" .) .Release.Name }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "signoz.fullname" . }}-test-connection"
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.labels" (dict "chart" (include "signoz.chart" .) "selectorLabels" $selectorLabels "version" .Chart.AppVersion "managedBy" .Release.Service) | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  {{- with include "signoz.lib.imagePullSecrets" (dict "lists" (list .Values.global.imagePullSecrets .Values.imagePullSecrets .Values.signoz.imagePullSecrets)) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- with .Values.signoz.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.signoz.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.signoz.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: wget
      image: {{ include "signoz.lib.image" (dict "registry" .Values.global.imageRegistry "image" .Values.signoz.image "defaultTag" .Chart.AppVersion "name" "signoz.image") }}
      imagePullPolicy: {{ .Values.signoz.image.pullPolicy }}
      command: ['wget']
      args: ['http://{{ include "signoz.url" . }}/api/v1/health?live=1']
      # NOTE: replace the path with version or healthcheck URL after the implementation
  restartPolicy: Never
