{{- if and (eq (include "clickhouse.operatorEnabled" .) "true") .Values.clickhouse.operatorUpgradeHook.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "clickhouse.operatorFullname" . }}-upgrade
  namespace: {{ include "clickhouse.namespace" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
{{- include "clickhouse.imagePullSecrets" . }}
{{- end }}
