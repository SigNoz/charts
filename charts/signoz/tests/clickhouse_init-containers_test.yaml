# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: clickhouse_init-containers_test.yaml
templates:
  - templates/clickhouse/clickhouseinstallation.yaml
release:
  name: clickhouse
  namespace: signoz
tests:
  - it: should render no initContainers when clickhouse.udf.enabled is false
    set:
      clickhouse.udf.enabled: false
    asserts:
      - notExists:
          path: spec.templates.podTemplates[0].spec.initContainers
  - it: should render an extraInitContainers entry after the udf container
    set:
      clickhouse.extraInitContainers:
        - name: busybox
          image: busybox:1.36
          command: ["true"]
    asserts:
      - lengthEqual:
          path: spec.templates.podTemplates[0].spec.initContainers
          count: 2
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[0].name
          value: clickhouse-udf-init
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[1]
          value:
            name: busybox
            image: busybox:1.36
            command: ["true"]
  - it: should render an extraInitContainers entry alone when clickhouse.udf.enabled is false
    set:
      clickhouse.udf.enabled: false
      clickhouse.extraInitContainers:
        - name: busybox
          image: busybox:1.36
          command: ["true"]
    asserts:
      - lengthEqual:
          path: spec.templates.podTemplates[0].spec.initContainers
          count: 1
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[0]
          value:
            name: busybox
            image: busybox:1.36
            command: ["true"]
  - it: should pass clickhouse.udf.env and clickhouse.udf.envFrom to the udf container
    set:
      clickhouse.udf.env:
        - name: HTTPS_PROXY
          value: http://proxy.example.com:3128
      clickhouse.udf.envFrom:
        - secretRef:
            name: mirror-credentials
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[0].env
          value:
            - name: HTTPS_PROXY
              value: http://proxy.example.com:3128
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[0].envFrom
          value:
            - secretRef:
                name: mirror-credentials
  - it: should rewrite the udf image with global.imageRegistry like the clickhouse image
    set:
      global.imageRegistry: mirror.example.com
    asserts:
      - equal:
          path: spec.templates.podTemplates[0].spec.initContainers[0].image
          value: mirror.example.com/clickhouse/clickhouse-server:25.12.5
      - equal:
          path: spec.templates.podTemplates[0].spec.containers[0].image
          value: mirror.example.com/clickhouse/clickhouse-server:25.12.5
