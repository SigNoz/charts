# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
# CLICKHOUSE_PASSWORD in the containers that connect to ClickHouse, and the values clickhouse.env requires.
suite: clickhouse_credentials-env_test.yaml
templates:
  - templates/otel-collector/configmap.yaml
  - templates/otel-collector/deployment.yaml
  - templates/telemetrystore-migrator/job.yaml
release:
  name: signoz
  namespace: platform
tests:
  - it: otel-collector reads CLICKHOUSE_PASSWORD from the chart's Secret
    template: templates/otel-collector/deployment.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
  - it: fails without externalClickhouse.host when clickhouse.enabled is false
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "externalClickhouse.host is required if not clickhouse.enabled"
  - it: fails without externalClickhouse.cluster when clickhouse.enabled is false
    template: templates/telemetrystore-migrator/job.yaml
    set:
      clickhouse.enabled: false
      externalClickhouse.host: clickhouse.example.com
      externalClickhouse.cluster: ""
    asserts:
      - failedTemplate:
          errorPattern: "externalClickhouse.cluster is required if not clickhouse.enabled"
  - it: telemetrystore-migrator reads CLICKHOUSE_PASSWORD from the chart's Secret on install
    template: templates/telemetrystore-migrator/job.yaml
    asserts:
      - contains:
          path: spec.template.spec.initContainers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
  - it: telemetrystore-migrator reads CLICKHOUSE_PASSWORD from the chart's Secret on upgrade
    template: templates/telemetrystore-migrator/job.yaml
    release:
      upgrade: true
    asserts:
      - contains:
          path: spec.template.spec.initContainers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
      - contains:
          path: spec.template.spec.containers[*].env
          content:
            name: CLICKHOUSE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: signoz-clickhouse-credentials
                key: password
