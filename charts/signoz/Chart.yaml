apiVersion: v2
name: signoz
version: 0.149.0
appVersion: "v0.149.0"
description: SigNoz Observability Platform Helm Chart
type: application
home: https://signoz.io/
icon: https://signoz.io/img/SigNozLogo-orange.svg
keywords:
  - SigNoz
  - opentelemetry
  - apm
  - monitoring
  - distributed tracing
  - distributed logging
sources:
  - https://github.com/signoz/charts
  - https://github.com/signoz/signoz
  - https://github.com/signoz/signoz-otel-collector
dependencies:
  - name: altinity-clickhouse-operator
    repository: https://helm.altinity.com
    version: 0.27.4
    condition: altinity-clickhouse-operator.enabled,clickhouse.enabled
  - name: zookeeper
    repository: file://../zookeeper
    version: 0.0.1
    condition: zookeeper.enabled,clickhouse.enabled
  - name: signoz-otel-gateway
    repository: https://charts.signoz.io
    condition: signoz-otel-gateway.enabled
    version: 0.0.4
  - name: redpanda
    repository: https://charts.signoz.io
    condition: redpanda.enabled
    version: 5.10.2
  - name: postgresql
    repository: https://charts.signoz.io
    condition: postgresql.enabled
    version: 0.0.2
maintainers:
  - name: SigNoz
    email: hello@signoz.io
    url: https://signoz.io