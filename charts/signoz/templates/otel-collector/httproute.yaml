{{- if .Values.otelCollector.httpRoute.enabled }}
{{- $route := .Values.otelCollector.httpRoute }}
{{- $fullName := include "otelCollector.fullname" . }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ include "signoz.namespace" . }}
  labels:
    {{- include "signoz.lib.mergedMap" (dict "maps" (list (include "otelCollector.labels" . | fromYaml) $route.labels)) | nindent 4 }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $route.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $route.rules | default (list (dict "backendRefs" (list (dict)))) }}
    {{- $rule := deepCopy . }}
    {{- with $rule.backendRefs }}
    {{- $refs := list }}
    {{- range . }}
    {{- $ref := merge (deepCopy .) (dict "name" $fullName) }}
    {{- if not $ref.port }}
    {{- $_ := set $ref "port" (index $.Values.otelCollector.ports "otlp-http" "servicePort") }}
    {{- end }}
    {{- $refs = append $refs $ref }}
    {{- end }}
    {{- $_ := set $rule "backendRefs" $refs }}
    {{- end }}
    - {{ toYaml $rule | nindent 6 | trim }}
    {{- end }}
{{- end }}
